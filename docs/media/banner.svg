<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="JoJo Arena">
  <title>JoJo Arena</title>
  <desc>Un arena fighter 1v1 en pixel art, fan game de JoJo's Bizarre Adventure.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f3d"/>
      <stop offset="60%" stop-color="#191226"/>
      <stop offset="100%" stop-color="#0f0b17"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d98b2b"/>
      <stop offset="40%" stop-color="#f0c23c"/>
      <stop offset="50%" stop-color="#fff6d0"/>
      <stop offset="60%" stop-color="#f0c23c"/>
      <stop offset="100%" stop-color="#d98b2b"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1.2 0; 1.2 0; -1.2 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a5ce0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7a48c8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7a48c8" stop-opacity="0"/>
    </radialGradient>

    <!-- One manga speed line, repeated around the title. -->
    <polygon id="ray" points="0,-1.6 430,-12 430,12 0,1.6" fill="#f0c23c"/>

  </defs>

  <rect width="960" height="240" fill="url(#night)"/>

  <!-- Speed lines bursting out of the middle, turning slowly. -->
  <g transform="translate(480 120)" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      from="0" to="360" dur="60s" repeatCount="indefinite"/>
    <g opacity="0.30">
      <use href="#ray" transform="rotate(4)"/>
      <use href="#ray" transform="rotate(38)"/>
      <use href="#ray" transform="rotate(79)"/>
      <use href="#ray" transform="rotate(121)"/>
      <use href="#ray" transform="rotate(166)"/>
      <use href="#ray" transform="rotate(203)"/>
      <use href="#ray" transform="rotate(248)"/>
      <use href="#ray" transform="rotate(292)"/>
      <use href="#ray" transform="rotate(331)"/>
      <animate attributeName="opacity" values="0.18;0.42;0.18" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- The aura, breathing behind the name. -->
  <ellipse cx="480" cy="104" rx="330" ry="86" fill="url(#aura)">
    <animate attributeName="rx" values="310;348;310" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="80;94;80" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ORA ORA ORA one way, MUDA MUDA the other: the background noise of a JoJo fight. -->
  <g font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="30" opacity="0.13" fill="#f0c23c">
    <text x="0" y="40">
      ORA ORA ORA ORA ORA ORA ORA ORA ORA ORA ORA ORA
      <animate attributeName="x" values="-320;0;-320" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="30" opacity="0.13" fill="#7ab8f0">
    <text x="0" y="214">
      MUDA MUDA MUDA MUDA MUDA MUDA MUDA MUDA MUDA MUDA
      <animate attributeName="x" values="0;-320;0" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- The menace, rising in four places, each on its own beat. -->
  <g font-family="'Noto Sans JP','Yu Gothic','Hiragino Kaku Gothic ProN','MS PGothic',sans-serif" font-weight="700" font-size="44" fill="#9a5ce0">
    <text x="58" y="196" opacity="0.2">ゴ
      <animate attributeName="opacity" values="0.08;0.60;0.08" dur="2.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -8;0 12"
        dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="112" y="208" opacity="0.2">ゴ
      <animate attributeName="opacity" values="0.08;0.60;0.08" dur="2.2s" begin="0.28s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -8;0 12"
        dur="2.2s" begin="0.28s" repeatCount="indefinite"/>
    </text>
    <text x="812" y="86" opacity="0.2">ゴ
      <animate attributeName="opacity" values="0.08;0.60;0.08" dur="2.2s" begin="0.56s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -8;0 12"
        dur="2.2s" begin="0.56s" repeatCount="indefinite"/>
    </text>
    <text x="868" y="68" opacity="0.2">ゴ
      <animate attributeName="opacity" values="0.08;0.60;0.08" dur="2.2s" begin="0.84s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -8;0 12"
        dur="2.2s" begin="0.84s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- The name: a heavy black outline, gold inside, and it will not hold still. -->
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -1.5 1; 1.5 -1; 0 0" dur="0.5s" repeatCount="indefinite"/>
      <text x="480" y="116" font-size="80" fill="#120d1c" stroke="#120d1c" stroke-width="16"
            stroke-linejoin="round">JOJO ARENA</text>
      <text x="480" y="116" font-size="80" fill="url(#gold)">JOJO ARENA</text>
    </g>
    <text x="480" y="150" font-size="18" fill="#cdbbe8" letter-spacing="6">
      ARENA FIGHTER 1v1 &#183; PIXEL ART &#183; FAN GAME
    </text>
  </g>

  <!-- A Ripple running along the line under the name. -->
  <rect x="280" y="170" width="400" height="2" fill="#f0c23c" opacity="0.3"/>
  <rect x="280" y="169" width="96" height="4" rx="2" fill="#fff6d0" opacity="0.9">
    <animate attributeName="x" values="280;584;280" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
