<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="960" height="150" role="img" aria-label="Les chiffres de JoJo Arena">
  <title>Les chiffres de JoJo Arena</title>
  <desc>Compteurs animés.</desc>
  <rect width="960" height="150" fill="#140f1e"/>
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.0s" fill="freeze"/>
    <text x="96.0" y="78" font-size="48" fill="#f0c23c">19
      <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.6s" begin="0.0s" fill="freeze"/>
    </text>
    <text x="96.0" y="104" font-size="14" fill="#cdbbe8" letter-spacing="2">PERSOS JOUABLES</text>
  </g>
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze"/>
    <text x="288.0" y="78" font-size="48" fill="#2ea24a">3
      <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.6s" begin="0.25s" fill="freeze"/>
    </text>
    <text x="288.0" y="104" font-size="14" fill="#cdbbe8" letter-spacing="2">ARÈNES</text>
  </g>
  <rect x="191.5" y="44" width="1" height="54" fill="#7a48c8" opacity="0.35"/>
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <text x="480.0" y="78" font-size="48" fill="#5a9ef0">941
      <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.6s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="480.0" y="104" font-size="14" fill="#cdbbe8" letter-spacing="2">TESTS</text>
  </g>
  <rect x="383.5" y="44" width="1" height="54" fill="#7a48c8" opacity="0.35"/>
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.75s" fill="freeze"/>
    <text x="672.0" y="78" font-size="48" fill="#7a48c8">94 %
      <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.6s" begin="0.75s" fill="freeze"/>
    </text>
    <text x="672.0" y="104" font-size="14" fill="#cdbbe8" letter-spacing="2">COUVERTURE</text>
  </g>
  <rect x="575.5" y="44" width="1" height="54" fill="#7a48c8" opacity="0.35"/>
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze"/>
    <text x="864.0" y="78" font-size="48" fill="#c8403a">60
      <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.6s" begin="1.0s" fill="freeze"/>
    </text>
    <text x="864.0" y="104" font-size="14" fill="#cdbbe8" letter-spacing="2">IMAGES/SEC FIXES</text>
  </g>
  <rect x="767.5" y="44" width="1" height="54" fill="#7a48c8" opacity="0.35"/>
  <rect x="0" y="128" width="960" height="2" fill="#f0c23c" opacity="0.25"/>
  <rect x="0" y="127" width="120" height="4" rx="2" fill="#fff6d0">
    <animate attributeName="x" values="-120;960;-120" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
