<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 282" width="960" height="282" role="img" aria-label="Les altérations d'état">
  <title>Les altérations d'état</title>
  <desc>Feu, gel, courant.</desc>
  <rect width="960" height="282" fill="#140f1e"/>
  <text x="26" y="36" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="17" fill="#f0c23c">CE QU'UN COUP LAISSE DERRIÈRE LUI</text>
  <rect x="26" y="54" width="908" height="56" rx="6" fill="#f0901c" opacity="0.07"/>
  <circle cx="60" cy="82" r="15" fill="#f0901c" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.4s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="82" r="7" fill="#f0901c">
    <animate attributeName="r" values="6;9;6" dur="1.4s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="78" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="16" fill="#f0901c">FEU</text>
  <text x="92" y="98" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="12" fill="#cdbbe8">sang bouillant, lance-flammes</text>
  <text x="330" y="78" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="13" fill="#fff6d0">la plaie ne se referme plus</text>
  <text x="330" y="98" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="11" fill="#cdbbe8">2.6 s au plus, relancé par un second coup, jamais empilé</text>
  <rect x="700" y="72" width="220" height="12" rx="3" fill="#7a48c8" opacity="0.25"/>
  <rect x="700" y="72" width="220" height="12" rx="3" fill="#f0901c">
    <animate attributeName="width" values="220;0" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="26" y="128" width="908" height="56" rx="6" fill="#9ad8ff" opacity="0.07"/>
  <circle cx="60" cy="156" r="15" fill="#9ad8ff" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="156" r="7" fill="#9ad8ff">
    <animate attributeName="r" values="6;9;6" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="152" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="16" fill="#9ad8ff">GEL</text>
  <text x="92" y="172" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="12" fill="#cdbbe8">congélation par vaporisation</text>
  <text x="330" y="152" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="13" fill="#fff6d0">ni onde respirée, ni sang bu</text>
  <text x="330" y="172" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="11" fill="#cdbbe8">2.2 s au plus, relancé par un second coup, jamais empilé</text>
  <rect x="700" y="146" width="220" height="12" rx="3" fill="#7a48c8" opacity="0.25"/>
  <rect x="700" y="146" width="220" height="12" rx="3" fill="#9ad8ff">
    <animate attributeName="width" values="220;0" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="26" y="202" width="908" height="56" rx="6" fill="#f0d020" opacity="0.07"/>
  <circle cx="60" cy="230" r="15" fill="#f0d020" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="230" r="7" fill="#f0d020">
    <animate attributeName="r" values="6;9;6" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="226" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="700" font-size="16" fill="#f0d020">COURANT</text>
  <text x="92" y="246" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="12" fill="#cdbbe8">l'onde conduite par une écharpe</text>
  <text x="330" y="226" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="13" fill="#fff6d0">la garde se défait</text>
  <text x="330" y="246" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="11" fill="#cdbbe8">1.8 s au plus, relancé par un second coup, jamais empilé</text>
  <rect x="700" y="220" width="220" height="12" rx="3" fill="#7a48c8" opacity="0.25"/>
  <rect x="700" y="220" width="220" height="12" rx="3" fill="#f0d020">
    <animate attributeName="width" values="220;0" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>
