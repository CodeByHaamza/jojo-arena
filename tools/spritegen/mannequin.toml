# Generic training mannequin: a neutral wooden-doll body, the base every look builds on.
# Its colors are "key" colors that the game swaps per palette (see [recolor] in the
# generated sheet), so one sheet serves several placeholder fighters.

name = "Mannequin"
recolor = ["body", "trim"]

[palette]
# Exact tones (dark, mid, light, highlight), not computed: the game looks for them.
body = ["#44444c", "#74747c", "#a4a4ac", "#d4d4dc"]
trim = ["#4e3e36", "#766052", "#a08672"]

[body]
head = "body"
torso = "body"
arms = "body"
hands = "trim"
legs = "body"
feet = "trim"

[face]
eyes = "outline"
tall_eyes = false

[[parts]]
type = "belt"
material = "trim"

[[parts]]
type = "seam"
material = "trim"
