# Global fight rules (GDD "Règles globales"). Starting values, to tune in playtests.
# Units: pixels, seconds, pixels per second. Keys ending in _f are frames at 60 per second.

[body]
radius = 8            # collision circle at the feet
hurt_radius = 10      # hurtbox circle, on the ground plane
walk_speed = 108      # default; a character file can override it

[knockback]
friction = 900        # px/s² slowdown of a body sent flying
obstacle_damage_per_speed = 0.2   # a body slammed into a prop damages it (speed × this)

[guard]
damage_reduction = 0.8   # a blocked hit deals 20 % of its damage
gauge_max = 100
gauge_per_damage = 0.35  # guard gauge lost per point of the blocked hit's full damage
regen_delay_s = 1.0      # time without blocking before the gauge refills
regen_per_s = 25
break_stun_s = 1.5       # Guard Break
blockstun_ratio = 0.6    # blockstun = hitstun × this
pushback_ratio = 0.5     # knockback × this when blocked
arc_deg = 180            # the guard covers the front half; hits from behind get through

[dash]
duration_f = 13
speed = 360
invincible_f = 10        # first frames of the dash
recovery_f = 5
cancel_on_hit = true     # a blow that lands can be cancelled into a dash
stylish_window_f = 6     # an attack dodged during these first frames = Stylish Evade
stylish_slowmo_s = 0.5   # the game runs at half speed this long

[heart_heat]
bar_size = 100
bars = 3
gain_per_damage_dealt = 0.15  # HH earned per point of damage dealt
gain_per_damage_taken = 0.1   # HH earned per point of damage taken
block_gain_ratio = 0.5        # gains are halved when the hit is blocked
stylish_gain = 15
pose_gain_per_s = 20
hha_cost = 100                # Heart Heat Attack: 1 bar
gha_cost = 200                # Great Heat Attack: 2 bars (same key, used when 2 bars are full)
super_freeze_s = 0.4          # everything stops while the HHA flashes
flash_cancel_cost = 50        # half a bar
flash_cancel_freeze_f = 6

[resolve]
threshold = 0.25              # under 25 % life...
damage_bonus = 0.15           # ...+15 % damage, and blocked hits deal no chip damage

[round]
timer_s = 99
intro_s = 2.0                 # "ROUND 1" then "FIGHT!", nobody can move
outro_s = 3.0                 # KO / time up shown before the next round
ko_slowmo_s = 1.0             # the knockout plays in slow motion
sudden_death_hp = 1           # tie for the win: both start with this much life, no timer
carry_heart_heat = true       # the Heart Heat gauge is kept from one round to the next

[combo]
full_moves = 2               # the first moves of a combo deal full damage...
step = 0.12                  # ...then each further move deals this share less...
min_scale = 0.45             # ...down to this share (a rush counts as one move)

[counter]
freeze_f = 10                # both freeze when a counter catches a blow

[control]
# Remote control of a long-range Stand (GDD "Mode contrôle").
hold_s = 0.5                 # hold the Stand key this long to take control
break_stun_s = 0.8           # hit while controlling: the Stand snaps back, stunned

[throw]
# Props: Pose near one, the Stand grabs it; Pose again, the Stand throws it. A kit's
# `strength` multiplies the speed, damage and knockback of its throws.
reach = 10                   # px between the body and a prop to pick it up
carry_speed_mult = 1.0       # the Stand carries it: its user walks as usual
strong_throw = 1.5           # from this strength on, a throw sends the victim into a wall bounce
speed = 380
radius = 6
lifetime_s = 1.2
hitstun_f = 26
knockback = 260
hitstop_f = 8

[prop_swing]
# Carrying a prop, the heavy button swings it: slow to come out, heavy, and wide.
# A fighter who does not hold it in his hands (kit: prop_hold = "hair" or "tendrils")
# swings it from the length of his hair, or of his Stand's tendrils, not of an arm.
startup_f = 16
active_f = 5
recovery_f = 26
damage = 72
reach = 16
radius = 17
hitstun_f = 32
knockback = 330
hitstop_f = 10
wrapped_reach = 46
wrapped_radius = 26
wrapped_damage = 84
wrapped_throw = 0.7          # ...but there is far less of him behind a throw

[training]
refill_after_s = 1.0          # infinite life: it refills once the fighter has recovered this long

[clash]
# Two attacks becoming active within window_f frames of each other, and touching,
# start a clash: both players mash attack buttons, the one who mashed less loses.
window_f = 3
duration_s = 5.0
loser_damage = 160
loser_knockback = 420
loser_hitstun_f = 40
tie_knockback = 240           # draw: both are pushed back, no damage
spacing = 46                  # the two step apart so their barrages meet between them

[hamon]
# Hamon fighters (GDD "Hamon en détail"): hold the style key to breathe.
max = 100
start = 40                    # each round starts with this much Hamon
breath_per_s = 25             # breathing fills the gauge, standing still and open to hits
boost_mult = 1.4              # a boosted move (its hamon_cost paid) hits this much harder
weak_natures = ["vampire", "zombie", "pillar_man"]
vs_weak_mult = 2.0            # Hamon on vampires, zombies and Pillar Men
regen_block_s = 3.0           # a Hamon hit stops a vampire's healing this long

[vampire]
# Vampires (GDD "Vampire / Pillar Man"): the blood gauge.
blood_max = 100
blood_start = 30
blood_per_drain = 1.0         # blood gained per point of life drained
regen_delay_s = 1.5           # untouched this long, they start to heal...
regen_per_s = 14              # ...this much life per second...
regen_blood_per_hp = 0.5      # ...spending this much blood per point healed
stance_min_blood = 10         # the freezing stance needs at least this much blood...
stance_blood_per_s = 6        # ...and burns this much per second while it lasts

[sun]
# Sunlight (some arenas, late in the round): it burns the undead and fuels the Hamon.
undead_natures = ["vampire", "zombie", "pillar_man"]
blood_per_s = 25              # it boils their blood away...
damage_per_s = 30             # ...then burns them, and the fire takes hold:
burn_ramp_s = 5               # after this long without shade the burn is at its worst...
burn_max_mult = 3.5           # ...this many times faster. Standing in it is a death.
burn_cool_per_f = 3           # out of the light, that build-up drops this fast per frame
hamon_breath_mult = 1.5       # Hamon breathing fills faster in the sun

[stance]
switch_f = 12                 # time to bring the Stand out or call it back

[stand]
# A Stand that is out has a body: a hit on it hurts its user (GDD "Stand touché").
hurt_radius = 9
front = 13                    # px in front of its user when it strikes
back = 8                      # px behind its user the rest of the time...
side = 6                      # ...and slightly to the side

[time_stop]
flash_s = 0.35                # everything holds while the time stop is announced
resist_first_s = 1.0          # a time stopper caught in the other's time stop can move this long...
resist_growth_s = 0.5         # ...plus this much more each time it happens again in the match
damage_mult = 0.8            # blows landed in stopped time hit a little softer
projectile_flight_f = 8       # projectiles thrown in stopped time fly this long, then hang in the air

[wall_bounce]
min_speed = 150       # px/s; slower bodies just stop against the wall
keep = 0.45           # share of the speed kept after the bounce
stun_f = 14           # extra hitstun after a bounce
damage = 20
