# The Joestar mansion in flames (GDD: "Manoir Joestar en flammes", Part 1).
# Parquet and a worn carpet, the walls burning; through the tall windows of the north
# wall, dawn comes in late in the round, and the sun burns the undead who stand in it.
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "Le manoir Joestar en flammes"
name_en = "The Joestar mansion in flames"
part = 1

[bounds]
rect = [16, 40, 448, 212]
corner_radius = 10

[spawns]
p1 = [150, 146]
p2 = [330, 146]

# Dawn: from this time into the round (the round lasts 99 s), the sun shines in
# through the windows onto these patches of floor.
[sun]
after_s = 60

[[sun.windows]]
rect = [70, 40, 44, 92]

[[sun.windows]]
rect = [218, 40, 44, 92]

[[sun.windows]]
rect = [366, 40, 44, 92]

[prop_kinds.pillar]
hp = 160

# Vases and chairs can be picked up (Pose key) and thrown; once broken they come back
# to their place after respawn_s.
[prop_kinds.vase]
hp = 20
throwable = true
throw_damage = 35
respawn_s = 8

[prop_kinds.chair]
hp = 40
throwable = true
throw_damage = 45
respawn_s = 10

[[props]]
kind = "pillar"
rect = [60, 200, 14, 14]

[[props]]
kind = "pillar"
rect = [406, 200, 14, 14]

[[props]]
