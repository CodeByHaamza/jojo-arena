# The Joestar mansion in flames (GDD: "Manoir Joestar en flammes", Part 1).
# Parquet and a worn carpet, the walls burning; through the tall windows of the north
# wall, dawn comes in late in the round, and the sun burns the undead who stand in it.
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "Le manoir Joestar en flammes"
name_en = "The Joestar mansion in flames"
part = 1

[bounds]
rect = [16, 40, 448, 212]
corner_radius = 10

[spawns]
p1 = [150, 146]
p2 = [330, 146]

# Dawn: from this time into the round (the round lasts 99 s), the sun shines in
# through the windows; the patches below are where it lands first, and they grow.
[sun]
after_s = 60
# From dawn, the beams take this long to stretch from the windows to the far wall.
# Until then there is shadow to fight in; after that, a vampire has nowhere left.
spread_s = 22

[[sun.windows]]
rect = [70, 40, 44, 92]

[[sun.windows]]
rect = [218, 40, 44, 92]

[[sun.windows]]
rect = [366, 40, 44, 92]

# Event: the chandelier. It gives way every 30 s over whoever's turn it is (it takes
# turns), its shadow growing on the floor first; whatever is under it when it lands is
# crushed through any guard, and its wreck lies there a moment. Not a scene of this
# mansion in the manga - the chandelier that comes down on everyone is in Dio's castle
# (Phantom Blood, chapter 39) - but the owner asked for it here, the way Eyes of Heaven
# gives each arena its own hazard. Off with the "events" option of the arena screen.
[[drops]]
look = "chandelier"
spots = [[150, 128], [240, 146], [330, 128]]
first_s = 20
every_s = 30
warning_s = 1.6
radius = 26
damage = 120
hitstun_f = 40
knockback = 260
wreck_s = 4

[prop_kinds.pillar]
hp = 160

# Vases and chairs can be picked up (Pose key) and thrown; once broken they come back
# to their place after respawn_s.
[prop_kinds.vase]
hp = 20
throwable = true
throw_damage = 35
respawn_s = 8

[prop_kinds.chair]
hp = 40
throwable = true
throw_damage = 45
respawn_s = 10

[[props]]
kind = "pillar"
rect = [60, 200, 14, 14]

[[props]]
