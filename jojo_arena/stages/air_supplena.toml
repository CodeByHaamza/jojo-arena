# Air Supplena Island (Part 2): Lisa Lisa's island in the Adriatic, half an hour by boat
# north of Venice, where Joseph and Caesar train the Ripple.
# Sources (searched 18/10/2026; JoJo Wiki "Air Supplena Island", "Ripple Teacher Lisa
# Lisa (Story Arc)", chapter 72): the Hell Climb Pillar, 24 m high, with oil flowing over
# it in a loop like a fountain; only the Ripple lets a body stick to it, and Lisa Lisa
# kicks the boys down into the oil. In Eyes of Heaven, the spikes of this stage hurt
# every fighter except Ripple users - so they do here too.
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "L'île d'Air Supplena"
name_en = "Air Supplena Island"
part = 2
outdoors = true

[bounds]
rect = [16, 42, 448, 210]
corner_radius = 18

[spawns]
p1 = [128, 150]
p2 = [352, 150]

# Open sky over the Adriatic: once the sun is up, it comes down over the whole island
# from the north, and nothing is left in the shade.
[sun]
after_s = 58
spread_s = 26
widen = 0.0

[[sun.windows]]
rect = [16, 42, 448, 12]

# The pool of oil at the foot of the Hell Climb Pillar. A body slides on it - unless it
# breathes the Ripple, which is how Joseph and Caesar stood on oil at all.
[[surfaces]]
look = "oil"
rect = [180, 98, 120, 92]
grip = 0.07
slide = 0.3
spare_style = "hamon"

# Event: the spiked pits on either side. Knocked into one, the spikes come up; Ripple
# users are spared (Eyes of Heaven). Off with the "events" option of the arena screen.
[[trap_zones]]
look = "spikes"
rect = [22, 96, 44, 104]
damage = 90
hitstun_f = 34
knockback = 280
min_speed = 110
rearm_s = 1.2
spare_style = "hamon"

[[trap_zones]]
look = "spikes"
rect = [414, 96, 44, 104]
damage = 90
hitstun_f = 34
knockback = 280
min_speed = 110
rearm_s = 1.2
spare_style = "hamon"

# The Hell Climb Pillar itself: it does not break.
[prop_kinds.hell_pillar]
hp = 0

[prop_kinds.column]
hp = 150

# Amphorae from the villa can be picked up (Pose key) and thrown; broken, they come back.
[prop_kinds.amphora]
hp = 22
throwable = true
throw_damage = 38
respawn_s = 9

