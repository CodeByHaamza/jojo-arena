# The Swiss castle (Part 2): the hall where the Pillar Men slept, high in the Alps.
# Cold flagstones, snow blowing in through the arched windows of the north wall, braziers
# against the cold, and the carved pillars they came out of. The sun rises late over the
# mountains - and in this hall it is the sun that ends the fight.
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "Le château suisse"
name_en = "The Swiss castle"
part = 2

[bounds]
rect = [16, 42, 448, 210]
corner_radius = 12

[spawns]
p1 = [140, 150]
p2 = [340, 150]

# Dawn over the Alps: it comes later than in the mansion, and once it is up the hall has
# almost no shadow left. For a Pillar Man, a vampire or a zombie, that is the clock.
[sun]
after_s = 55
spread_s = 20
# Four windows, and the beams widen until the shadow between them is a thin strip:
# in this hall an undead fighter has to keep moving, and then it runs out of floor.
widen = 1.1

[[sun.windows]]
rect = [58, 42, 40, 76]

[[sun.windows]]
rect = [168, 42, 40, 76]

[[sun.windows]]
rect = [278, 42, 40, 76]

[[sun.windows]]
rect = [388, 42, 40, 76]

# Event: the way out. Slam somebody into the north wall hard enough to bounce off it
# and it gives way: the fight goes on outside, in the snow of St. Moritz (st_moritz.toml),
# where nobody keeps their footing. Off with the "events" option of the arena screen.
[[exits]]
rect = [16, 30, 448, 34]
to = "st_moritz"

# The pillars the Pillar Men came out of: solid, and they take a beating.
[prop_kinds.pillar]
hp = 200

# Braziers and crates can be picked up (Pose key) and thrown; broken, they come back.
[prop_kinds.brazier]
hp = 30
throwable = true
throw_damage = 48
respawn_s = 10

[prop_kinds.crate]
hp = 40
throwable = true
throw_damage = 42
respawn_s = 9

[[props]]
