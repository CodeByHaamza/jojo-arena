# Death Thirteen's dream: the nightmare where its scythe is law (GDD: "Rêve de Death 13",
# asked for by the owner on 17/11/2026, with Death 13 passing by to swing its scythe).
#
# Sources, read on 17/11/2026:
# - JoJo Wiki, Eyes of Heaven stage data, "Nightmare World" (悪夢世界): "Death Thirteen
#   wanders the stage and attacks fighters with its scythe"; its Stand "has a health bar
#   of its own", so it can be attacked and banished for a while.
# - JoJo Wiki, "Death Thirteen": its dream world is a fairy-tale amusement park, Ferris
#   wheels, carousels, spinning teacups and colourful balloons; in a fight it relies on
#   sweeps of its scythe, and it is fragile (Hierophant Green beat it easily). It shouts
#   "La Li Ho!".
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "Le rêve de Death 13"
name_en = "Death 13's dream"
part = 3

