# St. Moritz (Part 2): outside Gessler's hotel, the Pillar Men's hideout in the Swiss
# Alps. Never picked on the arena screen: it is where a fight in the Swiss castle goes on
# once somebody has been slammed through the hall's north wall (the castle's event).
# Sources (searched 18/10/2026; JoJo Wiki "Gessler's Hotel", "St. Moritz", Battle
# Tendency chapter 44): the abandoned hotel in St. Moritz, once a 14th-century fortress
# of Albrecht Gessler, is where Kars and Wamuu and their vampires wait out the day; Lisa
# Lisa, Caesar and Messina find it and call Joseph over. Switzerland: snowy mountains.
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "St. Moritz, devant l'hôtel"
name_en = "St. Moritz, outside the hotel"
part = 2
outdoors = true

[bounds]
rect = [16, 46, 448, 206]
corner_radius = 20

[spawns]
p1 = [140, 156]
p2 = [340, 156]

# Out in the open, dawn over the mountains reaches every inch of the snow.
[sun]
after_s = 52
spread_s = 24
widen = 0.0

[[sun.windows]]
rect = [16, 46, 448, 12]

# The packed snow of the courtyard: nothing grips. The path dug to the hotel door
# (first, so it wins where they overlap) holds a little better.
[[surfaces]]
look = "path"
rect = [212, 46, 56, 206]
grip = 0.45
slide = 0.7

[[surfaces]]
look = "snow"
grip = 0.12
slide = 0.45

# Event (made for this game, not a scene of the manga): the snow on the hotel roof lets
# go in slabs along the north wall, its shadow first. Off with the "events" option.
[[drops]]
look = "snow_slab"
spots = [[90, 72], [180, 70], [300, 70], [390, 72]]
first_s = 16
every_s = 18
warning_s = 1.4
radius = 22
damage = 70
hitstun_f = 30
knockback = 200
wreck_s = 5

[prop_kinds.tree]
hp = 0

[prop_kinds.snowman]
hp = 30

# Barrels by the door can be picked up (Pose key) and thrown; broken, they come back.
[prop_kinds.barrel]
hp = 36
throwable = true
throw_damage = 44
respawn_s = 9

[[props]]
kind = "tree"
rect = [60, 196, 14, 14]

[[props]]
kind = "tree"
rect = [406, 196, 14, 14]

[[props]]
kind = "snowman"
rect = [120, 214, 12, 12]

[[props]]
kind = "barrel"
rect = [196, 64, 11, 11]

[[props]]
kind = "barrel"
rect = [274, 64, 11, 11]

