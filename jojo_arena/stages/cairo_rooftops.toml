# The rooftops of Cairo, at night (GDD: "Toits du Caire", asked for with holes in the roof
# by the owner on 17/11/2026, "comme Eyes of Heaven").
#
# Source, read on 17/11/2026: JoJo Wiki, Eyes of Heaven stage data, "Cairo Rooftops"
# (カイロ市街屋上): knocked into the neon "AIR" sign, its letters fail and fall forward,
# hurting whoever is under them; a clock tower in one corner has its own large health
# and collapses once beaten down; the Situation Finish throws the loser into a water
# tower, Kakyoin's death scene. The holes in the roof are the owner's: the wiki's
# description does not mention them (said in the report).
# Coordinates are internal pixels (screen is 480 x 270). Rects are [x, y, width, height].

name = "Les toits du Caire"
name_en = "The rooftops of Cairo"
part = 3

[bounds]
rect = [16, 40, 448, 212]
corner_radius = 4

[spawns]
p1 = [140, 150]
p2 = [340, 150]

# The neon "AIR" sign along the top edge: slammed into it, its letters come down.
[[trap_zones]]
look = "neon"
rect = [178, 40, 124, 22]
damage = 60
hitstun_f = 30
knockback = 220
min_speed = 90
rearm_s = 4

# Holes in the roof: knocked into one, a fall through to the floor below.
[[trap_zones]]
