shout = "MAÎTRESSE DU HAMON !"
shout_en = "RIPPLE MASTER!"
label = "MAÎTRESSE DU HAMON"
label_en = "RIPPLE MASTER"
info = "Elle glisse et frappe du plat de la main. Ouvre la Chaîne d'Onde : 3 suites possibles"
info_en = "She slides in and strikes with her hand. Opens the Ripple Chain: three ways on"
