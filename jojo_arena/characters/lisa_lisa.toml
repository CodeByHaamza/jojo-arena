[stances.base.moves.light]
label = "COUP D'ÉCHARPE"
label_en = "SCARF FLICK"
info = "L'écharpe claque à mi-distance. Encore la touche : revers, puis fouet de Hamon"
info_en = "The scarf snaps at mid range. Press again: backhand, then Hamon lash"
shape = "line"
fx = "scarf"
startup_f = 7
active_f = 3
recovery_f = 12
damage = 24
reach = 34
radius = 6
hitstun_f = 18
knockback = 70
hitstop_f = 4
cancel_on_hit = ["light", "heavy", "special"]
chain = "light2"
anim = "light"

