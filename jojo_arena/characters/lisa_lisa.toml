# Lisa Lisa (Part 2). GDD: "Hamon · Contrôle": elegant and acrobatic, counters.
# Her Ripple Chain (ASBR) is hers alone: one starter, three ways on, three ways to end. Her scarf, woven from
# Satiporoja beetle silk, carries the Hamon perfectly: a long-range whip that can turn
# stiff as a spear. Her guard bonus: the Snake Muffler, a Hamon parry that sends back
# what comes at her. Great Heat Attack: the scarf trap, wrapped and set ablaze with Hamon.
# Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# Style key held: Hamon breathing. Feel: poised, never hurried; a pirouette, a flip over
# the opponent's head, and the scarf is already where they are going.

name = "Lisa Lisa"
max_hp = 900
walk_speed = 98
style = { type = "hamon" }

[stances.base]
label = "HAMON"

# The Ripple Chain (波紋チェイン): her signature in All-Star Battle R, and the only one
# in the roster. The first blow opens it, three buttons carry it on, three end it - so
# what is coming next cannot be read from the first hit.
