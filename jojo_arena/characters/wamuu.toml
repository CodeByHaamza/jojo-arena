# Wamuu (Part 2) - Pillar Man of the wind. GDD: "Homme du Pilier - Guerrier d'honneur":
# enormous reach and strength, slow to start, and a Mode that turns every blow into wind.
# Frames (_f) are at 60 per second; speeds and knockback in pixels per second.
#
# Nature "pillar_man": the Ripple burns him double, and the sun burns him outright - in
# the Swiss castle the dawn is his clock.
# Style key: Wind Mode (流法). Bare-handed he is fast and short; in the Mode his blows
# carry the wind, reaching across the arena, but they take longer to come out.
# Feel: a warrior who will not strike a man who cannot answer, and who kills everything
# that can.

name = "Wamuu"
max_hp = 1200
walk_speed = 96
nature = "pillar_man"
style = { type = "stance_toggle", off = "base", on = "wind" }

