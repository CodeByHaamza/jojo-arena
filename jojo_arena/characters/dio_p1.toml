# Dio Brando (Part 1). GDD: "Vampire · Bruiser": aggressive, steals life with his heavy
# blows. Vaporization Freezing: his touch freezes the opponent. Space Ripper Stingy Eyes:
# eye beams to keep them away. Ultimate: Absorption, a grab that drains a big share of
# life. Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# Style key: Vaporization Freezing on or off. It needs some blood, burns it while it
# lasts, and ends when the blood runs dry. Blood fills by draining; untouched, Dio heals
# on it. Hamon burns him (double damage, no healing for a while); so does the sun.

name = "Dio Brando"
max_hp = 1000
walk_speed = 108
strength = 1.5  # a vampire's strength: he throws hard
nature = "vampire"
style = { type = "vampire", off = "base", on = "freeze" }

