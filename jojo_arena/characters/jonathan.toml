# Jonathan Joestar (Part 1). GDD: "Hamon · Tank rushdown": heavy, slow blows, a big
# life (1150), short-range Hamon. Sunlight Yellow Overdrive (his ultimate), a flurry of Hamon
# thrusts with his sword Luck & Pluck, and a barrage of fists that clashes with ORA ORA. Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# Style key held: Hamon breathing (the gauge fills, he stands still). Moves with a
# hamon_cost spend it when there is enough, and strike harder; without, they stay plain.
# Hamon burns vampires and Pillar Men: double damage.
# Feel: a gentleman built like a wall, a rugby player who walks through blows.

name = "Jonathan Joestar"
max_hp = 1150
walk_speed = 94
strength = 1.3  # 195 cm of rugby player: he throws hard
style = { type = "hamon" }

[stances.base]
label = "HAMON"

# Jab, hook, Overdrive: the same button three times, once the first one lands.
[stances.base.moves.light]
label = "DIRECT"
label_en = "JAB"
info = "Lourd pour un coup rapide. Encore la touche : crochet, puis Overdrive"
info_en = "Heavy for a quick blow. Press again: hook, then Overdrive"
