# Joseph Joestar, old (Part 3) - Hermit Purple and the Ripple. GDD: "Stand + Hamon ·
# Trickster": vines that catch from afar and carry the Hamon; a grab across the arena.
#
# Sources, read on 15/11/2026:
# - JoJo Wiki, "Hermit Purple" (https://jojowiki.com/Hermit_Purple): several purple,
#   thorn-covered vines that grow from Joseph's hands, strong enough to hold his weight
#   and long enough to bind a person. No body. Stats D C D A D E. He swings on them from
#   place to place, binds with them, and sends the Ripple through them.
# - JoJo Wiki, ASBR Old Joseph
#   (https://jojowiki.com/All-Star_Battle_R/Old_Joseph_Joestar): HP 950; a long-ranged
#   grappler, a hybrid of the Stand and Ripple styles.
#   * Normals, Stand off: a jab, a short slide into a hip-height kick, a step-in
#     uppercut. "That changes everything!": a kick to the shins from a short run-up.
#   * "Ripple Overdrive!": he slides forward with a Ripple-infused overhead chop;
#     paying for it makes it faster, longer, and it crumples.
#   * "Cunning Tactician": a counter; he wraps the vines round his torso and the next
#     blow shocks the attacker and pushes them away.
#   * "Coal Tar": Hermit Purple brings out a drum of coal tar and spills it; the drum
#     hits twice, and the puddle stays as a trap that makes one slip (his battle with
#     Empress).
#   * Stand on: "Hermit Purple!" (a mid-range vine swing over a wide area, three hits),
#     then "Solar Energy Ripple!" (the opponent is wrapped and the Ripple pulses through
#     the vines); "You gotta stand on your own!" (a low vine that pulls the opponent
#     in); "Take a STAND for it!" (a throw: the vines fan out forward, bind, swing the
#     opponent in a circle and launch them); "Panic isn't in my vocabulary" (Hermit
#     Purple grabs hold above and pulls him away).
#   * Heart Heat Attack "Years of Experience": a counter. Great Heat Attack "Hermit
#     Purple and Ripple!": a long-range vine whip; if it connects he binds, slams,
#     pulls in and ends on a Ripple Overdrive chop to the neck.
# - JoJo Wiki, EoH Old Joseph
#   (https://jojowiki.com/Eyes_of_Heaven/Old_Joseph_Joestar): his normal combo is
#   Hermit Purple thrust forward at mid-range, a yank that pulls the opponent in, then a
#   Ripple-charged sideways chop. "Panic isn't in my vocabulary" pulls him to an anchor
#   point he chooses.
# Choices for a top-down arena:
# - Stand on, the three light blows are EoH's (vine, yank, chop): from above, vines at
#   mid-range say "Hermit Purple" where ASBR's fists wrapped in vines say nothing.
# - "Panic isn't in my vocabulary" is EoH's: he is pulled to the aimed point. ASBR's
#   pulls him up to a ceiling the camera cannot show.
# - "Now I gotcha!" (ASBR, an anti-air that only hits airborne opponents) is left out
#   until something flies (Iggy, Pet Shop): the owner was told.
# - Cunning Tactician catches the blow, as every counter does here; in ASBR he takes
#   the damage first. The puddle of Coal Tar trips the opponent only; in ASBR it trips
#   him too. Both said to the owner.
# - Tap the Stand key for Hermit Purple, hold it to breathe (ASBR: down, down + Stand).
#
# Feel: an old fox. He looks slow, he never comes to you, and the moment you reach for
# him you are already tied up and the Ripple is on its way down the vine.

name = "Joseph Joestar"
