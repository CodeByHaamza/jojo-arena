# Mariah (Part 3) - Bastet. One of the Egypt Nine Glory Gods, sent by DIO.
#
# Sources, read on 17/11/2026:
# - JoJo Wiki, "Mariah" (https://jojowiki.com/Mariah): calm and sure of her Stand, but
#   quick to lose her composure; devious, flirtatious. She magnetizes Joseph and Avdol
#   and lures them from trap to trap, until Joseph turns the metal round her against her.
#   Named after Mariah Carey. Her outfit hides bolts, screws and knives.
# - JoJo Wiki, "Bastet" (https://jojowiki.com/Bastet): an electrical outlet, a cable under
#   it, laid on any surface. Whoever touches it is shocked and made a magnet: metal comes
#   for them, small things first, then heavier, as heavy as cars; the magnetism wears off
#   if Mariah is too far. No fighting power of its own. Stats E E B A E E.
# - JoJo Wiki, All-Star Battle R ★ Mariah (https://jojowiki.com/All-Star_Battle_R/Mariah):
#   900 HP, knife normals. Style "If you're not allowed to touch something, it makes you
#   want to touch it more..." (Bastet laid ahead of her, a trap: touching it magnetizes,
#   guard or not; touching it again adds half a level). A Magnetization gauge (Lv 1, Lv 2,
#   Lv MAX) that raises the damage of her skills. "Sorry, but you'll have to die now."
#   (three homing knives that cross the arena), "The electricity will char you to a
#   crisp!" (a knife cuts a power line, which hangs as a live wire, pulls a nearby
#   opponent in and shocks them), "Heh heh heh... Enjoy..." (a metal wire from her skirt,
#   a fast projectile that binds), "You can't follow me anymore." (metal objects come down
#   on the opponent from above). Throw "You were one fine specimen." (pushed onto Bastet,
#   shocked, a flying barrel; it magnetizes, 120). HHA "What are you drooling over?" (nuts
#   and bolts in a machine-gun spray, 136 / 204 / 272 by level). GHA "You little turds!"
#   (Bastet under the opponent wherever they are; wires, bolts, then two cars, 304).
#
# What changes here, and why:
# - The gauge is a status on the opponent here (`magnet`, three levels): each touch of
#   Bastet, the throw or the ultimate adds a level, and it all runs out after 9 s. ASBR
#   ties it to staying near her: the timer stands in for that.
# - Each level makes the moves that look for it hit harder (`bonus_per_level`): the
#   knives, the live wire, the falling metal, the bolts (the spread of ASBR's numbers).
# - "Heh heh heh... Enjoy..." ends her chain: a wire that binds, as ASBR makes it a combo
#   tool; there is no free slot otherwise.
# - The live wire hangs a set distance ahead (ASBR's medium and heavy versions).
# Feel: a trapper who never wants to be touched: she lays the outlet, makes a magnet of
# you, and then everything in the arena comes for you.

