# Santana (Part 2) - the Pillar Man who never mastered a Mode. GDD: "Homme du Pilier -
# Infiltration. Rapide, insaisissable, fragile au soleil. Corps flexible : se glisse dans
# les murs, le sol ou par de petits trous. Au contact, entre dans le corps de l'adversaire
# et l'absorbe (dégâts sur la durée). Côtes qui jaillissent en lames de près."
# Frames (_f) are at 60 per second.
#
# Sources (searched 18/10/2026; jojowiki.com could not be opened from here, so the
# details come from search results quoting it and the fandom wiki):
#   - JoJo Wiki "Santana" / "Pillar Men": he reshapes his body at will, breaks his own
#     bones to slip through the grate of an air vent, gets inside a soldier's body to
#     steer it and eat it from the inside; the Ripple repels that digestion. Rib Sword:
#     his ribs come out of his chest as blades, each one moving on its own (825 kg/cm²);
#     Stroheim puts the pressure of his finger at 975 kg/cm². Meat Invade: he breaks his
#     flesh into pieces that fasten onto Joseph. Shot by the soldiers, he takes the
#     bullets in and fires them back out of his fingertips. To escape the sun he hides
#     inside Stroheim's leg.
#   - Games: Santana is NOT playable in All-Star Battle R nor in Eyes of Heaven, so there
#     is no ASBR or EoH list to follow. The one fighting moveset is Diamond Records
#     (JoJo Wiki "Diamond Records/Santana"): kick and hand-strike combos, the rib attack
#     that counters a blow taken while it is out, a stretched index finger, Meat Invade
#     going into the body for several hits while he heals, and fingertip bullets.
#
# Nature "pillar_man": the Ripple burns him double, and the sun burns him outright - but
# not while he is inside someone. He has no Mode, so the style key does nothing.
# Feel: an animal that happens to be older than language, and gets in where it likes.

