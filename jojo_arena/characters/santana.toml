# Santana (Part 2) - the Pillar Man who never mastered a Mode. GDD: "Homme du Pilier -
# Corps à corps brut": no technique, no ornament, no style key - only a body that opens
# where it likes and gets inside yours. Frames (_f) are at 60 per second.
#
# Nature "pillar_man": the Ripple burns him double, and the sun burns him outright.
# He has no Mode, so the style key does nothing: everything he has is in reach of his
# arms. In exchange he is the hardest of them to put down.
# Feel: an animal that happens to be older than language.

