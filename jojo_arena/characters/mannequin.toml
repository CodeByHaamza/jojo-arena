# Generic training mannequin: placeholder kit used to build and test the engine.
# Frames (_f) are at 60 per second; speeds and knockback in pixels per second.
# reach = distance of the hitbox center in front of the body, radius = hitbox size.

name = "Mannequin"
max_hp = 1000

# The Stand key switches between two movesets. "stand" hits harder and further,
# but walking is a bit slower.
style = { type = "stance_toggle", off = "base", on = "stand" }

# Stand called back -------------------------------------------------------------------

[stances.base.moves.light]
startup_f = 5
active_f = 3
recovery_f = 10
damage = 35
reach = 14
radius = 10
hitstun_f = 20
knockback = 90
hitstop_f = 4
cancel_on_hit = ["light", "heavy"]

[stances.base.moves.heavy]
startup_f = 14
active_f = 4
recovery_f = 20
damage = 90
reach = 16
radius = 12
hitstun_f = 28
knockback = 360
hitstop_f = 8
wall_bounce = true

[stances.base.moves.special]
startup_f = 14
active_f = 1
recovery_f = 18

[stances.base.moves.special.projectile]
speed = 210
radius = 5
damage = 55
lifetime_s = 1.5
hitstun_f = 18
knockback = 140
hitstop_f = 4

# Stand out ----------------------------------------------------------------------------

[stances.stand]
walk_speed_mult = 0.9

[stances.stand.moves.light]
startup_f = 6
active_f = 3
recovery_f = 10
damage = 45
reach = 22
radius = 12
hitstun_f = 20
knockback = 110
hitstop_f = 5
cancel_on_hit = ["light", "heavy"]

[stances.stand.moves.heavy]
startup_f = 16
active_f = 5
recovery_f = 22
damage = 115
reach = 24
radius = 14
hitstun_f = 30
knockback = 420
hitstop_f = 10
wall_bounce = true

[stances.stand.moves.special]
startup_f = 16
active_f = 1
recovery_f = 22

[stances.stand.moves.special.projectile]
speed = 270
radius = 7
damage = 70
lifetime_s = 1.2
hitstun_f = 22
knockback = 200
hitstop_f = 6

# Same in both stances -------------------------------------------------------------------

# Heart Heat Attack (1 bar): a burst all around, invincible while it charges.
[moves.hha]
startup_f = 20
active_f = 6
recovery_f = 26
invincible_f = 20
damage = 160
reach = 0
radius = 40
hitstun_f = 36
knockback = 420
hitstop_f = 12
wall_bounce = true
anim = "special"
