# The nine parts of JoJo's Bizarre Adventure, for the menus, the character select tabs
# and the glossary. Fighters say which part they come from with `part` in roster.toml.
#   title   = the part's name (the French editions keep the original titles)
#   setting = where and when it takes place (setting_en: in English)
#   colors  = two accent colors for the menus
#   emblem  = its little symbol, an icon of assets/icons/ (drawings in tools/icons/)
#   complete = true once every fighter the GDD plans for the part is in: the character
#             select screen then shows no "?" slot still to come in its tab

[[parts]]
number = 1
emblem = "emblem_p1"
complete = true
title = "PHANTOM BLOOD"
setting = "Angleterre, 1880-1889"
setting_en = "England, 1880-1889"
colors = ["#c8323c", "#e8c060"]

