# Glossary, Part 3: Stardust Crusaders. Texts in French; the *_en keys give the English.
# Sources: JoJo Wiki (jojowiki.com), the manga and the anime.
#   fighter = the fighter whose sprite shows (characters)
#   sprite  = the sprite sheet shown (Stands)
#   stats   = power, speed, range, durability, precision, potential (A to E)

part = 3

[[terms]]
id = "stand"
name = "STAND"
icon = "glossary_stand"
text = "L'énergie vitale d'une personne qui prend forme, souvent une silhouette qui se tient à côté de son manieur : d'où le nom, de l'anglais to stand by. Seuls les manieurs de Stand voient les Stands, et une blessure du Stand blesse aussi son manieur. Chaque Stand a son propre pouvoir, noté de A à E : puissance, vitesse, portée, endurance, précision et potentiel."
text_en = "A person's life energy taking shape, often a figure standing beside its user: hence the name, from to stand by. Only Stand users can see Stands, and a wound to the Stand wounds its user too. Each Stand has its own power, rated from A to E: power, speed, range, durability, precision and potential."

[[terms]]
id = "tarot"
name = "LES ARCANES DU TAROT"
name_en = "THE TAROT ARCANA"
icon = "glossary_tarot"
text = "Dans Stardust Crusaders, les Stands portent les noms des arcanes majeurs du tarot : Star Platinum pour l'Étoile, Hierophant Green pour le Pape, ou Hiérophante, Silver Chariot pour le Chariot, The World pour le Monde. Plus loin dans le voyage, les ennemis prennent les noms des dieux de l'Égypte antique."
text_en = "In Stardust Crusaders, the Stands are named after the Major Arcana of the tarot: Star Platinum for The Star, Hierophant Green for The Hierophant, Silver Chariot for The Chariot, The World for The World. Further into the journey, the enemies take the names of the gods of ancient Egypt."

[[terms]]
id = "time_stop"
name = "LE TEMPS ARRÊTÉ"
name_en = "STOPPED TIME"
icon = "glossary_time_stop"
text = "The World arrête le temps : seul DIO peut encore bouger, quelques secondes, de plus en plus longtemps à mesure qu'il reprend des forces. Star Platinum, un Stand du même type, apprend à faire de même pendant le combat final : Jotaro peut alors se déplacer dans le temps arrêté."
text_en = "The World stops time: only DIO can still move, for a few seconds, longer and longer as he regains his strength. Star Platinum, a Stand of the same type, learns to do the same during the final battle: Jotaro can then move in stopped time."

[[characters]]
id = "jotaro"
name = "JOTARO KUJO"
fighter = "jotaro_p3"
stand = "STAR PLATINUM"
text = "Lycéen japonais de 17 ans, voyou bagarreur qui cache un coeur loyal et protecteur. Il s'enferme en prison en se croyant possédé par un esprit : c'est son Stand. Quand sa mère tombe malade à cause de DIO, il part pour l'Égypte avec son grand-père Joseph pour la sauver."
text_en = "A 17-year-old Japanese high schooler, a brawling delinquent with a loyal, protective heart. He locks himself in jail, believing he is possessed by a spirit: it is his Stand. When his mother falls ill because of DIO, he sets off for Egypt with his grandfather Joseph to save her."
family = "Fils de Holly Kujo, née Joestar, et du musicien Sadao Kujo. Petit-fils de Joseph Joestar et de Suzi Q. Arrière-arrière-petit-fils de Jonathan Joestar. Père de Jolyne Cujoh, l'héroïne de la partie 6."
family_en = "Son of Holly Kujo, born Joestar, and of the musician Sadao Kujo. Grandson of Joseph Joestar and Suzi Q. Great-great-grandson of Jonathan Joestar. Father of Jolyne Cujoh, the heroine of Part 6."
name_origin = "KuJO JOtaro : les deux syllabes JO donnent son surnom, JOJO, comme pour les héros de la lignée Joestar. Le JO de son prénom s'écrit avec le kanji qui veut dire hériter."
name_origin_en = "KuJO JOtaro: the two JO syllables give his nickname, JOJO, as for the heroes of the Joestar line. The JO of his first name is written with the kanji meaning to inherit."

[[characters]]
id = "kakyoin"
name = "NORIAKI KAKYOIN"
fighter = "kakyoin"
stand = "HIEROPHANT GREEN"
text = "Lycéen japonais de 17 ans, calme et réfléchi. En vacances en Égypte, il croise DIO, qui le soumet avec un bourgeon de chair et l'envoie tuer Jotaro. Libéré par Jotaro, il rejoint le voyage. Il meurt au Caire en perçant le secret de The World : son dernier Emerald Splash frappe l'horloge d'une tour."
text_en = "A calm, thoughtful 17-year-old Japanese high schooler. On holiday in Egypt, he meets DIO, who enslaves him with a flesh bud and sends him to kill Jotaro. Freed by Jotaro, he joins the journey. He dies in Cairo uncovering the secret of The World: his last Emerald Splash hits the clock of a tower."
family = "D'une famille japonaise ordinaire, sans lien avec les Joestar. Il a grandi seul : personne ne voyait son Stand, et il ne s'était jamais fait de vrai ami avant ce voyage."
family_en = "From an ordinary Japanese family, with no tie to the Joestars. He grew up alone: nobody could see his Stand, and he had never made a true friend before this journey."
name_origin = "Kakyoin est le nom d'un quartier de Sendai, la ville natale d'Araki. Son prénom, Noriaki, vient d'un malentendu entre Araki et son éditeur : Araki voulait qu'on le lise Tenmei."
name_origin_en = "Kakyoin is the name of a district of Sendai, Araki's home town. His first name, Noriaki, comes from a misunderstanding between Araki and his editor: Araki wanted it read Tenmei."

[[characters]]
id = "dio"
name = "DIO"
fighter = "dio_p3"
stand = "THE WORLD"
text = "Dio Brando, fils d'un ivrogne recueilli par les Joestar, devient vampire grâce au masque de pierre. Vaincu par Jonathan, il prend son corps et sombre un siècle au fond de l'océan. Remonté cent ans plus tard avec un Stand, The World, il réunit des manieurs de Stand au Caire pour en finir avec la lignée Joestar."
text_en = "Dio Brando, a drunkard's son taken in by the Joestars, becomes a vampire through the Stone Mask. Defeated by Jonathan, he takes his body and sinks to the ocean floor for a century. Brought back up a hundred years later with a Stand, The World, he gathers Stand users in Cairo to wipe out the Joestar line."
family = "Fils de Dario Brando. Frère adoptif de Jonathan Joestar, fils de George Joestar, dont il porte le corps sous sa propre tête. Père de Giorno Giovanna, le héros de la partie 5, et d'Ungalo, Rikiel et Donatello Versus."
family_en = "Son of Dario Brando. Adoptive brother of Jonathan Joestar, son of George Joestar, whose body he wears under his own head. Father of Giorno Giovanna, the hero of Part 5, and of Ungalo, Rikiel and Donatello Versus."
name_origin = "Dio veut dire dieu en italien. Le nom évoque aussi le chanteur de heavy metal Ronnie James Dio et son groupe, Dio."
name_origin_en = "Dio means god in Italian. The name also recalls the heavy metal singer Ronnie James Dio and his band, Dio."

[[characters]]
id = "polnareff"
name = "JEAN PIERRE POLNAREFF"
fighter = "polnareff"
stand = "SILVER CHARIOT"
text = "Un Français fier, blagueur et au grand coeur. Envoyé par DIO pour tuer le groupe, il est libéré de son bourgeon de chair et rejoint le voyage pour se venger : retrouver l'homme aux deux mains droites, qui a tué sa soeur. Il survit au voyage et revient dans la partie 5, avec Chariot Requiem."
text_en = "A proud, joking, big-hearted Frenchman. Sent by DIO to kill the group, he is freed from his flesh bud and joins the journey for revenge: to find the man with two right hands, who killed his sister. He survives the journey and returns in Part 5, with Chariot Requiem."
family = "Français. Sa soeur Sherry a été tuée par J. Geil, l'homme aux deux mains droites, qu'il traque depuis des années."
family_en = "French. His sister Sherry was killed by J. Geil, the man with two right hands, whom he has hunted for years."
name_origin = "Son nom vient du chanteur français Michel Polnareff, dont Araki adorait la musique quand il était enfant."
name_origin_en = "His surname comes from the French singer Michel Polnareff, whose music Araki loved as a child."

[[characters]]
id = "avdol"
name = "MUHAMMAD AVDOL"
fighter = "avdol"
stand = "MAGICIAN'S RED"
text = "Diseur de bonne aventure au bazar de Khan el-Khalili, au Caire, et manieur de Stand depuis sa naissance. Il croise DIO ressuscité devant sa boutique et n'en réchappe que de justesse ; ami de Joseph, il part avec lui chercher Jotaro, puis jusqu'en Égypte. Laissé pour mort après les balles de Hol Horse, il revient plus tard ; il meurt au manoir de DIO en écartant Polnareff et Iggy de l'attaque de Vanilla Ice."
text_en = "A fortune teller in the Khan el-Khalili bazaar in Cairo, and a Stand user since birth. He meets the newly risen DIO outside his shop and barely escapes; a friend of Joseph, he goes with him to fetch Jotaro, then all the way to Egypt. Left for dead after Hol Horse's bullets, he comes back later; he dies in DIO's mansion pushing Polnareff and Iggy out of Vanilla Ice's attack."
family = "Égyptien, né dans les années 1960. Ami de Joseph Joestar, qui l'avait mis en garde contre DIO."
family_en = "Egyptian, born in the 1960s. A friend of Joseph Joestar, who had warned him about DIO."

[[characters]]
id = "joseph_p3"
name = "JOSEPH JOESTAR ÂGÉ"
name_en = "OLD JOSEPH JOESTAR"
fighter = "joseph_p3"
stand = "HERMIT PURPLE"
power = "ONDE (HAMON)"
power_en = "RIPPLE (HAMON)"
text = "Le héros de la partie 2, cinquante ans plus tard : cheveux gris, barbe taillée, un fedora, et sous son gant blanc la main mécanique qui remplace celle que Kars lui a tranchée. Quand DIO se réveille, un Stand lui vient comme à toute sa lignée, et sa fille Holly en tombe malade : il vient chercher Jotaro et mène le voyage jusqu'en Égypte. Il se bat encore par la ruse, avec ses ronces et l'onde qu'il y fait courir. DIO lui prend son sang ; Jotaro le lui rend."
text_en = "The hero of Part 2, fifty years on: gray hair, a trimmed beard, a fedora, and under his white glove the mechanical hand that replaces the one Kars cut off. When DIO wakes, a Stand comes to him as to his whole bloodline, and his daughter Holly falls ill from it: he comes for Jotaro and leads the journey all the way to Egypt. He still fights by cunning, with his vines and the Ripple he sends down them. DIO takes his blood; Jotaro gives it back."
family = "Petit-fils de Jonathan Joestar. Père de Holly Kujo, grand-père de Jotaro."
family_en = "Grandson of Jonathan Joestar. Father of Holly Kujo, grandfather of Jotaro."

[[characters]]
id = "vanilla_ice"
name = "VANILLA ICE"
fighter = "vanilla_ice"
stand = "CREAM"
text = "Le serviteur le plus fidèle de DIO : pour lui offrir son sang, il s'est tranché la tête de ses propres mains, et DIO l'a ramené en vampire. Il garde le manoir du Caire. Caché dans le vide de Cream, il efface Avdol, puis Iggy, et fond sur Polnareff à travers les murs. Polnareff comprend qu'il est un vampire et le traîne au soleil."
text_en = "DIO's most loyal servant: to offer him his blood, he cut off his own head, and DIO brought him back a vampire. He guards the mansion in Cairo. Hidden in Cream's void, he erases Avdol, then Iggy, and bears down on Polnareff through the walls. Polnareff realises he is a vampire and drags him into the sun."
name_origin = "D'après le rappeur américain Vanilla Ice. Avec son Stand, Cream, le tout fait vanilla ice cream, une glace à la vanille."
name_origin_en = "After the American rapper Vanilla Ice. With his Stand, Cream, it makes vanilla ice cream."

[[characters]]
id = "hol_horse"
name = "HOL HORSE"
fighter = "hol_horse"
stand = "EMPEROR"
text = "Un tueur à gages au chapeau de cow-boy, engagé par DIO : hardi, coureur de jupons, vif d'esprit, mais vite pris de panique. Il préfère être le numéro deux que le numéro un, et toujours avec un partenaire : J. Geil et son Stand Hanged Man, qui tue depuis les reflets, puis le petit Boingo. Il affronte Polnareff et Avdol, fuit à cheval quand J. Geil tombe, essaie même d'abattre DIO, et s'en sort toujours de justesse."
text_en = "A cowboy-hatted hitman hired by DIO: bold, a womanizer, quick-witted, but quick to panic. He would rather be number two than number one, and always with a partner: J. Geil and his Stand Hanged Man, who kills from reflections, then little Boingo. He fights Polnareff and Avdol, flees on horseback when J. Geil falls, even tries to shoot DIO, and always gets away by a hair."
name_origin = "D'après le duo pop américain Hall & Oates (cité dans le Shueisha Jump Remix)."
name_origin_en = "After the American pop duo Hall & Oates (cited in the Shueisha Jump Remix)."

[[characters]]
id = "mariah"
name = "MARIAH"
fighter = "mariah"
stand = "BASTET"
text = "L'une des Neuf Divinités d'Égypte envoyées par DIO : calme, sûre de son Stand, rusée et charmeuse, mais vite déstabilisée quand les choses tournent mal. Elle aimante Joseph et Avdol et les entraîne de piège en piège à travers une ville, jusqu'à ce que Joseph retourne contre elle tout le métal qui l'entoure."
text_en = "One of the Nine Egyptian Glory Gods sent by DIO: calm, sure of her Stand, devious and flirtatious, but quick to lose her composure when things go wrong. She magnetizes Joseph and Avdol and leads them from trap to trap through a town, until Joseph turns all the metal around her against her."
name_origin = "D'après la chanteuse américaine Mariah Carey."
name_origin_en = "After the American singer Mariah Carey."

[[characters]]
id = "ndoul"
name = "N'DOUL"
fighter = "ndoul"
stand = "GEB"
text = "L'une des Neuf Divinités d'Égypte, aveugle, d'une loyauté absolue envers DIO, qu'il idolâtre tout en le sachant mauvais. Il repère ses ennemis à l'oreille : les pas, les grains de sable qui retombent, les vibrations du sol que lui transmet sa canne, et frappe avec Geb à des kilomètres. Avdol attire Geb à découvert ; Jotaro lui lance Iggy pour briser sa concentration. Vaincu, il se tue avec son propre Stand plutôt que de livrer ses souvenirs. Le mal aussi a besoin d'un sauveur, dit-il."
text_en = "One of the Nine Egyptian Glory Gods, blind, utterly loyal to DIO, whom he idolizes while knowing him evil. He finds his enemies by ear: footsteps, grains of sand falling back, the vibrations of the ground his cane picks up, and strikes with Geb from kilometres away. Avdol lures Geb into the open; Jotaro throws Iggy at him to break his focus. Beaten, he kills himself with his own Stand rather than give up his memories. Evil needs a savior as well, he says."
name_origin = "D'après le chanteur sénégalais Youssou N'Dour (cité dans le Shueisha Jump Remix)."
name_origin_en = "After the Senegalese singer Youssou N'Dour (cited in the Shueisha Jump Remix)."

[[characters]]
id = "anubis"
name = "ANUBIS"
fighter = "anubis"
stand = "ANUBIS"
text = "Un sabre forgé il y a cinq siècles, au service de DIO, qui possède quiconque le dégaine. Chaka, un garçon de ferme, le tire du sable au bord du Nil ; Polnareff le bat au temple de Kom Ombo. Khan, un barbier d'Edfou, le dégaine ensuite ; Jotaro brise la lame en deux, mais elle continue. Puis Polnareff lui-même... Dans JoJo Arena, il se bat dans le corps de Chaka, ou de Khan."
text_en = "A sword forged five centuries ago, in DIO's service, that possesses whoever draws it. Chaka, a farmhand, pulls it from the sand by the Nile; Polnareff beats him at the temple of Kom Ombo. Khan, a barber of Edfu, draws it next; Jotaro breaks the blade in two, but it keeps going. Then Polnareff himself... In JoJo Arena, it fights in Chaka's body, or Khan's."
name_origin = "D'après Anubis, le dieu égyptien de la mort ; l'une des Neuf Divinités d'Égypte."
name_origin_en = "After Anubis, the Egyptian god of death; one of the Nine Egyptian Glory Gods."

[[stands]]
id = "star_platinum"
name = "STAR PLATINUM"
user = "JOTARO KUJO"
sprite = "star_platinum/star_platinum"
stats = "AACAAA"
text = "Un Stand de combat rapproché d'une force et d'une précision inouïes : ses rafales de poings, ORA ORA, interceptent une pluie de couteaux. Star Finger allonge ses doigts pour frapper plus loin, et pendant le combat final il apprend à arrêter le temps quelques secondes : Star Platinum : The World."
text_en = "A close-range Stand of tremendous strength and precision: its barrages of punches, ORA ORA, intercept a hail of knives. Star Finger stretches its fingers to strike farther, and in the final battle it learns to stop time for a few seconds: Star Platinum: The World."
name_origin = "D'après l'arcane XVII du tarot, l'Étoile, signe d'espoir ; Platinum pour le métal. Dans le magazine, il s'appelait d'abord Star Silver."
name_origin_en = "After tarot card XVII, The Star, a sign of hope; Platinum for the metal. In the magazine it was first called Star Silver."

[[stands]]
id = "hierophant_green"
name = "HIEROPHANT GREEN"
user = "NORIAKI KAKYOIN"
sprite = "hierophant_green/hierophant_green"
stats = "CBABCD"
text = "Un Stand à longue portée qui se défait en fils et en tentacules : il espionne, attache, ou se glisse dans le corps d'un ennemi pour le contrôler. Il tire l'Emerald Splash, une salve d'énergie en forme d'émeraudes, et tisse le filet de l'Emerald Splash 20 mètres, qui tire dès qu'on le touche."
text_en = "A long-range Stand that unravels into strings and tentacles: it spies, binds, or slips into an enemy's body to control it. It fires the Emerald Splash, a burst of emerald-shaped energy, and weaves the net of the 20-meter Emerald Splash, which fires as soon as it is touched."
name_origin = "D'après l'arcane V du tarot, le Pape ou Hiérophante, symbole de tradition. Il s'appelait d'abord Hierophant Emerald ; Araki l'a voulu vert pour l'équilibre des couleurs, et il lui faisait penser à un melon."
name_origin_en = "After tarot card V, The Hierophant, a symbol of tradition. It was first called Hierophant Emerald; Araki made it green to balance the colors, and it reminded him of a melon."

[[stands]]
id = "the_world"
name = "THE WORLD"
user = "DIO"
sprite = "the_world/the_world"
stats = "AACABB"
text = "Un Stand de combat rapproché aussi fort et rapide que Star Platinum, qui frappe en criant MUDA MUDA. Son vrai pouvoir est d'arrêter le temps : environ 5 secondes au début, près de 9 à la fin du voyage. DIO en profite pour lancer des couteaux qui restent en l'air, et même un rouleau compresseur."
text_en = "A close-range Stand as strong and fast as Star Platinum, striking with cries of MUDA MUDA. Its true power is to stop time: about 5 seconds at first, nearly 9 by the end of the journey. DIO uses it to throw knives that hang in the air, and even a road roller."
name_origin = "D'après l'arcane XXI du tarot, le Monde, la dernière carte des arcanes majeurs."
name_origin_en = "After tarot card XXI, The World, the last card of the Major Arcana."

[[stands]]
id = "silver_chariot"
name = "SILVER CHARIOT"
user = "JEAN PIERRE POLNAREFF"
sprite = "silver_chariot/silver_chariot"
stats = "CACBBC"
text = "Un chevalier en armure armé d'une rapière, d'une vitesse extrême : il pare les balles. Sans son armure, il devient si rapide qu'il laisse des images multiples ; il peut aussi tirer sa lame, mais doit la récupérer ensuite. Transpercé par la flèche, il deviendra Chariot Requiem."
text_en = "An armored knight wielding a rapier, of extreme speed: it parries bullets. Without its armor it gets so fast it leaves afterimages; it can also fire its blade, but must get it back afterwards. Pierced by the Arrow, it will become Chariot Requiem."
name_origin = "D'après l'arcane VII du tarot, le Chariot, symbole de conquête et de victoire."
name_origin_en = "After tarot card VII, The Chariot, a symbol of conquest and victory."

[[stands]]
id = "magicians_red"
name = "MAGICIAN'S RED"
user = "MUHAMMAD AVDOL"
sprite = "magicians_red/magicians_red"
stats = "BBCBCD"
text = "Un Stand de combat rapproché à tête d'oiseau, faite d'après le phénix, qui crée et façonne le feu à volonté : des flammes assez chaudes pour faire fondre le métal en plein vol. Crossfire Hurricane lance des ankhs de feu, Red Bind ligote d'une corde de flammes, et ses flammes peuvent détecter la vie autour de lui. Un seul coup de pied a brisé l'armure de Judgement."
text_en = "A close-range Stand with a bird's head, modeled on the phoenix, that makes and shapes fire at will: flames hot enough to melt metal in mid-air. Crossfire Hurricane throws fire ankhs, Red Bind ties with a rope of flame, and its flames can detect life around it. A single kick broke Judgement's armor."
name_origin = "D'après l'arcane I du tarot, le Magicien, ou Bateleur. Araki lui a donné une tête d'oiseau pour que les silhouettes des héros, côte à côte, ne se ressemblent pas."
name_origin_en = "After tarot card I, The Magician. Araki gave it a bird's head so that the heroes' silhouettes, side by side, would not look alike."

[[stands]]
id = "hermit_purple"
name = "HERMIT PURPLE"
user = "JOSEPH JOESTAR"
icon = "glossary_hermit_purple"  # no body: vines out of a hand
stats = "DCDADE"
text = "Des ronces violettes couvertes d'épines qui sortent des mains de Joseph : pas de corps, pas de visage. Elles sont assez solides pour porter son poids et assez longues pour ligoter quelqu'un : il s'y balance d'un endroit à l'autre, il attache, et il y fait courir l'onde comme dans un prolongement de son bras. Son vrai pouvoir est la divination : une photo qui montre ce qu'il cherche en fracassant un appareil, des pensées sur un écran de télévision, une carte tracée dans la poussière."
text_en = "Purple vines covered in thorns that grow from Joseph's hands: no body, no face. They are strong enough to bear his weight and long enough to bind someone: he swings on them from place to place, ties people up, and sends the Ripple down them as down an extension of his arm. Its true power is divination: a photograph that shows what he is looking for when he smashes a camera, thoughts on a television screen, a map drawn in the dust."
name_origin = "D'après l'arcane IX du tarot, l'Ermite : l'introspection et la contemplation, comme son pouvoir de divination. Violet dans le manga comme dans l'anime."
name_origin_en = "After tarot card IX, The Hermit: introspection and contemplation, like its power of divination. Purple in the manga and the anime alike."

[[stands]]
id = "cream"
name = "CREAM"
user = "VANILLA ICE"
sprite = "cream/cream"
stats = "BBDCCD"
text = "Un Stand de combat rapproché, immense, au visage de crâne sous une cagoule de bourreau, assez fort pour décapiter d'un tranchant de la main. Sa bouche ouvre sur le vide : en s'avalant lui-même avec son maître, il devient une boule invisible qui efface tout ce qu'elle traverse, mur ou homme. Mais de l'intérieur Vanilla Ice ne voit rien : il doit sortir la tête pour regarder, et c'est là qu'on peut le frapper. Polnareff le suit à la trace en semant du sable."
text_en = "A huge close-range Stand with a skull's face under an executioner's cowl, strong enough to behead with a chop. Its mouth opens on the void: swallowing itself along with its master, it becomes an unseen ball that erases whatever it passes through, wall or man. But from inside Vanilla Ice sees nothing: he has to put his head out to look, and that is when he can be struck. Polnareff tracks him by scattering sand."
name_origin = "D'après le groupe de rock britannique Cream (cité dans le Shueisha Jump Remix). Avec Vanilla Ice, son maître : vanilla ice cream."
name_origin_en = "After the British rock band Cream (cited in the Shueisha Jump Remix). With Vanilla Ice, its master: vanilla ice cream."

[[stands]]
id = "emperor"
name = "EMPEROR"
user = "HOL HORSE"
icon = "glossary_emperor"  # no body: a gun in his hand
stats = "BBBCEE"
text = "Un revolver qui apparaît directement dans la main de Hol Horse : un long canon sous un cadre de métal, un barillet dessous qui n'est relié à rien, une grosse bille dans le cadre. Ses balles font partie du Stand : il les pilote en plein vol, autour de l'épée de Silver Chariot, en demi-tour, ou dans un tuyau qu'il ne voit pas. Elles restent tenues par la portée d'Emperor."
text_en = "A revolver that appears straight in Hol Horse's hand: a long barrel under a metal frame, a cylinder below it connected to nothing, a big ball set in the frame. Its bullets are part of the Stand: he steers them in flight, round Silver Chariot's sword, in a U-turn, or down a pipe he cannot see. They stay held by Emperor's range."
name_origin = "D'après l'arcane IV du tarot, l'Empereur, symbole d'ordre et d'autorité."
name_origin_en = "After tarot card IV, The Emperor, a symbol of order and authority."

[[stands]]
id = "bastet"
name = "BASTET"
user = "MARIAH"
icon = "glossary_bastet"  # no body: an outlet on a wall or on the floor
stats = "EEBAEE"
text = "Une prise électrique, un câble dessous, posée sur n'importe quelle surface. Qui la touche reçoit une décharge et devient un aimant : le métal vient à lui, de plus en plus lourd à mesure que le temps passe, jusqu'aux voitures, et peut l'écraser ou l'empaler. Plusieurs victimes s'attirent entre elles. Si Mariah s'éloigne trop, l'aimantation s'éteint. Aucune force de combat : c'est un piège."
text_en = "An electrical outlet, a cable under it, laid on any surface. Whoever touches it gets a shock and becomes a magnet: metal comes for them, heavier and heavier as time passes, up to cars, and can crush or impale them. Several victims draw each other in. If Mariah goes too far, the magnetism wears off. No fighting power of its own: it is a trap."
name_origin = "D'après Bastet, la déesse égyptienne protectrice ; c'est la quatrième des Neuf Divinités d'Égypte."
name_origin_en = "After Bastet, the Egyptian goddess of protection; it is the fourth of the Nine Egyptian Glory Gods."

[[stands]]
id = "geb"
name = "GEB"
user = "N'DOUL"
icon = "glossary_geb"  # no body: water, a tentacle with a clawed hand
stats = "CBABDD"
text = "Une petite masse d'eau sans forme, qui tiendrait dans une gourde, le plus souvent un tentacule terminé par une main griffue. N'Doul la dirige avec précision jusqu'à quatre kilomètres, cachée sous le sable pour surgir par surprise ; sa griffe tranche la chair et le métal, et l'eau arrête les projectiles. Sa faiblesse : la chaleur. Les flammes de Magician's Red l'évaporent en partie."
text_en = "A small, shapeless mass of water that would fit in a canteen, most often a tentacle ending in a clawed hand. N'Doul steers it precisely up to four kilometres away, hidden under the sand to strike by surprise; its claw cuts flesh and metal, and the water stops projectiles. Its weakness: heat. Magician's Red's flames partly boil it away."
name_origin = "D'après Geb, le dieu égyptien de la terre ; c'est l'une des Neuf Divinités d'Égypte."
name_origin_en = "After Geb, the Egyptian god of the earth; it is one of the Nine Egyptian Glory Gods."

[[stands]]
id = "anubis_sword"
name = "ANUBIS"
user = "CHAKA, KHAN, POLNAREFF"
icon = "glossary_anubis"  # a sword: its body is whoever holds it
stats = "BBEAEC"
text = "Un sabre courbe à double tranchant, la garde sertie de joyaux. Il contrôle quiconque le dégaine, quelle que soit sa volonté. Il retient chaque attaque qu'on lui porte et la contre ensuite : la même ruse ne marche jamais deux fois, et il devient plus rapide et plus fort au fil du combat. Sa lame passe à travers la pierre, les murs et les corps sans les abîmer, et tranche un ennemi caché derrière un pilier. Il n'apprend pourtant rien à son porteur : Chaka le manie en amateur."
text_en = "A curved, double-edged sword, its guard set with jewels. It controls whoever draws it, whatever their will. It remembers every attack used on it and counters it afterwards: the same trick never works twice, and it grows faster and stronger as the fight goes on. Its blade passes through stone, walls and bodies without harming them, and cuts an enemy hidden behind a pillar. Yet it teaches its wielder nothing: Chaka swings it like an amateur."
name_origin = "D'après Anubis, le dieu égyptien de la mort. Seul JoJo's Venture de Capcom l'avait rendu jouable ; JoJo Arena le refait à sa façon."
name_origin_en = "After Anubis, the Egyptian god of death. Only Capcom's JoJo's Venture had made it playable; JoJo Arena makes it its own way."
