# Glossary, Part 2: Battle Tendency. Texts in French; the *_en keys give the English.
# Sources: JoJo Wiki (jojowiki.com), the manga and the anime.

part = 2

[[terms]]
id = "pillar_men"
name = "HOMMES DU PILIER"
name_en = "PILLAR MEN"
icon = "glossary_pillar"
text = "Les derniers survivants d'une race très ancienne : Kars, Esidisi, Wamuu et Santana, retrouvés endormis dans des piliers de pierre, d'où leur nom. Ils absorbent les êtres vivants qu'ils touchent, et les plus aguerris combattent par modes : le feu, le vent, la lumière. Le soleil et l'onde sont leurs seules faiblesses ; Kars veut s'en libérer grâce à la Super Aja."
text_en = "The last survivors of an ancient race: Kars, Esidisi, Wamuu and Santana, found asleep inside stone pillars, hence their name. They absorb the living beings they touch, and the most seasoned fight with Modes: fire, wind, light. Sunlight and the Ripple are their only weaknesses; Kars wants to be free of them through the Super Aja."

[[terms]]
id = "red_stone"
name = "SUPER AJA"
icon = "glossary_red_stone"
text = "La pierre rouge d'Aja absorbe la lumière et la réfracte des centaines de millions de fois, jusqu'à la renvoyer en un rayon semblable à un laser. Sa forme parfaite, la Super Aja, placée dans un masque de pierre, débarrasserait un Homme du Pilier de ses faiblesses. Gardée par Lisa Lisa, elle est volée par Kars, qui devient la forme de vie ultime."
text_en = "The Red Stone of Aja absorbs light and refracts it hundreds of millions of times, until it sends it back as a laser-like beam. Its perfect form, the Super Aja, set in a Stone Mask, would rid a Pillar Man of his weaknesses. Kept by Lisa Lisa, it is stolen by Kars, who becomes the Ultimate Life Form."

[[terms]]
id = "wedding_rings"
name = "ANNEAUX DE MARIAGE"
name_en = "WEDDING RINGS"
icon = "glossary_hamon"
text = "Wamuu fixe un anneau sur une artère du coeur de Joseph, Esidisi un autre dans sa gorge. Chacun renferme un poison qui se libère au bout de 33 jours ; l'antidote se trouve dans la lèvre de Wamuu et la boucle d'oreille d'Esidisi. Pour survivre, Joseph doit les vaincre : c'est ce qui le pousse à s'entraîner auprès de Lisa Lisa."
text_en = "Wamuu fastens a ring onto an artery of Joseph's heart, Esidisi another inside his throat. Each holds a poison that breaks free after 33 days; the antidote lies in Wamuu's lip ring and Esidisi's earring. To survive, Joseph must defeat them: that is what drives him to train under Lisa Lisa."

[[characters]]
id = "joseph_p2"
name = "JOSEPH JOESTAR"
fighter = "joseph_p2"
power = "ONDE (HAMON)"
power_en = "RIPPLE (HAMON)"
text = "Petit-fils de Jonathan, élevé par sa grand-mère Erina puis installé à New York. Doué pour l'onde sans jamais l'avoir travaillée, il gagne par la ruse plus que par la force : pièges, grenades, clackers, et sa fameuse prédiction 'Ta prochaine réplique sera...'. Il affronte les Hommes du Pilier et finit par envoyer Kars dans l'espace."
text_en = "Jonathan's grandson, raised by his grandmother Erina, then settled in New York. Gifted at the Ripple without ever working at it, he wins by cunning more than strength: traps, grenades, clackers, and his famous call, 'Your next line is...'. He fights the Pillar Men and ends up sending Kars into space."
family = "Fils de George Joestar II et d'Elizabeth, qui n'est autre que Lisa Lisa. Petit-fils de Jonathan et d'Erina. Père de Holly Kujo, grand-père de Jotaro."
family_en = "Son of George Joestar II and Elizabeth, who is none other than Lisa Lisa. Grandson of Jonathan and Erina. Father of Holly Kujo, grandfather of Jotaro."
name_origin = "Comme chaque héros de la saga, son nom donne JoJo : JOseph JOestar."
name_origin_en = "Like every hero of the saga, his name makes JoJo: JOseph JOestar."

[[characters]]
id = "caesar"
name = "CAESAR A. ZEPPELI"
fighter = "caesar"
power = "ONDE (HAMON)"
power_en = "RIPPLE (HAMON)"
text = "Petit-fils de Will A. Zeppeli. Il grandit dans la rue à Rome, rongé de rancune envers son père qui avait abandonné sa famille, avant d'apprendre qu'il était mort en le protégeant. Il se bat avec des bulles de savon chargées d'onde. D'abord rival de Joseph, il devient son ami, et tombe face à Wamuu en lui laissant l'antidote."
text_en = "Grandson of Will A. Zeppeli. He grows up on the streets of Rome, eaten by resentment toward the father who left his family, before learning that he died protecting him. He fights with soap bubbles charged with Ripple. First Joseph's rival, he becomes his friend, and falls against Wamuu, leaving him the antidote."
family = "Fils de Mario Zeppeli, petit-fils de Will A. Zeppeli, le maître de Jonathan. Élève de Lisa Lisa avec Joseph."
family_en = "Son of Mario Zeppeli, grandson of Will A. Zeppeli, Jonathan's master. Lisa Lisa's student alongside Joseph."
name_origin = "Comme son grand-père, il porte un nom tiré du groupe de rock Led Zeppelin."
name_origin_en = "Like his grandfather, he bears a name drawn from the rock band Led Zeppelin."

[[characters]]
id = "lisa_lisa"
name = "LISA LISA"
fighter = "lisa_lisa"
power = "ONDE (HAMON)"
power_en = "RIPPLE (HAMON)"
text = "Une maîtresse de l'onde qui garde la Super Aja sur l'île d'Air Supplena, près de Venise. Elle y forme Joseph et Caesar. Son écharpe, tissée de soie de scarabée de Satiporoja, conduit l'onde à la perfection : fouet, lance ou parade. On apprend à la fin qu'elle est la mère de Joseph."
text_en = "A Ripple master who guards the Super Aja on Air Supplena Island, near Venice. There she trains Joseph and Caesar. Her scarf, woven from Satiporoja beetle silk, carries the Ripple perfectly: whip, spear or parry. At the end we learn she is Joseph's mother."
family = "De son vrai nom Elizabeth. Orpheline recueillie et élevée par Straizo. Épouse de George Joestar II, mère de Joseph Joestar."
family_en = "Her real name is Elizabeth. An orphan taken in and raised by Straizo. Wife of George Joestar II, mother of Joseph Joestar."
name_origin = "Son nom ferait référence au groupe américain Lisa Lisa and Cult Jam."
name_origin_en = "Her name is thought to refer to the American band Lisa Lisa and Cult Jam."

[[characters]]
id = "straizo"
name = "STRAIZO"
fighter = "straizo"
power = "VAMPIRE"
text = "Maître de l'onde qui combattit Dio aux côtés de Jonathan en 1889. Cinquante ans plus tard, vieillissant, il trahit Speedwagon au Mexique et porte le masque de pierre pour rester jeune à jamais. Vampire, il tire des jets sous pression de ses yeux. Vaincu par Joseph, il se détruit avec sa propre onde."
text_en = "A Ripple master who fought Dio alongside Jonathan in 1889. Fifty years later, growing old, he betrays Speedwagon in Mexico and puts on the Stone Mask to stay young forever. As a vampire he fires pressurized jets from his eyes. Defeated by Joseph, he destroys himself with his own Ripple."
family = "Élève de Tonpetty, comme Zeppeli et Dire. Il a recueilli et élevé Lisa Lisa."
family_en = "A student of Tonpetty, like Zeppeli and Dire. He took in and raised Lisa Lisa."
name_origin = "Son nom vient du groupe de rock Dire Straits, tout comme celui de Dire."
name_origin_en = "His name comes from the rock band Dire Straits, just like Dire's."

[[characters]]
id = "wamuu"
name = "WAMUU"
fighter = "wamuu"
power = "MODE DU VENT"
power_en = "WIND MODE"
text = "Homme du Pilier, guerrier avant tout. Il refuse de frapper un adversaire qui ne peut pas répondre, soigne ceux qu'il compte tuer plus tard, et tient sa parole même quand elle le condamne. Sa corne lit le vent et lui dit où tu es, même les yeux crevés : il se les arrache lui-même pour échapper au piège de Joseph. Son Divine Sandstorm broie tout entre ses bras ; son Final Mode le déchire en même temps que toi."
text_en = "A Pillar Man, and a warrior before anything. He will not strike an opponent who cannot answer, heals those he means to kill later, and keeps his word even when it damns him. His horn reads the wind and tells him where you are, even with his eyes gone - he tears them out himself to escape Joseph's trap. His Divine Sandstorm grinds everything between his arms; his Final Mode tears him apart along with you."
family = "L'un des quatre Hommes du Pilier, avec Kars, Esidisi et Santana. Fidèle à Kars, qui l'a élevé."
family_en = "One of the four Pillar Men, with Kars, Esidisi and Santana. Loyal to Kars, who raised him."
name_origin = "Comme les autres Hommes du Pilier, son nom vient de la musique : le groupe Wham!."
name_origin_en = "Like the other Pillar Men, his name comes from music: the band Wham!."

[[characters]]
id = "esidisi"
name = "ESIDISI"
fighter = "esidisi"
power = "MODE DE LA FLAMME"
power_en = "FLAME MODE"
text = "Homme du Pilier le plus émotif : il pleure, il hurle, et il continue de se battre pendant. Son Mode porte son propre sang à cinq cents degrés et le projette par les veines de ses bras. Quand son corps est détruit, il détache son cerveau et son système nerveux pour survivre en parasite dans un hôte : c'est ainsi qu'il tente d'envoyer la Super Aja à Kars."
text_en = "The most emotional of the Pillar Men: he weeps, he wails, and he keeps fighting through it. His Mode heats his own blood to five hundred degrees and fires it out through the veins of his arms. When his body is destroyed, he detaches his brain and nervous system to live on as a parasite in a host: that is how he tries to send the Super Aja to Kars."
family = "L'un des quatre Hommes du Pilier. Le plus âgé après Kars, et son bras droit."
family_en = "One of the four Pillar Men. The oldest after Kars, and his right hand."
name_origin = "De AC/DC, le groupe de rock australien."
name_origin_en = "From AC/DC, the Australian rock band."

[[characters]]
id = "kars"
name = "KARS"
fighter = "kars"
power = "MODE DE LA LUMIÈRE"
power_en = "LIGHT MODE"
text = "Celui qui a créé les masques de pierre, il y a cent mille ans, pour libérer son espèce du soleil - et qui a massacré les siens quand ils ont voulu l'en empêcher. Son Mode fait sortir des lames de lumière de ses avant-bras et de ses jambes. Avec la Super Aja sur un masque, il devient la forme de vie ultime : régénération, intelligence sans limite, et l'onde elle-même à sa disposition. Joseph finit par l'envoyer dans l'espace, où il ne peut ni mourir ni revenir."
text_en = "The one who made the stone masks, a hundred thousand years ago, to free his kind from the sun - and who slaughtered his own people when they tried to stop him. His Mode brings blades of light out of his forearms and legs. With the Super Aja set in a mask he becomes the ultimate life form: regeneration, limitless intelligence, and the Ripple itself at his disposal. Joseph ends up sending him into space, where he can neither die nor return."
family = "Chef des quatre Hommes du Pilier. Il a élevé Wamuu et Santana."
family_en = "Leader of the four Pillar Men. He raised Wamuu and Santana."
name_origin = "Du groupe américain The Cars."
name_origin_en = "From the American band The Cars."

[[characters]]
id = "santana"
name = "SANTANA"
fighter = "santana"
power = "AUCUN MODE"
power_en = "NO MODE"
text = "Le plus jeune des Hommes du Pilier, et le seul qui n'ait jamais maîtrisé de Mode. Retrouvé endormi dans un pilier du Mexique, il se réveille devant Stroheim et vide une pièce entière de soldats en se glissant dans leurs corps. Sans technique, il n'a que sa force, ses lames de côtes et un corps qui prend la forme qu'il veut. Stroheim l'expose au soleil, et il se pétrifie."
text_en = "The youngest of the Pillar Men, and the only one who never mastered a Mode. Found asleep inside a pillar in Mexico, he wakes in front of Stroheim and empties a whole room of soldiers by slipping inside them. With no technique, he has only his strength, his rib blades and a body that takes whatever shape he likes. Stroheim exposes him to the sun, and he turns to stone."
family = "Le plus jeune des quatre Hommes du Pilier, élevé par Kars."
family_en = "The youngest of the four Pillar Men, raised by Kars."
name_origin = "Du guitariste Carlos Santana."
name_origin_en = "From the guitarist Carlos Santana."

[[characters]]
id = "stroheim"
name = "RUDOL VON STROHEIM"
fighter = "stroheim"
power = "CORPS DE MACHINE"
power_en = "MACHINE BODY"
text = "Officier allemand, d'abord ennemi de Joseph, puis son allié contre les Hommes du Pilier. Il perd la moitié de son corps face à Santana et revient en cyborg : mitrailleuse à la place du bras, lance-flammes, et surtout des lampes à ultraviolets - le soleil en boîte, la seule arme humaine qui blesse vraiment un Homme du Pilier. Il se fait sauter la poitrine pour gagner, et survit quand même."
text_en = "A German officer, first Joseph's enemy, then his ally against the Pillar Men. He loses half his body to Santana and comes back a cyborg: a machine gun where his arm was, a flamethrower, and above all ultraviolet lamps - the sun in a box, the only human weapon that truly hurts a Pillar Man. He blows his own chest open to win, and survives anyway."
family = "Officier de l'armée allemande, affecté à l'étude des Hommes du Pilier."
family_en = "An officer of the German army, assigned to the study of the Pillar Men."
name_origin = "De l'acteur et réalisateur Erich von Stroheim."
name_origin_en = "From the actor and director Erich von Stroheim."
