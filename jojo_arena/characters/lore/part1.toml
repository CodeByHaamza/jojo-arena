# Glossary, Part 1: Phantom Blood. One file per part, filled as the parts come in.
# Texts in French; the *_en keys give the English. Sources: JoJo Wiki (jojowiki.com),
# the manga and the anime. Icons: assets/icons/ (drawings in tools/icons/).
#   fighter = the fighter whose sprite shows; power = what they fight with (no Stands yet)

part = 1

[[terms]]
id = "stone_mask"
name = "MASQUE DE PIERRE"
name_en = "STONE MASK"
icon = "glossary_stone_mask"
text = "Un masque antique conçu par Kars, l'un des Hommes du Pilier, vers 8000 av. J.-C. Au contact du sang, il plante des pointes de pierre dans le crâne de celui qui le porte : il devient un vampire d'une force immense, que seul le soleil peut détruire. Accroché chez les Joestar, il fait de Dio Brando un vampire."
text_en = "An ancient mask designed by Kars, one of the Pillar Men, around 8000 BC. When blood touches it, stone spikes pierce the wearer's skull: they become a vampire of immense strength, whom only sunlight can destroy. Hung in the Joestar mansion, it turns Dio Brando into a vampire."

[[terms]]
id = "hamon"
name = "ONDE (HAMON)"
name_en = "RIPPLE (HAMON)"
icon = "glossary_hamon"
text = "Le Hamon, l'onde (en japonais, les rides à la surface de l'eau), est une énergie née d'une respiration maîtrisée, semblable aux rayons du soleil. Il soigne et traverse l'eau ou le métal, mais il est surtout mortel pour les vampires, les zombies et les Hommes du Pilier. Zeppeli l'enseigne à Jonathan ; plus tard, Joseph, Caesar et Lisa Lisa le maîtrisent."
text_en = "Hamon, the Ripple (in Japanese, the rings on the surface of water), is an energy born from controlled breathing, like the rays of the sun. It heals and flows through water or metal, but above all it is deadly to vampires, zombies and the Pillar Men. Zeppeli teaches it to Jonathan; later, Joseph, Caesar and Lisa Lisa master it."

[[terms]]
id = "vampire"
name = "VAMPIRE"
icon = "glossary_vampire"
text = "Porter le masque de pierre fait de quelqu'un un vampire : il ne vieillit plus, se remet de presque toutes ses blessures et se nourrit du sang des humains. Il peut changer ses victimes en zombies qui lui obéissent. Le soleil et l'onde le réduisent en poussière."
text_en = "Wearing the Stone Mask makes someone a vampire: they stop ageing, recover from almost any wound and feed on human blood. They can turn their victims into zombies who obey them. Sunlight and the Ripple turn them to dust."

[[terms]]
id = "freezing"
name = "GEL VAPORISANT"
name_en = "VAPORIZATION FREEZING"
icon = "glossary_freeze"
text = "Une technique de vampire : Dio vaporise l'eau de son corps pour aspirer la chaleur de ce qu'il touche, qui gèle aussitôt. Contre Jonathan, il s'en sert pour geler ses bras et arrêter son Hamon."
text_en = "A vampire technique: Dio vaporizes the water in his body to draw the heat out of what he touches, which freezes at once. Against Jonathan, he uses it to freeze his arms and stop his Hamon."

[[terms]]
id = "stingy_eyes"
name = "SPACE RIPPER STINGY EYES"
icon = "glossary_stingy_eyes"
text = "Dio met sous pression le liquide de ses yeux et le projette en deux jets si fins et si rapides qu'ils tranchent la pierre : des yeux laser."
text_en = "Dio pressurizes the fluid in his eyeballs and fires it in two jets so thin and fast they cut through stone: eye beams."

[[characters]]
id = "jonathan"
name = "JONATHAN JOESTAR"
fighter = "jonathan"
power = "ONDE (HAMON)"
power_en = "RIPPLE (HAMON)"
text = "Fils d'un noble anglais, George Joestar. Son père adopte Dio Brando, qui lui gâche la vie avant de devenir vampire. Formé à l'onde par Zeppeli, ce gentleman de 1,95 m affronte Dio jusqu'au bout : il meurt en 1889 sur un navire qui explose, en protégeant sa femme Erina."
text_en = "Son of an English noble, George Joestar. His father adopts Dio Brando, who wrecks his life before becoming a vampire. Trained in the Ripple by Zeppeli, this 195 cm gentleman fights Dio to the end: he dies in 1889 aboard an exploding ship, protecting his wife Erina."
family = "Fils de George Joestar. Mari d'Erina Pendleton, père de George Joestar II, grand-père de Joseph Joestar. Le premier JoJo : la lignée Joestar part de lui."
family_en = "Son of George Joestar. Husband of Erina Pendleton, father of George Joestar II, grandfather of Joseph Joestar. The first JoJo: the Joestar line starts with him."
name_origin = "Araki et son éditeur voulaient des initiales doubles, comme S.S. pour Steven Spielberg : J.J. donne JoJo. Le nom a été trouvé dans un restaurant Denny's."
name_origin_en = "Araki and his editor wanted double initials, like S.S. for Steven Spielberg: J.J. gives JoJo. The name was found in a Denny's restaurant."

[[characters]]
id = "zeppeli"
name = "WILL A. ZEPPELI"
fighter = "zeppeli"
power = "ONDE (HAMON)"
power_en = "RIPPLE (HAMON)"
text = "Un gentleman italien, maître de l'onde. En 1858, son père porte le masque de pierre et tue tout l'équipage d'une expédition : Zeppeli consacre sa vie à détruire le masque et apprend le Hamon auprès de Tonpetty. Il forme Jonathan, puis meurt face à Tarkus en lui transmettant toute son énergie : le Deep Pass Overdrive."
text_en = "An Italian gentleman, a master of the Ripple. In 1858 his father wears the Stone Mask and kills the whole crew of an expedition: Zeppeli gives his life to destroying the mask and learns Hamon from Tonpetty. He trains Jonathan, then dies against Tarkus, passing him all his energy: the Deep Pass Overdrive."
family = "Son père porta le masque de pierre lors de l'expédition de 1858. Père de Mario Zeppeli, grand-père de Caesar Zeppeli, l'ami de Joseph dans la partie 2."
family_en = "His father wore the Stone Mask on the 1858 expedition. Father of Mario Zeppeli, grandfather of Caesar Zeppeli, Joseph's friend in Part 2."
name_origin = "Araki l'a nommé d'après le groupe de rock Led Zeppelin, dont il admirait les musiciens."
name_origin_en = "Araki named him after the rock band Led Zeppelin, whose musicians he admired."

[[characters]]
id = "dio_brando"
name = "DIO BRANDO"
fighter = "dio_p1"
power = "VAMPIRE"
text = "Fils d'un ivrogne, Dio entre chez les Joestar pour s'emparer de leur fortune et fait de la vie de Jonathan un enfer. Démasqué, il porte le masque de pierre et devient vampire : il gèle ce qu'il touche, tire des jets de ses yeux, change les morts en zombies. Brûlé par le Hamon de Jonathan, il survit, réduit à sa seule tête."
text_en = "A drunkard's son, Dio joins the Joestar family to seize their fortune and makes Jonathan's life a nightmare. Unmasked, he puts on the Stone Mask and becomes a vampire: he freezes what he touches, shoots jets from his eyes, turns the dead into zombies. Burned by Jonathan's Hamon, he survives, reduced to his head alone."
family = "Fils de Dario Brando. Adopté par George Joestar, frère adoptif de Jonathan. Il prendra plus tard le corps de Jonathan : c'est lui, le DIO de la partie 3."
family_en = "Son of Dario Brando. Adopted by George Joestar, Jonathan's adoptive brother. He will later take Jonathan's body: he is the DIO of Part 3."
name_origin = "Dio veut dire dieu en italien. Le nom évoque aussi le chanteur de heavy metal Ronnie James Dio et son groupe, Dio."
name_origin_en = "Dio means god in Italian. The name also recalls the heavy metal singer Ronnie James Dio and his band, Dio."
