# DIO (Part 3) - The World. GDD: "Stand · Hit & run": knives at range, fast strikes.
# Knife fans; in stopped time (~5 s) thrown knives hang around the opponent like a trap.
# Blood-draining grab. Great Heat Attack: Road Roller in stopped time.
# Feel: a predator. He comes from the air, slashes, drains, and pins you with knives.

