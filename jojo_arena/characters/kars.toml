# The Ultimate Life Form -------------------------------------------------------------
# Power Up (2 barres) : il pose le masque de pierre et la Super Aja. Il ne peut plus en
# sortir, le soleil ne lui fait plus rien, et tout ce qu'il a change. Chaque coup se
# régénère : il reprend de la vie sur ce qu'il touche.

[awakening]
stance = "ultimate"
bars = 2
charge_s = 5
vulnerable_mult = 2.0
break_hitstun_f = 20
refund = 0.5
cinematic = "ultimate_thing"
# 5,5 s : la pierre se pose, le masque se referme, la lumière sort, les ailes s'ouvrent.
cinematic_s = 5.5
sun_immune = true
label = "SUPER AJA"
label_en = "SUPER AJA"

# Five seconds of standing perfectly still with a stone mask over his face: he takes
