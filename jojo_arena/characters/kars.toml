# Kars (Part 2) - Pillar Man of the light, and the one who made the stone masks. GDD:
# "Homme du Pilier - Lames de lumière": the longest reach of the cast, blades that come
# out of his arms and legs and bounce off the walls. Frames (_f) are at 60 per second.
#
# Nature "pillar_man": the Ripple burns him double, and so does the sun - which is
# exactly what he spent a hundred thousand years trying to be free of.
# Style key: Light Mode. The blades come out, every blow gains reach, and his walk
# slows: he is carrying edges.
# Feel: the cleverest thing in the room, and it has knives for arms.

