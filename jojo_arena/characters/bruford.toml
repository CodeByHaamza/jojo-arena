# Bruford (Part 1). GDD: "Zombie chevalier · Contrôle": mid range, a sword. His hair
# grabs and pierces: a grab from afar that drains. Ultimate: the Hair Dance, grabs from
# every side. Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# A zombie: Hamon burns him (double damage) and so does the sun. No style key.
# Feel: a knight who keeps you at the length of his sword, then of his hair.

name = "Bruford"
max_hp = 1000
walk_speed = 102
nature = "zombie"

[stances.base]
label = "CHEVALIER ZOMBIE"
label_en = "ZOMBIE KNIGHT"

