# Bruford (Part 1). GDD: "Zombie chevalier · Contrôle": mid range, a sword. His hair
# grabs and pierces: a grab from afar that drains. Ultimate: the Hair Dance, grabs from
# every side. Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# A zombie: Hamon burns him (double damage) and so does the sun. No style key.
# Feel: a knight who keeps you at the length of his sword, then of his hair.

# His hair carries what he picks up: his hands stay free, and he swings it from the
# length of his hair, over a wide arc.
name = "Bruford"
prop_hold = "hair"
max_hp = 1000
walk_speed = 102
nature = "zombie"

[stances.base]
label = "CHEVALIER ZOMBIE"
label_en = "ZOMBIE KNIGHT"

# Thrust, hair whip, piercing hair: the same button three times, once the first lands.
# The sword never swings alone - his hair rides with every stroke.
[stances.base.moves.light]
label = "ESTOC DE CHEVALIER"
label_en = "KNIGHT'S THRUST"
info = "L'épée Luck porte loin, les mèches la suivent. Encore : fouet, puis cheveux perçants"
info_en = "The sword Luck reaches far, his locks riding with it. Again: whip, then piercing hair"
