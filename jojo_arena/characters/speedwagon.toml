# Robert E. O. Speedwagon (Part 1, bonus). GDD: "Sans pouvoir · Joke": a bowler hat
# with blades (a boomerang), street blows. Pose: a cheer that heals a little. Ultimate:
# "Speedwagon withdraws coolly", an invincible comic exit. Frames (_f) at 60 per second.
#
# No power of his own: the street, the hat, a lot of heart - and the friends he came
# with. The style key whistles them in, one after the other, and each brings a moveset:
# Speedwagon alone -> Tattoo and his knives -> Amato and his kempo -> Speedwagon again.
# Neither friend is strictly better: Tattoo trades close-range power for reach, Amato
# trades reach for the hardest blows in the kit. Switching costs real frames.

name = "Speedwagon"
max_hp = 900
walk_speed = 112
pose_heal_per_s = 12  # his cheer: "JoJo, I'm with you!"
style = { type = "stance_cycle", stances = ["base", "tattoo", "amato"] }

[stances.base]
label = "VOYOU D'OGRE STREET"
label_en = "OGRE STREET THUG"

[stances.base.moves.light]
