# Hol Horse (Part 3) - Emperor. A hired gun of DIO's who would rather be number two.
#
# Sources, read on 17/11/2026:
# - JoJo Wiki, "Hol Horse" (https://jojowiki.com/Hol_Horse): a cowboy hitman, bold, a
#   womanizer, quick-witted but easily frightened; "Why be number one when you can be
#   number two?". He works with J. Geil (Hanged Man), then with Boingo. Named after Hall &
#   Oates (Shueisha Jump Remix).
# - JoJo Wiki, "Emperor" (https://jojowiki.com/Emperor): a gun summoned straight into his
#   hand. Its bullets are part of the Stand: he steers them in flight (round Silver
#   Chariot's sword, a U-turn, down a pipe he cannot see), within its range. Stats
#   B B B C E E.
# - JoJo Wiki, All-Star Battle R ★ Hol Horse (https://jojowiki.com/All-Star_Battle_R/Hol_Horse):
#   Style "Gun beats sword." spins Emperor and powers up the next ☆ skill (more hits, more
#   damage). "You lose, loser!" (☆, a fast bullet that vanishes if he is hit), "Even my
#   bullets are part of my Stand!" (☆, slower, stronger, redirected in flight), "Come get
#   us!" (a water bottle tossed and shot: a puddle that lasts 15 s), "You're up, J.
#   Geil!" (Hanged Man stabs out of the puddle, the opponent crumples, 54). Throw "Now
#   I've got ya!" (he lifts them by the collar and Hanged Man stabs them, 120). HHA "Eat
#   this!" (☆, he spits his cigarette and fires 4 to 10 bullets that come back to hit
#   again, 8 to 20 hits). GHA "Hol Horse is gonna kill ya!" (bottles shattered in a
#   shockwave; Hanged Man stabs from the mirror world and pins them; Emperor's bullet
#   curves through the glass into the forehead, 320). Passive "Hol Horse loves the
#   ladies!" (against women: 10 % more damage, Heart Heat a little slower).
#
# What changes here, and why:
# - "Even my bullets...": in ASBR he stands still and redirects it twice while the Style
#   button is held. Here (decided with the owner on 24/10/2026) it follows the free aim,
#   mouse or right stick, the whole way, and he keeps moving: that is Emperor's power as
#   the manga shows it, and it reads from above.
# - J. Geil: "Come get us!" throws the bottle where he aims (EoH's DHA throws it too), the
#   puddle stays, and Hanged Man stabs out of the reflection when the opponent steps on
#   it: "You're up, J. Geil!" is that stab. No button of its own: there is no free slot.
# - "Eat this!": a bullet here hits once; ten of them, curving in at the target, stand in
#   for the bullets that come back.
# - "I'll be right back!" (he runs off) is left out: the dash already steps back.
# - Normals: ASBR names none. Emperor's butt, a kick, and the point-blank shot the wiki
#   gives Emperor ("instant summoning enables sneak attacks").
# Feel: always moving, always shooting from an angle; the puddle and the curving bullet
# make the opponent come to him, and he never wants them close.

