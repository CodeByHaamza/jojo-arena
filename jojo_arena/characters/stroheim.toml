# Rudol von Stroheim (Part 2) - the German officer who came back as a machine. GDD:
# "Humain augmenté - Artillerie": no Ripple, no Mode, only engineering - a gun where his
# arm was, a flamethrower, and the ultraviolet lamps that are the whole point of him.
# Frames (_f) are at 60 per second.
#
# Nature "human": the Ripple does nothing special to him, and the sun is just daylight.
# No style key. His ultraviolet moves carry the `hamon` flag: not because he breathes,
# but because that flag is what the fight calls "light that burns the undead" - and a
# Pillar Man caught in his lamps takes double, exactly as the GDD says.
# Feel: a man who has replaced everything he lost with something louder.

name = "Rudol von Stroheim"
max_hp = 1000
walk_speed = 100
nature = "human"

[stances.base]
label = "CORPS DE MACHINE"
label_en = "MACHINE BODY"

