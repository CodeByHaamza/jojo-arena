# Straizo (Part 2), a Hamon master turned vampire by the Stone Mask. GDD: "Vampire ·
# Sniper": fast, at range. Space Ripper Stingy Eyes, pressurized jets from the eyes
# that reach very far. Great Heat Attack: an eye barrage that sweeps the whole screen.
# Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# Style key: the sniper stance (he slows down and takes aim; every shot is a jet from the
# eyes, and the stance burns blood while it lasts). Blood fills by draining; Hamon and
# sunlight burn him.
# Feel: keeps away, picks you off, and bites when you come close.

name = "Straizo"
max_hp = 880
walk_speed = 112
nature = "vampire"
style = { type = "vampire", off = "base", on = "sniper" }

[stances.base]
label = "VAMPIRE"

