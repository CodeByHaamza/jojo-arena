text_en = "Dio?! And that body!"

[[exchanges.intro]]
by = "dio_p3"
text = "Une rencontre qui traverse le temps lui-même, c'est ça, JoJo ?!"
text_en = "So an encounter that crosses time itself, is it, JoJo?!"

[exchanges.victory.dio_p3]
text = "Mon ami... Ce corps me servira encore longtemps !"
