# Vanilla Ice: All-Star Battle R ★ Vanilla Ice, "Dialogue" (read 17/11/2026): the match
# entrances of ASBR and the victory quotes against each of them.

[[exchanges]]
fighters = ["vanilla_ice", "avdol"]
source = "ASBR, entrée en matière et citations de victoire de Vanilla Ice et d'Avdol"

[[exchanges.intro]]
by = "vanilla_ice"
text = "Mon vide va souffler ta misérable petite flamme jusqu'au néant !"
text_en = "My void will blow your puny little fire into oblivion!"

[[exchanges.intro]]
by = "avdol"
text = "Espèce de... monstre immonde ! Je vais te réduire en cendres !"
text_en = "Why-- you vile monster! I'll raze you to cinders!"

[exchanges.victory.vanilla_ice]
text = "À quoi bon le feu contre le vide ?!"
text_en = "What good is fire against the void?!"

[exchanges.victory.avdol]
text = "Il faudra te lever de bonne heure pour me battre !"
text_en = "You'd have to get up pretty early in the morning to beat me!"

[[exchanges]]
fighters = ["vanilla_ice", "polnareff"]
source = "ASBR, entrée en matière et citations de victoire de Vanilla Ice et de Polnareff"

[[exchanges.intro]]
by = "vanilla_ice"
text = "Polnareff, tu peux surmonter bien des choses... Mais tu ne me surmonteras pas."
text_en = "Polnareff, you can overcome much... But you won't overcome me."

[[exchanges.intro]]
by = "polnareff"
text = "Viens, sale chien ! Je vais te découper en tranches !"
text_en = "Come at me, you cur! I'll slice you up!"

[exchanges.victory.vanilla_ice]
text = "Ton épée n'est qu'un jouet d'enfant aux yeux de mon Stand..."
text_en = "Your sword is but a child's toy in the eyes of my Stand..."

[exchanges.victory.polnareff]
text = "Ton âme elle-même est aussi creuse que le vide !"
text_en = "Your very soul is as empty as a void!"

[[exchanges]]
fighters = ["vanilla_ice", "dio_p3"]
source = "ASBR, entrée en matière et citations de victoire de Vanilla Ice et de DIO"

[[exchanges.intro]]
by = "dio_p3"
text = "Ice... Je veux éprouver les pouvoirs de The World. Sers-moi de cobaye !"
text_en = "Ice... I wish to test The World's powers. Be my guinea pig!"

[[exchanges.intro]]
by = "vanilla_ice"
text = "À vos ordres, Seigneur DIO."
text_en = "As you wish, Lord DIO."

[exchanges.victory.vanilla_ice]
text = "Tout ce que je fais, je le fais pour vous, Seigneur DIO..."
text_en = "Everything I do, I do for you, Lord DIO..."

[exchanges.victory.dio_p3]
text = "Tu n'as pas à mourir ici... Mon sang te ressuscitera."
text_en = "You needn't die here... My blood will resurrect you."

# Hol Horse: All-Star Battle R ★ Hol Horse, "Dialogue" (read 17/11/2026): the match
# entrances of ASBR and the victory quotes against each of them.

[[exchanges]]
fighters = ["hol_horse", "polnareff"]
source = "ASBR, entrée en matière et citations de victoire de Hol Horse et de Polnareff"

[[exchanges.intro]]
by = "polnareff"
text = "S'il faut te battre avant de voir ce salaud, alors c'est ce que je ferai. En garde !"
text_en = "If I gotta beat you before I can see that bastard, then that's what I'll do. En garde!"

[[exchanges.intro]]
by = "hol_horse"
text = "Le pistolet est plus fort que l'épée, comme on dit. Si c'est pas la vérité, ça !"
text_en = "'The gun is mightier than the sword.' Damn if that ain't the truth!"

[exchanges.victory.hol_horse]
text = "Tu t'es moqué de moi... et tu l'as payé de ta vie !"
text_en = "You made fun of me... and you paid for it with your life!"

[exchanges.victory.polnareff]
text = "L'épée bat le pistolet quand on veut ! Enfin, quand c'est moi qui la tiens."
text_en = "Swords beat guns any day! Well, they do if you're me, that is!"

[[exchanges]]
fighters = ["hol_horse", "avdol"]
source = "ASBR, entrée en matière et citations de victoire de Hol Horse et d'Avdol"

[[exchanges.intro]]
by = "avdol"
text = "Je vais réduire toutes tes balles en cendres !"
text_en = "I'll burn away all of your bullets!"

[[exchanges.intro]]
by = "hol_horse"
text = "Je vais te loger une balle entre les deux yeux, Avdol !"
text_en = "I'll put a hole right between your eyes, Avdol!"

[exchanges.victory.hol_horse]
text = "Les pièces de ton petit jeu ne me font plus peur !"
text_en = "The pieces of your little game no longer frighten me!"

[exchanges.victory.avdol]
text = "Qu'y a-t-il ? Ta cigarette s'est éteinte. Besoin de feu ?"
text_en = "What's wrong? Your smoke's burnt out. Need a light?"

[[exchanges]]
fighters = ["hol_horse", "kakyoin"]
source = "ASBR, entrée en matière et citations de victoire de Hol Horse et de Kakyoin"

[[exchanges.intro]]
by = "kakyoin"
text = "Bande de lâches ! Vous allez tomber !"
text_en = "You cowards! You're going down!"

[[exchanges.intro]]
by = "hol_horse"
text = "Kakyoin, le manieur de Hierophant, hein ? Mort au traître !"
text_en = "Kakyoin the Hierophant user, huh? Death to the betrayer!"

[exchanges.victory.hol_horse]
text = "Tu sais, la fin d'une vie, c'est souvent un rideau qui tombe d'un coup."
text_en = "Well, the end of someone's life is usually a pretty sudden curtain call."

[exchanges.victory.kakyoin]
text = "Quelle bande de clowns. Vous ne voyez pas qu'on sait exactement comment vous opérez ?"
text_en = "What a bunch of clowns. Don't you realize we know exactly how you work?"

[[exchanges]]
fighters = ["hol_horse", "dio_p3"]
source = "ASBR, entrée en matière et citations de victoire de Hol Horse et de DIO"

[[exchanges.intro]]
by = "hol_horse"
text = "Le fort d'Emperor, c'est l'assassinat à bout portant ! On le tient !"
text_en = "Emperor's forte is close-quarters assassination! We got 'em now!"

[[exchanges.intro]]
by = "dio_p3"
text = "Tu essaies vraiment de me tirer dessus ?"
text_en = "Are you really trying to shoot me?"

[exchanges.victory.hol_horse]
text = "Je me range toujours du côté du plus fort. Point."
text_en = "I stick by the strongest I find. That's it!"

[exchanges.victory.dio_p3]
text = "Tu me plais. Jamais une goutte de sueur, jamais perdu le rythme. Tu es froid comme la glace, Hol Horse."
text_en = "I like you. You never sweated, never lost your rhythm. You are cool as ice, Hol Horse."

# Mariah: All-Star Battle R ★ Mariah, "Dialogue" (read 17/11/2026): the match entrances
# of ASBR and the victory quotes against each of them.

[[exchanges]]
fighters = ["hol_horse", "mariah"]
source = "ASBR, entrée en matière et citations de victoire de Hol Horse et de Mariah"

[[exchanges.intro]]
by = "hol_horse"
text = "Je me lasserai jamais de ces jambes !"
text_en = "I never get tired of seeing those legs!"

[[exchanges.intro]]
by = "mariah"
text = "Ah oui, Hol Horse... Le manieur de Stand qui n'a jamais servi à rien au seigneur DIO..."
text_en = "Oh right, Hol Horse... The Stand user who never manages to be of any help to Lord DIO..."

[exchanges.victory.mariah]
text = "Voilà pourquoi tu ne gagnes jamais tes combats..."
text_en = "This is why you never win your battles..."

[exchanges.victory.hol_horse]
text = "J'adore les filles qui ont la langue bien pendue comme toi, ma belle !"
text_en = "I sure do love a girl with a sharp tongue like yours, baby!"

[[exchanges]]
fighters = ["mariah", "joseph_p3"]
source = "ASBR, entrée en matière et citations de victoire de Mariah et de Joseph âgé"

[[exchanges.intro]]
by = "mariah"
text = "Joseph Joestar ! Tu es bien plus vieux que moi, mais j'ai pensé à faire de toi mon petit ami. Hé hé hé."
text_en = "Joseph Joestar! You're much older than me, but I did think about making a boyfriend out of you. Heh heh heh."

[[exchanges.intro]]
by = "joseph_p3"
text = "Comme c'est gentil. Alors arrête d'essayer de me faire du mal !"
text_en = "Well isn't that nice. Stop trying to hurt me, then!"

[exchanges.victory.mariah]
text = "Laisse tomber. Tu n'es rien à côté du charme du seigneur DIO."
text_en = "Forget it. You're nothing compared to the charm of Lord DIO."

[exchanges.victory.joseph_p3]
text = "Tu as perdu, ma chère."
text_en = "You lose, my dear."

[[exchanges]]
fighters = ["mariah", "avdol"]
source = "ASBR, entrée en matière et citations de victoire de Mariah et d'Avdol"

[[exchanges.intro]]
by = "avdol"
text = "Femme ! Mes flammes vont te réduire en cendres !"
text_en = "Woman! My flames will burn you right up!"

[[exchanges.intro]]
by = "mariah"
text = "Hé hé hé... Je vais t'apprendre l'horreur du magnétisme !"
text_en = "Heh heh heh... Time to teach you about the horrors of magnetism!"

[exchanges.victory.mariah]
text = "J'ai besoin d'une cigarette... Tu me donnerais du feu ?"
text_en = "I need a smoke... Mind giving me a light?"

[exchanges.victory.avdol]
text = "C'était vraiment une adversaire redoutable..."
text_en = "She really was a fearsome opponent..."

[[exchanges]]
fighters = ["mariah", "dio_p3"]
source = "ASBR, entrée en matière et citations de victoire de Mariah et de DIO"

[[exchanges.intro]]
by = "dio_p3"
text = "Viens, Mariah. Je vais te mettre à l'épreuve."
text_en = "Come, Mariah. I will test you."

[[exchanges.intro]]
by = "mariah"
text = "Quel honneur de croiser le fer avec vous, seigneur DIO !"
text_en = "I'm honored to be able to spar with you like this, Lord DIO!"

[exchanges.victory.mariah]
text = "J'écraserai les Joestar avec ce pouvoir !"
text_en = "I'll crush the Joestars with this power of mine!"

[exchanges.victory.dio_p3]
text = "L'aimantation s'estompe... Qu'y a-t-il ? Déjà fini ?"
text_en = "The magnetism is wearing off... What's wrong? Finished already?"

