# Tarkus (Part 1). GDD: "Zombie · Grappler": very slow, very tough. Chain Neck Ring:
# both are locked inside a ring of chains, and nobody leaves it. Ultimate: the Neck
# Breaker, a huge grab. Frames (_f) are at 60 per second; speeds and knockback in px/s.
#
# A zombie: Hamon burns him (double damage) and so does the sun. No style key.
# Feel: a wall of iron that walks on you, armored blows, then nowhere left to run.

name = "Tarkus"
max_hp = 1150
walk_speed = 82
strength = 1.8  # he hurls props like a Stand
nature = "zombie"

[stances.base]
label = "COLOSSE ZOMBIE"
label_en = "ZOMBIE COLOSSUS"

