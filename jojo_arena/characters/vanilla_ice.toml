# Vanilla Ice (Part 3) - Cream. DIO's most loyal servant, made a vampire by his blood.
#
# Sources, read on 17/11/2026:
# - JoJo Wiki, "Vanilla Ice" (https://jojowiki.com/Vanilla_Ice): he cut off his own head
#   to give DIO his blood, and DIO raised him a vampire. Cream erased Avdol, then Iggy;
#   Polnareff saw he was a vampire and dragged him into the sun.
# - JoJo Wiki, "Cream" (https://jojowiki.com/Cream): a close-range Stand strong enough to
#   behead with a chop. Its mouth opens on the void: it swallows itself and its user and
#   becomes a ball that erases whatever it passes through, unseen, untouchable, fast
#   enough to run Polnareff down. Inside, Ice cannot see out: he has to peek out, and
#   that is when he can be struck. Stats B B D C C D.
# - JoJo Wiki, All-Star Battle R ★ Vanilla Ice (https://jojowiki.com/All-Star_Battle_R/Vanilla_Ice):
#   Stand and vampirism styles. Without Cream: "You foul creature!" (Cream kicks a downed
#   opponent, then launches), "How dare you!" (a rising uppercut that moves forward, a
#   reversal and an anti-air), "This vicious arm!" (Cream chops several times as Ice
#   advances), "Lord DIO!" (he drains the opponent's blood, heals a little, kicks them
#   away: a command throw), "Now I've taken your legs!" (Cream bursts out of the ground
#   in a moving assault, unblockable as it comes up). Throw: "I swear I'll kill you!"
#   (Ice holds them by the neck while Cream collides with them). With Cream: "Once and
#   for all!" (Cream swallows itself and flies forward, unblockable and invincible; "the
#   direction and attack button change its path and speed"). HHA "The great void rises!"
#   (he enters Cream and lunges; Cream swallows the opponent and spits them out,
#   unblockable, 190). GHA "Miasma of the Void" (inside Cream he flies in a vertical
#   circle, the opponent caught in its spiral, a last blow upward; unblockable, 340).
#
# What changes here, and why:
# - ASBR's Stand Power Gauge (spent by the void and by Cream from the floor, it refills
#   with Cream called back) is not in our engine: those moves have a cooldown instead.
# - "You foul creature!" only hits a downed opponent in ASBR; with no knockdown game here,
#   it ends his chain, Cream's kicks raining on whoever the chain has already staggered.
# - The void: two versions of "Once and for all!", as the ASBR input gives two. Straight
#   (no direction): faster and shorter. Steered (a direction): slower, longer, and it
#   goes where the stick pushes it the whole way. Both erase the props they pass through,
#   and he peeks out at the end, open to a blow.
# - "Miasma of the Void": the vertical circle cannot be seen from above. The void crosses
#   the arena in a line (shape = "line", reach across it), and the circle and the spiral
#   play in its cutscene.
# Feel: a hunter you cannot see. He goes into the void, comes at you through the walls
# and the crates, and peeks out to look for you: that moment is yours.

name = "Vanilla Ice"
max_hp = 950
walk_speed = 100
strength = 1.6  # Cream: strong enough to behead with one chop
nature = "vampire"  # the sun and the Ripple burn him
style = { type = "stance_toggle", off = "base", on = "stand", stand_body = true }

