# Jotaro Kujo (Part 3) - Star Platinum. GDD: "Stand · Brawler burst": very short range,
# devastating damage and speed. Ora rush, Star Finger, time stop (~3 s, long cooldown).
# Frames (_f) are at 60 per second; speeds and knockback in pixels per second.
#
# Inputs: light / heavy / special; special while holding a direction = special_alt.
# Stand key: Star Platinum out (stance "stand") or back (stance "base").

name = "Jotaro Kujo (P3)"
max_hp = 1000
walk_speed = 92
style = { type = "stance_toggle", off = "base", on = "stand", stand_body = true }

# Jotaro alone ---------------------------------------------------------------------------

[stances.base]
label = "SANS STAND"

