# Joseph Joestar, young (Part 2): look file for tools/make_sprites.py.
# Messy brown hair, a dark green tank top, the striped scarf, black fingerless gloves
# with studs, a brown belt, blue jeans and black boots.

name = "Joseph Joestar"

# Tall and broad like his grandfather, but lighter on his feet.
# Signature pose (Pose key): "Your next line is...!", a finger pointed.
pose = "point"

[build]
head_r = 5.9
neck = 1.1
torso = 14.5
legs = 17.5
arms = 15.5
shoulders = 9.4
hips = 3.5
torso_r = 6.5
arm_r = 2.8
leg_r = 2.7
hand_r = 2.3
foot_r = 2.5

[palette]
skin = "#f0c49c"
hair = "#6a4228"
top = "#2f6a5a"
scarf = "#e8cc48"
stripe = "#3c8a50"
