# Noriaki Kakyoin (Part 3): look file for tools/make_sprites.py.
# Change a color or a setting, then run:  python tools/make_sprites.py kakyoin

name = "Noriaki Kakyoin"

# Body shape, in pixels: tall and slender.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "frame_face"

[build]
head_r = 5.4
neck = 1.6
torso = 13.5
legs = 17.5
arms = 14.5
shoulders = 7.6
hips = 3.0
torso_r = 5.2
arm_r = 1.9
leg_r = 2.2
hand_r = 2.0
foot_r = 2.3

[palette]
skin = "#f2c8a6"
hair = "#c4573f"
uniform = "#3a5a35"      # green school uniform
gold = "#e8c03a"
cherry = "#b52a64"
shoes = "#6b4430"
eyes = "#7a4fa0"

[body]
head = "skin"
torso = "uniform"
arms = "uniform"
hands = "skin"
legs = "uniform"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
ear = true

# Red hair swept up and back, locks over the nape, and the long wavy curl
# hanging beside the face.
[[parts]]
type = "hair"
material = "hair"
style = "swept"
volume = 7.9
back_length = 7
bangs = "curl"
bangs_side = "left"
bangs_length = 11
bangs_width = 1.6
bangs_spread = 3.5

# Long closed gakuran: high collar with gold pins, gold buttons and cuff buttons.
[[parts]]
type = "coat"
material = "uniform"
length = 0.9
open = false
collar = true
pins = "gold"
buttons = "gold"
cuffs = "gold"

# The cherry earrings.
[[parts]]
type = "earring"
material = "cherry"
style = "cherry"
