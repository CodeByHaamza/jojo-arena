# Noriaki Kakyoin (Part 3): look file for tools/make_sprites.py.
# Change a color or a setting, then run:  python tools/make_sprites.py kakyoin

name = "Noriaki Kakyoin"

# Body shape, in pixels: tall and slender.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "frame_face"

[build]
head_r = 5.4
neck = 1.6
torso = 13.5
legs = 17.5
arms = 14.5
shoulders = 7.6
hips = 3.0
torso_r = 5.2
arm_r = 1.9
leg_r = 2.2
hand_r = 2.0
foot_r = 2.3

[palette]
skin = "#f2c8a6"
hair = "#c4573f"
uniform = "#3e522f"      # dark olive-green school uniform
gold = "#e8c03a"
cherry = "#b52a64"
shoes = "#6b4430"
eyes = "#7a4fa0"

[body]
head = "skin"
torso = "uniform"
arms = "uniform"
hands = "skin"
legs = "uniform"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
ear = true

# Red hair swept up and back, locks over the nape, and the long wavy curl
# hanging beside the face.
[[parts]]
type = "hair"
material = "hair"
style = "swept"
volume = 7.9
back_length = 7
bangs = "curl"
bangs_side = "left"
bangs_length = 11
bangs_width = 1.6
bangs_spread = 3.5

# Long closed gakuran: high collar with gold pins, gold buttons and cuff buttons.
[[parts]]
type = "coat"
material = "uniform"
length = 0.9
open = false
collar = true
pins = "gold"
buttons = "gold"
cuffs = "gold"

# The cherry earrings.
[[parts]]
type = "earring"
material = "cherry"
style = "cherry"

# Key-pose animations ------------------------------------------------------------------
# [anims.<name>] replaces the generated animation of that name, or adds a new one that a
# move picks in the kit (anim = "<name>"). One [[anims.<name>.<view>]] table per key pose,
# for the views down, up and right (a view left out copies another). Pose settings are
# those of tools/spritegen/skeleton.py (Pose): bob, lean, head, hand_l, hand_r, foot_l,
# foot_r, big_hand_r. `phases` shares the keys between startup, active and recovery;
# `tween` draws in-between frames after each key, for a smoother, longer move.

# EMERALD SPLASH: both hands meet before the chest in a diamond, rise to the face, then
# thrust out, legs wide, to let the emeralds go.
[anims.special_splash]
fps = 12
phases = [2, 1, 2]
tween = 1

[[anims.special_splash.right]]
lean = -1
hand_r = [3, -9]
hand_l = [4, -9]
foot_l = [-3, 0]
foot_r = [3, 0]

[[anims.special_splash.right]]
lean = -1.5
bob = 1
hand_r = [5, -14]
hand_l = [6, -13]
foot_l = [-3, 0]
foot_r = [3, 0]

[[anims.special_splash.right]]
lean = 2
hand_r = [12, -11]
hand_l = [11, -10]
foot_r = [5, 0]
foot_l = [-4, 0]

[[anims.special_splash.right]]
lean = 1.5
hand_r = [11, -10]
hand_l = [10, -9]
foot_r = [5, 0]
foot_l = [-4, 0]

[[anims.special_splash.right]]
lean = 0.5
hand_r = [4, -4]
hand_l = [3, -3]
foot_r = [2, 0]

[[anims.special_splash.down]]
hand_r = [-6, -9]
hand_l = [6, -9]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_splash.down]]
bob = 1
hand_r = [-6, -14]
hand_l = [6, -14]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_splash.down]]
bob = -1
hand_r = [-5, -8]
hand_l = [5, -8]
big_hand_r = true
foot_l = [-3, 0]
foot_r = [3, 0]

[[anims.special_splash.down]]
hand_r = [-5, -7]
hand_l = [5, -7]
foot_l = [-3, 0]
foot_r = [3, 0]

[[anims.special_splash.down]]
hand_r = [-2, -3]
hand_l = [2, -3]

[[anims.special_splash.up]]
hand_r = [-6, -10]
hand_l = [6, -10]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_splash.up]]
bob = 1
hand_r = [-6, -15]
hand_l = [6, -15]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_splash.up]]
bob = -1
hand_r = [-5, -17]
hand_l = [5, -17]
foot_l = [-3, 0]
foot_r = [3, 0]

[[anims.special_splash.up]]
hand_r = [-5, -16]
hand_l = [5, -16]
foot_l = [-3, 0]
foot_r = [3, 0]

[[anims.special_splash.up]]
hand_r = [-2, -4]
hand_l = [2, -4]
