# Bruford (Part 1): look file for tools/make_sprites.py.
# A zombie knight: grey-lavender skin, a wild mane of black hair, a golden diadem,
# grey plate under a dark cloak, light blue clothes, his sword Luck in hand.

name = "Bruford"

# Tall and broad, a knight's build.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "flex"

[build]
head_r = 5.8
neck = 1.0
torso = 14.5
legs = 17
arms = 15
shoulders = 9.4
hips = 3.4
torso_r = 6.6
arm_r = 2.6
leg_r = 2.6
hand_r = 2.4
foot_r = 2.5

[palette]
skin = "#b8aec8"
hair = "#1c1822"
gold = "#e8c03a"
plate = "#8a8a9a"
cloak = "#4e4258"
cloth = "#98aed0"
boots = "#5a5a66"
steel = "#d0d4e0"
eyes = "#ff8a3a"
scar = "#8e8498"

[body]
head = "skin"
torso = "plate"
arms = "cloth"
hands = "skin"
legs = "cloth"
feet = "boots"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
scar = "scar"

# The wild mane that he fights with.
[[parts]]
type = "hair"
material = "hair"
style = "mane"
volume = 8.4
flare = 0.9
fill = 0.8
back_length = 10

[[parts]]
type = "headband"
material = "gold"
gem = "gold"

# The collar plate ends in a decorated metal disc.
[[parts]]
type = "emblem"
material = "gold"
shape = "circle"

[[parts]]
type = "coat"
material = "cloak"
length = 0.45
open = true
opening = 6
collar = true

[[parts]]
type = "pauldrons"
material = "plate"
size = 3.8

[[parts]]
type = "belt"
material = "cloak"
buckle = "gold"

[[parts]]
type = "boots"
material = "boots"
length = 0.4

[[parts]]
type = "sword"
material = "steel"
length = 16
guard = "gold"


# JoJo poses ---------------------------------------------------------------------------
# No source shows a pose of this fighter (no JoJo Wiki gallery, absent from All-Star
# Battle R and Eyes of Heaven, searched 15/11/2026). The owner asked for poses invented in
# the fighter's bizarre spirit, from his moments in the manga; each says so in `source`.
# One key per view: it breathes on its own.

[poses.assis_cheveux]
label = "Assis sur ses cheveux"
label_en = "Sitting on his hair"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : ses cheveux qui attrapent et boivent, assez forts pour qu'il s'y asseye"

[[poses.assis_cheveux.down]]
bob = 5
hand_l = [-4, -2]
elbow_l = [-3, 0]
hand_r = [4, -2]
elbow_r = [3, 0]
knee_l = [-3, -3]
knee_r = [3, -3]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.assis_cheveux.right]]
bob = 5
hand_r = [2, -2]
hand_l = [-2, -2]
knee_r = [4, -3]
foot_r = [5, 0]

[poses.luck_pluck]
label = "Luck & Pluck levée"
label_en = "Luck & Pluck raised"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : l'épée Luck, sur laquelle Jonathan grave « Pluck »"

[[poses.luck_pluck.down]]
hand_r = [1, -24]
elbow_r = [3, -3]
hand_l = [2, -5]
elbow_l = [-4, 0]

[[poses.luck_pluck.right]]
hand_r = [3, -24]
elbow_r = [2, -3]
hand_l = [1, -5]
elbow_l = [-3, 0]

[poses.salut_chevalier]
label = "Le salut du chevalier"
label_en = "The knight's salute"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : le chevalier qui salue le courage de Jonathan avant de mourir"

[[poses.salut_chevalier.down]]
head = [0, 1]
hand_r = [-3, -14]
elbow_r = [3, 1]
hand_l = [0, 0]

[[poses.salut_chevalier.right]]
head = [1, 1]
hand_r = [5, -14]
elbow_r = [1, 2]
hand_l = [-1, 0]

# The outfit and its colours ---------------------------------------------------------------
# Bruford is in neither All-Star Battle R nor Eyes of Heaven: no game tint to take. His
# JoJo Wiki page, "Color Schemes" (read 17/11/2026), gives the colours of each medium; the
# page itself warns they "may or may not be canon". Each colour below is one of them.

[costume]
label = "Sa tenue"
label_en = "His outfit"
source = "JoJo Wiki, Bruford, Appearance"

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "JoJo Wiki, Bruford, Color Schemes : l'anime"

[colors.manga]
label = "Manga en couleur"
label_en = "Coloured manga"
source = "JoJo Wiki, Bruford, Color Schemes : le manga en couleur"

[colors.manga.palette]
skin = "#e8c4a4"
plate = "#3c5ca8"
cloth = "#3a4a9a"

[colors.film]
