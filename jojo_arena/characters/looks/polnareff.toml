# Jean Pierre Polnareff (Part 3): look file for tools/make_sprites.py.
# Tall silver-grey flat-top with long strands falling behind, no eyebrows, broken-heart
# earrings, a fitted black top with one strap to the left shoulder (shoulders bare),
# light trousers with a belt and pouches, black wristbands.

name = "Jean Pierre Polnareff"

# Tall, broad and strong.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "point_up"

[build]
head_r = 5.6
neck = 1.2
torso = 13.5
legs = 17.5
arms = 14.5
shoulders = 9.2
hips = 3.4
torso_r = 6.2
arm_r = 2.5
leg_r = 2.5
hand_r = 2.4
foot_r = 2.4

[palette]
skin = "#efc7a6"
hair = "#c9cdd8"         # silver-grey
top = "#24222c"
trousers = "#d6dce8"     # pale grey-blue
belt = "#4a3a34"
pouch = "#7a5232"
heart = "#c8394a"
shoes = "#3a3040"
eyes = "#3a6ab0"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "trousers"
feet = "shoes"

# No eyebrows.
[face]
eyes = "eyes"
eye_style = "wide"
nose = true
ear = true

# The famous tall flat-top, with long strands falling down the back.
[[parts]]
type = "hair"
material = "hair"
style = "tower"
height = 11
volume = 7.8
back_length = 7

[[parts]]
type = "top"
material = "top"
neckline = 4
strap = "left"

[[parts]]
type = "belt"
material = "belt"
pouches = "pouch"

[[parts]]
type = "earring"
material = "heart"
style = "heart"

[[parts]]
type = "gloves"
material = "top"
length = 0.15
