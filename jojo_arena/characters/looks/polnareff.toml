# Jean Pierre Polnareff (Part 3): look file for tools/make_sprites.py.
# Tall silver-grey flat-top with long strands falling behind, no eyebrows, broken-heart
# earrings, a fitted black top with one strap to the left shoulder (shoulders bare),
# light trousers with a belt and pouches, black wristbands.

name = "Jean Pierre Polnareff"

# Tall, broad and strong.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "point_up"

[build]
head_r = 5.6
neck = 1.2
torso = 13.5
legs = 17.5
arms = 14.5
shoulders = 9.2
hips = 3.4
torso_r = 6.2
arm_r = 2.5
leg_r = 2.5
hand_r = 2.4
foot_r = 2.4

[palette]
skin = "#efc7a6"
hair = "#c9cdd8"         # silver-grey
top = "#24222c"
trousers = "#d6dce8"     # pale grey-blue
belt = "#4a3a34"
pouch = "#7a5232"
heart = "#c8394a"
shoes = "#3a3040"
eyes = "#3a6ab0"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "trousers"
feet = "shoes"

# No eyebrows.
[face]
eyes = "eyes"
eye_style = "wide"
nose = true
ear = true

# The famous tall flat-top, with long strands falling down the back.
[[parts]]
type = "hair"
material = "hair"
style = "tower"
height = 11
volume = 7.8
back_length = 7

[[parts]]
type = "top"
material = "top"
neckline = 4
strap = "left"

[[parts]]
type = "belt"
material = "belt"
pouches = "pouch"

[[parts]]
type = "earring"
material = "heart"
style = "heart"

[[parts]]
type = "gloves"
material = "top"
length = 0.15

# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# reference image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the
# character galleries, the Jump Comics covers, the All-Star Battle R and Eyes of Heaven
# pages) on 15/11/2026. A pose with `stand = true` is struck with the Stand out: the Stand
# strikes the pose of the same name in its own look file, `stand_offset` [ahead, aside]
# away. One key per view: it breathes on its own.

# His pose in the anime: a low lunge, one hand down to the ground, the other back.
[poses.pose_anime]
label = "La fente de l'anime"
label_en = "The anime lunge"
source = "Galerie de Polnareff sur JoJo Wiki (« Polnareff's iconic pose », anime)"

[[poses.pose_anime.down]]
bob = 4
lean = 1
hand_r = [-1, 7]
elbow_r = [2, 0]
hand_l = [-4, -2]
elbow_l = [-2, 1]
knee_l = [-4, -2]
knee_r = [4, -2]
foot_l = [-3, 0]
foot_r = [3, 0]

[[poses.pose_anime.right]]
bob = 4
lean = 2.5
hand_r = [6, 7]
hand_l = [-6, -3]
foot_r = [5, 0]
knee_r = [4, -2]
foot_l = [-6, 0]

# The title page of chapter 144: the arms bent before the chest, the grin.
[poses.profil_144]
label = "Le profil du chapitre 144"
label_en = "The chapter 144 profile"
source = "Page de titre du ch. 144 (« Polnareff's profile »)"

[[poses.profil_144.down]]
hand_l = [4, -11]
elbow_l = [-4, 0]
hand_r = [-4, -11]
elbow_r = [4, 0]

[[poses.profil_144.right]]
lean = 0.5
hand_r = [6, -11]
elbow_r = [1, 2]
hand_l = [5, -10]
elbow_l = [-1, 2]

# The cover of Jump 1989 n°36: both arms raised and bent, the elbows out.
[poses.wsj_36]
label = "La couverture du Jump n°36"
label_en = "The Jump n°36 cover"
source = "Couverture du Weekly Shonen Jump 1989 n°36"

[[poses.wsj_36.down]]
hand_l = [-6, -18]
elbow_l = [-8, -6]
hand_r = [6, -18]
elbow_r = [8, -6]
foot_l = [-1, 0]
foot_r = [1, 0]

[[poses.wsj_36.right]]
hand_r = [4, -18]
elbow_r = [5, -6]
hand_l = [-2, -18]
elbow_l = [-4, -6]

# Silver Chariot with a rapier in each hand, crossed above its head; Polnareff before it.
[poses.deux_rapieres]
label = "Deux rapières croisées"
label_en = "Two crossed rapiers"
source = "Planche de l'anime, galerie de Polnareff sur JoJo Wiki (« dual wielding two rapiers »)"
stand = true
stand_offset = [-6, -7]

[[poses.deux_rapieres.down]]
head = [0, 1]
hand_l = [-1, 0]
hand_r = [1, 0]

[[poses.deux_rapieres.right]]
head = [0, 1]
hand_r = [1, 0]
hand_l = [-1, 0]

# Silver Chariot without its armour: Polnareff shows it off, hands behind his head.
[poses.sans_armure]
label = "Silver Chariot sans armure"
label_en = "Silver Chariot without armour"
source = "Ch. 126 (ASBR, pose d'esquive stylée 4) ; galerie de Polnareff sur JoJo Wiki"
stand = true
stand_offset = [-5, 10]

[[poses.sans_armure.down]]
head = [0, -1]
hand_l = [2, -21]
elbow_l = [-7, -4]
hand_r = [-2, -21]
elbow_r = [7, -4]

[[poses.sans_armure.right]]
hand_r = [-1, -21]
elbow_r = [4, -4]
hand_l = [-3, -21]
elbow_l = [-2, -4]
