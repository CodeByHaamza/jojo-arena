# Robert E. O. Speedwagon (Part 1): look file for tools/make_sprites.py.
# A blond mullet, a scar across the left cheek, a black bowler hat with blades hidden in
# the brim, a black coat over an indigo waistcoat, a pink tie, black trousers.

