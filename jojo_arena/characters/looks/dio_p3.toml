# DIO (Part 3): look file for tools/make_sprites.py.
# Golden hair swept up in spikes, green heart-shaped band on the forehead, gold earring,
# a golden jacket over a fitted black tank top, bare muscular arms with ringed gold
# bracelets, green belt with a heart buckle, trousers with green heart knee pads,
# pointed shoes (crakows).

name = "DIO (P3)"

# Tall and heavily muscled.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "arch"

[build]
head_r = 5.8
neck = 1.0
torso = 14
legs = 17.5
arms = 15
shoulders = 9.4
hips = 3.5
torso_r = 6.5
arm_r = 2.6
leg_r = 2.6
hand_r = 2.5
foot_r = 2.5

[palette]
skin = "#f3d4bc"
hair = "#f5d86a"         # golden blond, lighter than the clothes
band = "#2f7a4a"
heart = "#5cc87e"
jacket = "#d9952b"       # deeper gold, so hair and jacket stay apart
top = "#24222c"
trousers = "#d6a032"
gold = "#f0c84a"
shoes = "#3a2a1e"
eyes = "#b8402e"

[body]
head = "skin"
torso = "top"
arms = "skin"
hands = "skin"
legs = "trousers"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true

# Long, thick golden hair falling past the shoulders, with a fringe.
[[parts]]
type = "hair"
material = "hair"
style = "mane"
volume = 8.4
flare = 0.75
back_length = 4

# Green band with the heart on the forehead.
[[parts]]
type = "headband"
material = "band"
gem = "heart"
gem_shape = "heart"

[[parts]]
type = "earring"
material = "gold"

# Short open jacket: it stops just below the waist.
[[parts]]
type = "coat"
material = "jacket"
length = 0.12
open = true
opening = 5
collar = true

[[parts]]
type = "gloves"
material = "gold"
length = 0.16
ribbed = true

# Green belt with a heart buckle.
[[parts]]
type = "belt"
material = "band"
buckle = "heart"
buckle_shape = "heart"

[[parts]]
type = "emblem"
material = "heart"
shape = "heart"
on = "knees"

# Crakows: shoes with long pointed toes.
[[parts]]
type = "boots"
material = "shoes"
length = 0.12
pointed = true

# Key-pose animations ------------------------------------------------------------------
# [anims.<name>] replaces the generated animation of that name, or adds a new one that a
# move picks in the kit (anim = "<name>"). One [[anims.<name>.<view>]] table per key pose,
# for the views down, up and right (a view left out copies another). Pose settings are
# those of tools/spritegen/skeleton.py (Pose): bob, lean, head, hand_l, hand_r, foot_l,
# foot_r, big_hand_r. `phases` shares the keys between startup, active and recovery;
# `tween` draws in-between frames after each key, for a smoother, longer move.

# Knives: the arms cross before the chest, a fan of knives between the fingers, then
# fling wide apart.
[anims.special_knives]
fps = 12
phases = [2, 1, 2]
tween = 1

[[anims.special_knives.right]]
lean = -1
hand_r = [-2, -10]
hand_l = [3, -11]

[[anims.special_knives.right]]
lean = -2
bob = 1
head = [-1, 0]
hand_r = [-5, -13]
hand_l = [-3, -12]
foot_l = [-2, 0]

[[anims.special_knives.right]]
lean = 2.5
hand_r = [13, -11]
hand_l = [9, -5]
foot_r = [4, 0]
foot_l = [-3, 0]

[[anims.special_knives.right]]
lean = 2
hand_r = [12, -9]
hand_l = [8, -4]
foot_r = [4, 0]
foot_l = [-3, 0]

[[anims.special_knives.right]]
lean = 1
hand_r = [4, -4]
hand_l = [2, -3]
foot_r = [2, 0]

[[anims.special_knives.down]]
hand_r = [-9, -10]
hand_l = [9, -10]

[[anims.special_knives.down]]
bob = 1
hand_r = [-10, -13]
hand_l = [10, -13]

[[anims.special_knives.down]]
bob = -1
hand_r = [8, -6]
hand_l = [-8, -6]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.down]]
hand_r = [7, -4]
hand_l = [-7, -4]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.down]]
hand_r = [1, -3]
hand_l = [-1, -3]

[[anims.special_knives.up]]
hand_r = [-9, -12]
hand_l = [9, -12]

[[anims.special_knives.up]]
bob = 1
hand_r = [-10, -15]
hand_l = [10, -15]

[[anims.special_knives.up]]
bob = -1
hand_r = [8, -11]
hand_l = [-8, -11]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.up]]
hand_r = [7, -9]
hand_l = [-7, -9]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.up]]
hand_r = [1, -4]
hand_l = [-1, -4]

# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# reference image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the
# character galleries, the Jump Comics covers, the All-Star Battle R and Eyes of Heaven
# pages) on 15/11/2026. A pose with `stand = true` is struck with the Stand out: the Stand
# strikes the pose of the same name in its own look file, `stand_offset` [ahead, aside]
# away. One key per view: it breathes on its own.

# From the back, as Hermit Purple's spirit photograph caught him: the body twisted, one
# hand in his hair behind the head, the other across the waist.
[poses.de_dos]
label = "De dos, la main dans les cheveux"
label_en = "From behind, hand in his hair"
source = "Photographie spirite d'Hermit Purple (galerie « JoJo Poses » de JoJo Wiki)"

[[poses.de_dos.down]]
lean = -1.5
head = [-1, 0]
hand_l = [-1, -22]
elbow_l = [-6, -4]
hand_r = [-3, -6]
elbow_r = [3, 1]

[[poses.de_dos.right]]
lean = -1
head = [-1, 0]
hand_l = [-2, -22]
elbow_l = [-4, -3]
hand_r = [3, -6]
elbow_r = [1, 2]

# The cover of volume 27: a clawed hand up before the face, the other arm back, a knee
# raised in the stride.
[poses.tome_27]
label = "La couverture du tome 27"
label_en = "The cover of volume 27"
source = "Couverture du tome 27 ; ASBR, pose de victoire A"

[[poses.tome_27.down]]
lean = 1
hand_r = [-2, -18]
elbow_r = [5, 0]
hand_l = [-2, 2]
foot_l = [0, -4]
knee_l = [-2, -3]

[[poses.tome_27.right]]
lean = 1.5
hand_r = [5, -17]
elbow_r = [3, 1]
hand_l = [-4, 1]
foot_r = [2, -5]
knee_r = [4, -6]

# In the shadows, chapter 118: a foot up on a step, the knee high, a hand behind the head.
[poses.ombre_118]
label = "Dans l'ombre"
label_en = "In the shadows"
source = "Ch. 118, page de couverture B ; ASBR (référence de son coup moyen debout)"

[[poses.ombre_118.down]]
lean = -1
head = [-1, 1]
hand_l = [-1, -21]
elbow_l = [-6, -3]
hand_r = [1, -3]
foot_r = [2, -6]
knee_r = [3, -8]

[[poses.ombre_118.right]]
lean = -0.5
hand_l = [-1, -21]
elbow_l = [-3, -3]
hand_r = [5, -4]
foot_r = [4, -6]
knee_r = [6, -7]

# Za Warudo: The World steps out in front of him, arms flung wide; DIO behind, a clawed
# hand at his face, the other on the hip.
[poses.za_warudo]
label = "« Za Warudo ! »"
label_en = "\"The World!\""
source = "L'arrêt du temps (manga), galerie de The World sur JoJo Wiki (« TheWorldTimeStop »)"
