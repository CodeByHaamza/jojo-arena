# DIO (Part 3): look file for tools/make_sprites.py.
# Long golden hair, green heart-shaped band on the forehead, gold earring, a golden
# jacket over a fitted black tank top, bare muscular arms with black wristbands,
# trousers with green heart knee pads, pointed shoes (crakows).

name = "DIO (P3)"

# Tall and heavily muscled.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "arch"

[build]
head_r = 5.8
neck = 1.0
torso = 14
legs = 17.5
arms = 15
shoulders = 9.4
hips = 3.5
torso_r = 6.5
arm_r = 2.6
leg_r = 2.6
hand_r = 2.5
foot_r = 2.5

[palette]
skin = "#f3d4bc"
hair = "#f5d86a"         # golden blond, lighter than the clothes
band = "#2f7a4a"
heart = "#5cc87e"
jacket = "#d9952b"       # deeper gold, so hair and jacket stay apart
top = "#24222c"
trousers = "#d6a032"
gold = "#f0c84a"
shoes = "#3a2a1e"
eyes = "#b8402e"

[body]
head = "skin"
torso = "top"
arms = "skin"
hands = "skin"
legs = "trousers"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true

# Long, thick golden hair falling past the shoulders, with a fringe.
[[parts]]
type = "hair"
material = "hair"
style = "long"
length = 10
volume = 8.8
bangs = "fringe"

# Green band with the heart on the forehead.
[[parts]]
type = "headband"
material = "band"
gem = "heart"
gem_shape = "heart"

[[parts]]
type = "earring"
material = "gold"

# Short open jacket: it stops just below the waist.
[[parts]]
type = "coat"
material = "jacket"
length = 0.12
open = true
opening = 5
collar = true

[[parts]]
type = "gloves"
material = "top"
length = 0.18

[[parts]]
type = "emblem"
material = "heart"
shape = "heart"
on = "knees"

# Crakows: shoes with long pointed toes.
[[parts]]
type = "boots"
material = "shoes"
length = 0.12
pointed = true

# Key-pose animations ------------------------------------------------------------------
# [anims.<name>] replaces the generated animation of that name, or adds a new one that a
# move picks in the kit (anim = "<name>"). One [[anims.<name>.<view>]] table per key pose,
# for the views down, up and right (a view left out copies another). Pose settings are
# those of tools/spritegen/skeleton.py (Pose): bob, lean, head, hand_l, hand_r, foot_l,
# foot_r, big_hand_r. `phases` shares the keys between startup, active and recovery;
# `tween` draws in-between frames after each key, for a smoother, longer move.

# Knives: the arms cross before the chest, a fan of knives between the fingers, then
# fling wide apart.
[anims.special_knives]
fps = 12
phases = [2, 1, 2]
tween = 1

[[anims.special_knives.right]]
lean = -1
hand_r = [-2, -10]
hand_l = [3, -11]

[[anims.special_knives.right]]
lean = -2
bob = 1
head = [-1, 0]
hand_r = [-5, -13]
hand_l = [-3, -12]
foot_l = [-2, 0]

[[anims.special_knives.right]]
lean = 2.5
hand_r = [13, -11]
hand_l = [9, -5]
foot_r = [4, 0]
foot_l = [-3, 0]

[[anims.special_knives.right]]
lean = 2
hand_r = [12, -9]
hand_l = [8, -4]
foot_r = [4, 0]
foot_l = [-3, 0]

[[anims.special_knives.right]]
lean = 1
hand_r = [4, -4]
hand_l = [2, -3]
foot_r = [2, 0]

[[anims.special_knives.down]]
hand_r = [-9, -10]
hand_l = [9, -10]

[[anims.special_knives.down]]
bob = 1
hand_r = [-10, -13]
hand_l = [10, -13]

[[anims.special_knives.down]]
bob = -1
hand_r = [8, -6]
hand_l = [-8, -6]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.down]]
hand_r = [7, -4]
hand_l = [-7, -4]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.down]]
hand_r = [1, -3]
hand_l = [-1, -3]

[[anims.special_knives.up]]
hand_r = [-9, -12]
hand_l = [9, -12]

[[anims.special_knives.up]]
bob = 1
hand_r = [-10, -15]
hand_l = [10, -15]

[[anims.special_knives.up]]
bob = -1
hand_r = [8, -11]
hand_l = [-8, -11]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.up]]
hand_r = [7, -9]
hand_l = [-7, -9]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.special_knives.up]]
hand_r = [1, -4]
hand_l = [-1, -4]
