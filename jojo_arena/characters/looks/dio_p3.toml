[[poses.za_warudo.right]]
lean = -0.5
hand_r = [5, -17]
elbow_r = [3, 1]
hand_l = [1, -5]
elbow_l = [-3, 0]

# The World as Eyes of Heaven renders it, crouched and coiled behind him; DIO as on
