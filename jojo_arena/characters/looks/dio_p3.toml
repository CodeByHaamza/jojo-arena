# DIO (Part 3): look file for tools/make_sprites.py.
# Blond hair, pale skin, short yellow jacket with a high collar over a black top,
# bare arms with black wristbands, yellow trousers with green heart knee pads,
# gold headband.

name = "DIO (P3)"

# Tall, lean and strong.
[build]
head_r = 5.8
neck = 1.0
torso = 14
legs = 17.5
arms = 15
shoulders = 8.8
hips = 3.4
torso_r = 6.0
arm_r = 2.3
leg_r = 2.5
hand_r = 2.3
foot_r = 2.5

[palette]
skin = "#f3d4bc"
hair = "#f7e07a"         # pale blond, lighter than the clothes
jacket = "#d9952b"       # deeper gold, so hair and jacket stay apart
top = "#24222c"
trousers = "#d6a032"
heart = "#4cbf72"
gold = "#f0c84a"
shoes = "#2a2430"
eyes = "#b8402e"

[body]
head = "skin"
torso = "top"
arms = "skin"
hands = "skin"
legs = "trousers"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true

# Thick blond hair down to the jaw, with a fringe.
[[parts]]
type = "hair"
material = "hair"
style = "long"
length = 5
volume = 8.4
bangs = "fringe"

[[parts]]
type = "headband"
material = "gold"
gem = "heart"

# Short open jacket: it stops just below the waist.
[[parts]]
type = "coat"
material = "jacket"
length = 0.12
open = true
opening = 5
collar = true

[[parts]]
type = "gloves"
material = "top"
length = 0.18

[[parts]]
type = "emblem"
material = "heart"
shape = "heart"
on = "knees"
