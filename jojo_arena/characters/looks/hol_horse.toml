# Hol Horse (Part 3): look file for tools/make_sprites.py.
#
# JoJo Wiki, "Hol Horse", Appearance (read 17/11/2026, https://jojowiki.com/Hol_Horse):
# tall (188 cm in the anime) and athletic, light shoulder-length blond hair, long
# sideburns, dimples, a cleft chin. A wide-brimmed cowboy hat with two long, thin, loose
# straps hanging down. Mostly light clothes over a dark undershirt; wristbands; a long
# sleeveless top split at the sides, hanging below the waist in a rectangle in front and
# behind; chaps over his trousers, riding boots with spurs; a cigarette.
# Emperor (https://jojowiki.com/Emperor) is a gun summoned straight into his hand: a long
# barrel under a metal frame, a big ball set in the frame over the fist, wooden grip
# panels. It is drawn in his hand here, since he fights with it out.
# Colours: the anime's ("Color Schemes"): fair skin, blond hair, blue eyes; a tan hat
# with a brown band; a beige top and chaps; an olive undershirt; brown wristbands; dark
# brown boots; Emperor silver.
# Left out: the cigarette and the spurs (a pixel each, they would not read), the watch.

name = "Hol Horse"

# Tall and easy, the weight on one leg.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "point"

[build]
head_r = 5.6
neck = 1.3
torso = 14
legs = 18.5
arms = 15
shoulders = 8.6
hips = 3.2
torso_r = 5.8
arm_r = 2.3
leg_r = 2.4
hand_r = 2.2
foot_r = 2.4

[palette]
skin = "#f0c8a6"
hair = "#f0d47a"         # blond
hat = "#b8945e"          # tan
hatband = "#6a4428"      # its brown band
top = "#dccb98"          # beige
chaps = "#cdb986"        # beige too, a shade darker
under = "#5c6034"        # the olive undershirt
band = "#7a5030"         # brown wristbands
boots = "#3e2a1c"
gun = "#c2cad6"          # Emperor: silver
grip = "#7a4a2a"         # its wooden grip
eyes = "#4a80c8"

[body]
head = "skin"
torso = "top"
arms = "skin"
hands = "skin"
legs = "chaps"
feet = "boots"

[face]
eyes = "eyes"
eye_style = "tall"
brows = true
nose = true

# Light blond hair to the shoulders.
[[parts]]
type = "hair"
material = "hair"
style = "long"
length = 9
volume = 7.6

[[parts]]
type = "top_hat"
material = "hat"
cowboy = true
band = "hatband"
straps = "hatband"

# The dark undershirt shows on the upper arms, the top having no sleeves.
[[parts]]
type = "sleeves"
material = "under"
length = 0.42

# The top's front and back panels, below the waist.
[[parts]]
type = "loincloth"
material = "top"
length = 0.5

[[parts]]
type = "bracelets"
material = "band"
width = 2.2

[[parts]]
type = "belt"
material = "hatband"

[[parts]]
type = "boots"
material = "boots"
length = 0.4

[[parts]]
type = "pistol"
material = "gun"
orb = "gun"
grip = "grip"
length = 7

# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# panel named in `source`: the panels All-Star Battle R took his Stylish Evade poses from
# (JoJo Wiki, All-Star Battle R ★ Hol Horse, "Stylish Evade"), looked at on 17/11/2026.
# Emperor is a gun in his hand: it is in every pose, there is no Stand beside him.

# Emperor's first appearance: the gun thrust out at arm's length, straight at you.
[poses.emperor]
label = "Emperor !"
label_en = "Emperor!"
source = "Ch. 141, L'Empereur et le Pendu (2) : Emperor apparaît dans sa main (« Holhorse_emperror_first ») ; ASBR, esquive stylée 3"

[[poses.emperor.down]]
lean = 0.5
hand_r = [-1, -12]
elbow_r = [4, -4]
hand_l = [-3, 1]

[[poses.emperor.right]]
lean = 1
hand_r = [14, -12]
elbow_r = [7, -10]
hand_l = [-2, 1]

# Emperor spun round his raised hand, the other hand at his side.
[poses.emperor_tourne]
label = "Emperor qui tourne"
label_en = "Emperor spinning"
source = "Ch. 142, L'Empereur et le Pendu (3) : il fait tourner Emperor (« Hol_Horse_Spins_Emperor ») ; ASBR, esquive stylée 5"

[[poses.emperor_tourne.down]]
hand_r = [-2, -17]
elbow_r = [6, -5]
hand_l = [-3, 1]

[[poses.emperor_tourne.right]]
lean = -0.5
hand_r = [6, -17]
elbow_r = [4, -5]
hand_l = [-2, 1]

# "Come on, Pol-Pol!": a knee up, beckoning, mocking.
[poses.pol_pol]
label = "« Viens, Pol-Pol ! »"
label_en = "\"Come on, Pol-Pol!\""
source = "Ch. 143, L'Empereur et le Pendu (4) : « Pol-Pol-kun » (« Pol-Pol_kun ») ; ASBR, esquive stylée 1"

[[poses.pol_pol.down]]
lean = -1
hand_r = [-3, -10]
elbow_r = [5, -1]
hand_l = [3, -10]
elbow_l = [-5, -1]
foot_l = [-1, -6]
knee_l = [-3, -7]

[[poses.pol_pol.right]]
lean = -1.5
hand_r = [8, -10]
elbow_r = [4, -2]
hand_l = [5, -9]
foot_r = [3, -6]
knee_r = [5, -8]

# Setting off beside J. Geil ("Let's go"): one long stride, an arm swung back.
[poses.on_y_va]
label = "« On y va. »"
label_en = "\"Let's go.\""
source = "Ch. 141, L'Empereur et le Pendu (2) : il part avec J. Geil (« Hol_Horse_and_J_Geil_Manga ») ; ASBR, esquive stylée 4"

[[poses.on_y_va.down]]
lean = 1
hand_r = [-4, -4]
elbow_r = [4, 0]
hand_l = [4, 2]
foot_l = [-3, -2]
foot_r = [3, 0]

[[poses.on_y_va.right]]
lean = 1.5
hand_r = [7, -3]
hand_l = [-6, 0]
foot_r = [6, 0]
foot_l = [-6, 0]

# On the cover of chapter 146: tall on the hilltop, the arms loose at his sides.
[poses.couverture_146]
label = "La couverture du ch. 146"
label_en = "The cover of ch. 146"
source = "Ch. 146, L'Impératrice (1), couverture A (« Chapter_146_Cover_A ») ; ASBR, esquive stylée 2"

[[poses.couverture_146.down]]
head = [0, -1]
hand_r = [-4, 2]
elbow_r = [3, 0]
hand_l = [4, 2]
elbow_l = [-3, 0]

[[poses.couverture_146.right]]
head = [0, -1]
hand_r = [2, 2]
hand_l = [-3, 2]

# The outfit and its colours ---------------------------------------------------------------
# JoJo Wiki, All-Star Battle R ★ Hol Horse, "Costumes & Tints" (read 17/11/2026): one
# costume, "Hol Horse's main Stardust Crusaders attire" (Eyes of Heaven has no other one
# either), and four tints: the anime's colours (A), JOJO A-GO!GO!'s inside illustration
# (B), Weekly Shonen Jump 1990 issue 9 (C), the Adventure Battle card J-179 (D). The tones
# were read off the game's render of each tint and brought to this sprite's brightness.

[costume]
label = "Tenue de Stardust Crusaders"
label_en = "Stardust Crusaders attire"
source = "Sa tenue principale de Stardust Crusaders (ASBR, costume normal)"

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "ASBR, couleur A : les couleurs de l'anime"

# Lime green, the undershirt and the wristbands blue.
[colors.agogo]
label = "JOJO A-GO!GO!"
label_en = "JOJO A-GO!GO!"
source = "ASBR, couleur B : l'illustration intérieure de JOJO A-GO!GO!"

[colors.agogo.palette]
top = "#8cb036"
chaps = "#84a830"
hat = "#6e8a2c"
under = "#2c4ca6"
band = "#2c4ca8"

# Red from hat to boots, the undershirt black.
[colors.jump9]
label = "Jump 1990 n° 9"
label_en = "Jump 1990 #9"
source = "ASBR, couleur C : le Weekly Shonen Jump 1990 n° 9"

[colors.jump9.palette]
top = "#c84c58"
chaps = "#be4652"
hat = "#a84450"
under = "#26262c"
band = "#2a2a30"

# Ochre, the undershirt dark green.
[colors.j179]
label = "Carte J-179"
label_en = "Card J-179"
source = "ASBR, couleur D : la carte Adventure Battle J-179"

[colors.j179.palette]
top = "#c08418"
chaps = "#b47a16"
hat = "#9a6214"
under = "#2e5a3a"
band = "#2e5a3c"
