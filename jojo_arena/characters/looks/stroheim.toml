# Rudol von Stroheim (Part 2): drawn from the JoJo Wiki description. Tall and well
# built, a flattop haircut that is particularly wide, and after Santana a rebuilt body:
# the facial corset round his RIGHT eye under a monocle, both arms and the whole abdomen
# replaced, and the machine gun housed in his torso.

name = "Rudol von Stroheim"

[build]
head_r = 5.5
neck = 1.4
torso = 14
legs = 17
arms = 14.5
shoulders = 10.0
hips = 3.4
torso_r = 6.8
arm_r = 3.0
leg_r = 2.7
hand_r = 2.5
foot_r = 2.6

[palette]
skin = "#e8c4a0"
hair = "#e0cc84"
steel = "#c0c8d4"
steel_dark = "#6e7684"
coat = "#4a5a3a"
coat_dark = "#36422c"
trim = "#d8c060"
boots = "#24201c"
lens = "#ff5a5a"
eyes = "#4a9ab4"

[body]
head = "skin"
torso = "coat"
arms = "steel"
hands = "steel"
legs = "coat_dark"
feet = "boots"

[face]
eyes = "eyes"
eye_style = "dot"
brows = true
nose = true
ear = true

# The flattop, wide and flat on top.
[[parts]]
type = "hair"
material = "hair"
style = "tower"
volume = 5.6

# The facial corset and monocle over the right eye.
[[parts]]
type = "face_mark"
material = "steel"
shape = "monocle"
side = 1

[[parts]]
type = "coat"
material = "coat"
length = 0.4
open = false
collar = true
buttons = "trim"
lining = "trim"

[[parts]]
type = "pauldrons"
material = "steel"
size = 4.2
rim = "steel_dark"

# The machine gun housed in the torso, muzzle out of the chest.
[[parts]]
type = "emblem"
material = "steel_dark"
shape = "diamond"
on = "chest"

[[parts]]
type = "belt"
material = "boots"
buckle = "trim"

[[parts]]
type = "boots"
material = "boots"
tall = true
