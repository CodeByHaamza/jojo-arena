# Rudol von Stroheim (Part 2): drawn from the JoJo Wiki description. Tall and well
# built, a flattop haircut that is particularly wide, and after Santana a rebuilt body:
# the facial corset round his RIGHT eye under a monocle, both arms and the whole abdomen
# replaced, and the machine gun housed in his torso.

name = "Rudol von Stroheim"

[build]
head_r = 5.5
neck = 1.4
torso = 14
legs = 17
arms = 14.5
shoulders = 10.0
hips = 3.4
torso_r = 6.8
arm_r = 3.0
leg_r = 2.7
hand_r = 2.5
foot_r = 2.6

[palette]
skin = "#e8c4a0"
hair = "#e0cc84"
steel = "#c0c8d4"
steel_dark = "#6e7684"
coat = "#4a5a3a"
coat_dark = "#36422c"
trim = "#d8c060"
boots = "#24201c"
lens = "#ff5a5a"
eyes = "#4a9ab4"

[body]
head = "skin"
torso = "coat"
arms = "steel"
hands = "steel"
legs = "coat_dark"
feet = "boots"

[face]
eyes = "eyes"
eye_style = "dot"
brows = true
nose = true
ear = true

# The flattop, wide and flat on top.
[[parts]]
type = "hair"
material = "hair"
style = "tower"
volume = 5.6

# The facial corset and monocle over the right eye.
[[parts]]
type = "face_mark"
material = "steel"
shape = "monocle"
side = 1

[[parts]]
type = "coat"
material = "coat"
length = 0.4
open = false
collar = true
buttons = "trim"
lining = "trim"

[[parts]]
type = "pauldrons"
material = "steel"
size = 4.2
rim = "steel_dark"

# The machine gun housed in the torso, muzzle out of the chest.
[[parts]]
type = "emblem"
material = "steel_dark"
shape = "diamond"
on = "chest"

[[parts]]
type = "belt"
material = "boots"
buckle = "trim"

[[parts]]
type = "boots"
material = "boots"
tall = true


# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the Jump Comics
# covers, the Eyes of Heaven renders, the All-Star Battle R pages) on 15/11/2026. One key
# per view: it breathes on its own.

# Eyes of Heaven: an arm thrown up behind the head, the other forward, a knee raised.
[poses.fierte]
label = "La fierté du Reich"
label_en = "Pride of the Reich"
source = "Eyes of Heaven, rendu de Stroheim (galerie de JoJo Wiki)"

[[poses.fierte.down]]
hand_l = [-1, -21]
elbow_l = [-6, -3]
hand_r = [-3, -8]
elbow_r = [3, 1]
foot_r = [1, -4]
knee_r = [3, -4]

[[poses.fierte.right]]
hand_l = [-2, -21]
elbow_l = [-3, -3]
hand_r = [6, -8]
foot_r = [2, -4]
knee_r = [4, -5]

# The chest opened on the machine gun, the arms bent out at the sides.
[poses.mitrailleuse]
label = "La mitrailleuse du torse"
label_en = "The chest machine gun"
source = "« Stroheim and his machinegun » (ch. 85, « JoJo Poses », JoJo Wiki)"

[[poses.mitrailleuse.down]]
hand_l = [-4, -9]
elbow_l = [-6, 0]
hand_r = [4, -9]
elbow_r = [6, 0]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.mitrailleuse.right]]
lean = -1
hand_r = [3, -9]
elbow_r = [-3, 0]
hand_l = [-4, -9]

# Ultraviolet Radiation Mode: the arms spread wide, the palms out.
[poses.ultraviolets]
label = "Les ultraviolets"
label_en = "Ultraviolet"
source = "Eyes of Heaven, rendu « UV Radiation Mode » (ch. 108)"

[[poses.ultraviolets.down]]
bob = 1
hand_l = [-10, -11]
elbow_l = [-3, 0]
hand_r = [10, -11]
elbow_r = [3, 0]

[[poses.ultraviolets.right]]
bob = 1
hand_r = [10, -11]
hand_l = [-8, -11]
