# Rudol von Stroheim (Part 2): the German officer who came back as a machine. Look file
# for tools/make_sprites.py. Uniform grey-green, the left half of his face a steel plate
# with a lens where the eye was, and a cybernetic arm that is mostly gun.

name = "Rudol von Stroheim"

[build]
head_r = 5.5
neck = 1.4
torso = 14
legs = 17
arms = 14.5
shoulders = 9.6
hips = 3.4
