arm_r = 2.9
leg_r = 2.7
hand_r = 2.5
foot_r = 2.6

[palette]
skin = "#e8c4a0"
hair = "#d8c070"
steel = "#b4bcc8"
steel_dark = "#6e7684"
coat = "#4a5440"
coat_dark = "#38402f"
boots = "#2a2620"
lens = "#ff4a4a"
brass = "#c8a048"
