# Straizo (Part 2), turned vampire: look file for tools/make_sprites.py.
# Long black hair, red eyes, a long brown coat open on a dark shirt, dark trousers.

name = "Straizo"

# Tall and lean, young again after the Stone Mask.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "spread"

[build]
head_r = 5.7
neck = 1.3
torso = 14.5
legs = 18
arms = 15.5
shoulders = 8.6
hips = 3.2
torso_r = 5.9
arm_r = 2.3
leg_r = 2.4
hand_r = 2.2
foot_r = 2.3

[palette]
skin = "#e8d0c0"
hair = "#2a2430"
coat = "#e6e4ec"
shirt = "#3a3044"
trousers = "#2e2a36"
boots = "#4a3426"
gold = "#d8b048"
scarf = "#55525e"
eyes = "#e03030"

[body]
head = "skin"
torso = "shirt"
arms = "coat"
hands = "skin"
legs = "trousers"
feet = "boots"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true

[[parts]]
type = "hair"
material = "hair"
style = "long"
length = 8
volume = 8.2

# The scarf of Satiporoja beetle silk, dark grey in the anime.
[[parts]]
type = "scarf"
material = "scarf"

[[parts]]
type = "coat"
material = "coat"
length = 0.6
open = true
opening = 4
collar = true
buttons = "gold"

[[parts]]
type = "boots"
material = "boots"
length = 0.35

# Key-pose animations ------------------------------------------------------------------
# [anims.<name>] replaces the generated animation of that name, or adds a new one that a
# move picks in the kit (anim = "<name>").

# Space Ripper Stingy Eyes: he draws back, then thrusts his face forward, eyes first.
[anims.special_eyes]
fps = 12
phases = [2, 1, 1]
tween = 1

[[anims.special_eyes.right]]
lean = -1.5
head = [-1, 0]
hand_r = [2, -14]
hand_l = [3, -12]

[[anims.special_eyes.right]]
lean = -2
head = [-2, 0]
hand_r = [3, -16]
hand_l = [4, -14]

[[anims.special_eyes.right]]
lean = 2.5
head = [2, 1]
hand_r = [-4, -2]
hand_l = [-5, -2]
foot_r = [3, 0]

[[anims.special_eyes.right]]
lean = 1
head = [1, 0]
hand_r = [-2, -1]
hand_l = [-3, -1]

[[anims.special_eyes.down]]
head = [0, -1]
hand_r = [-4, -16]
hand_l = [4, -16]

[[anims.special_eyes.down]]
head = [0, -2]
bob = 1
hand_r = [-5, -17]
hand_l = [5, -17]

[[anims.special_eyes.down]]
head = [0, 1]
bob = -1
hand_r = [2, 0]
hand_l = [-2, 0]

[[anims.special_eyes.down]]
hand_r = [1, -1]
hand_l = [-1, -1]


# JoJo poses ---------------------------------------------------------------------------
# No source shows a pose of this fighter (no JoJo Wiki gallery, absent from All-Star
# Battle R and Eyes of Heaven, searched 15/11/2026). The owner asked for poses invented in
# the fighter's bizarre spirit, from his moments in the manga; each says so in `source`.
# One key per view: it breathes on its own.

[poses.space_ripper]
label = "Space Ripper Stingy Eyes"
label_en = "Space Ripper Stingy Eyes"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : Space Ripper Stingy Eyes, les jets des yeux"

[[poses.space_ripper.down]]
head = [1, 0]
hand_r = [-2, -19]
elbow_r = [5, 0]
hand_l = [1, -3]
elbow_l = [-3, 1]

[[poses.space_ripper.right]]
hand_r = [4, -19]
elbow_r = [2, 1]
hand_l = [-2, -3]

[poses.ancien_maitre]
