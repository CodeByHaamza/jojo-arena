# Jotaro Kujo (Part 3): look file for tools/make_sprites.py.
# Change a color or a setting, then run:  python tools/make_sprites.py jotaro_p3
#
# Colors: one hex color = its shades are computed (dark, light, highlight);
# or give the four tones yourself: ["#dark", "#base", "#light", "#highlight"].

name = "Jotaro Kujo (P3)"

# Body shape, in pixels: tall and broad-shouldered.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "point"

[build]
head_r = 6.2
neck = 1.0
torso = 14
legs = 17
arms = 15
shoulders = 9
hips = 3.5
torso_r = 6.3
arm_r = 2.4
leg_r = 2.7
hand_r = 2.4
foot_r = 2.6

[palette]
skin = "#e9b48c"
hair = "#1c1c24"
uniform = "#26262f"      # cap, long coat and trousers: black, a touch of blue-gray
shirt = "#6f8068"        # grey-green, fitted and sleeveless
lining = "#e2dbc3"       # inside of the coat, cream
belt = "#2f9c86"         # jade belt
belt2 = "#c8485a"        # red belt
shoes = "#26252e"
gold = "#f0c23c"
eyes = "#3a9aa0"

# Which color each body segment uses (arms = sleeves, legs = trousers).
[body]
head = "skin"
torso = "shirt"
arms = "uniform"
hands = "skin"
legs = "uniform"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
ear = true

[[parts]]
type = "hair"
material = "hair"
style = "short"
volume = 8.2

# Tall school cap that blends into the hair at the back: gold band and two badges.
[[parts]]
type = "cap"
material = "uniform"
height = 1.5
ragged_back = true
ragged_color = "hair"
band = "gold"
badge = "gold"
badges = 2
plate = true

# Long open school coat (gakuran): high collar with pins, gold buttons, light lining.
[[parts]]
type = "coat"
material = "uniform"
length = 0.92
open = true
opening = 5
flare = 4.5
trail = 4
collar = true
pins = "gold"
buttons = "gold"
lining = "lining"
cuffs = "gold"

# Two belts, jade and red, one of them slanted, with a pattern of cream triangles.
[[parts]]
type = "belt"
material = "belt"
count = 2
second = "belt2"
studs = "lining"
buckle = "gold"

# The gold chain hanging from the collar.
[[parts]]
type = "chain"
material = "gold"
length = 9

# Key-pose animations ------------------------------------------------------------------
# [anims.<name>] replaces the generated animation of that name, or adds a new one that a
# move picks in the kit (anim = "<name>"). One [[anims.<name>.<view>]] table per key pose,
# for the views down, up and right (a view left out copies another). Pose settings are
# those of tools/spritegen/skeleton.py (Pose): bob, lean, head, hand_l, hand_r, foot_l,
# foot_r, big_hand_r. `phases` shares the keys between startup, active and recovery;
# `tween` draws in-between frames after each key, for a smoother, longer move.

# YARE YARE DAZE: one hand pulls the cap's brim down, the other slides into the pocket.
[anims.counter_yare]
fps = 8
phases = [1, 2, 1]
tween = 1

[[anims.counter_yare.right]]
lean = -0.5
hand_l = [1, -12]
hand_r = [-1, -2]

[[anims.counter_yare.right]]
lean = -1
head = [0, 1]
hand_l = [1, -20]
hand_r = [-3, -3]
foot_l = [-2, 0]

[[anims.counter_yare.right]]
lean = -1
bob = 1
head = [0, 1]
hand_l = [1, -19]
hand_r = [-3, -3]
foot_l = [-2, 0]

[[anims.counter_yare.right]]
hand_l = [0, -6]
hand_r = [-1, -2]

[[anims.counter_yare.down]]
hand_l = [2, -12]
hand_r = [0, -2]

[[anims.counter_yare.down]]
head = [0, 1]
hand_l = [3, -20]
hand_r = [-2, -4]
foot_l = [-1, 0]

[[anims.counter_yare.down]]
bob = 1
head = [0, 1]
hand_l = [3, -19]
hand_r = [-2, -4]
foot_l = [-1, 0]

[[anims.counter_yare.down]]
hand_l = [1, -5]
hand_r = [0, -2]

[[anims.counter_yare.up]]
hand_r = [-2, -12]
hand_l = [0, -2]

[[anims.counter_yare.up]]
head = [0, -1]
hand_r = [-3, -20]
hand_l = [2, -4]

[[anims.counter_yare.up]]
bob = 1
head = [0, -1]
hand_r = [-3, -19]
hand_l = [2, -4]

[[anims.counter_yare.up]]
hand_r = [-1, -5]
hand_l = [0, -2]
