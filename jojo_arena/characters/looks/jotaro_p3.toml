# Jotaro Kujo (Part 3): look file for tools/make_sprites.py.
# Change a color or a setting, then run:  python tools/make_sprites.py jotaro_p3
#
# Colors: one hex color = its shades are computed (dark, light, highlight);
# or give the four tones yourself: ["#dark", "#base", "#light", "#highlight"].

name = "Jotaro Kujo (P3)"

# Body shape, in pixels: tall and broad-shouldered.
[build]
head_r = 6.2
neck = 1.0
torso = 14
legs = 17
arms = 15
shoulders = 9
hips = 3.5
torso_r = 6.3
arm_r = 2.4
leg_r = 2.7
hand_r = 2.4
foot_r = 2.6

[palette]
skin = "#e9b48c"
hair = "#1d1f33"
uniform = "#252c52"      # cap, long coat and trousers
shirt = "#3f7a3c"
lining = "#c9b48a"       # inside of the coat
belt = "#b06a32"
shoes = "#3a3646"
gold = "#f0c23c"
eyes = "#3a9aa0"

# Which color each body segment uses (arms = sleeves, legs = trousers).
[body]
head = "skin"
torso = "shirt"
arms = "uniform"
hands = "skin"
legs = "uniform"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true

[[parts]]
type = "hair"
material = "hair"
style = "short"
volume = 8.2

# Tall school cap that blends into the hair at the back: gold band and two badges.
[[parts]]
type = "cap"
material = "uniform"
height = 1.5
ragged_back = true
ragged_color = "hair"
band = "gold"
badge = "gold"
badges = 2

# Long open school coat (gakuran): high collar with pins, gold buttons, light lining.
[[parts]]
type = "coat"
material = "uniform"
length = 0.92
open = true
opening = 5
flare = 4.5
trail = 4
collar = true
pins = "gold"
buttons = "gold"
lining = "lining"
cuffs = "gold"

# Two studded belts, one of them slanted.
[[parts]]
type = "belt"
material = "belt"
count = 2
studs = "gold"
buckle = "gold"

# The gold chain hanging from the collar.
[[parts]]
type = "chain"
material = "gold"
length = 9
