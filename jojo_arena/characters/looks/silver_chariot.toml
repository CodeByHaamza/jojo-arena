# Silver Chariot (Polnareff's Stand, Part 3): look file for tools/make_sprites.py.
# A slender robotic knight in polished silver plate: helmet with a ridge, a jewel on
# the forehead and pointed guards over the cheeks and jaw; heavy shoulder plates and
# pointed elbow guards; a rapier with a basket hilt.

name = "Silver Chariot"

# Slim and quick.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "flex"

[build]
head_r = 5.3
neck = 1.2
torso = 13
legs = 17.5
arms = 14.5
shoulders = 8.2
hips = 3.0
torso_r = 5.4
arm_r = 2.0
leg_r = 2.2
hand_r = 2.1
foot_r = 2.3

[palette]
armor = "#cfd4e2"
trim = "#8a90a8"
visor = "#2c3040"
gem = "#58c8e8"
blade = "#eef3ff"
eyes = "#9fe6ff"

[body]
head = "armor"
torso = "armor"
arms = "armor"
hands = "trim"
legs = "armor"
feet = "trim"

[face]
eyes = "eyes"
eye_style = "wide"

# Helmet: a ridge along the top, a dark visor, the forehead jewel, cheek guards.
[[parts]]
type = "hair"
material = "armor"
style = "crest"
height = 2.5
volume = 7.6

[[parts]]
type = "mask"
material = "visor"
top = -1.5

[[parts]]
type = "headband"
material = "armor"
gem = "gem"

[[parts]]
type = "cheek_guards"
material = "armor"

[[parts]]
type = "pauldrons"
material = "armor"
rim = "trim"
size = 4.6

[[parts]]
type = "emblem"
material = "trim"
shape = "diamond"
on = "elbows"

[[parts]]
type = "emblem"
material = "trim"
shape = "circle"
on = "knees"

# Plate seams: straight lines.
[[parts]]
type = "body_lines"
material = "trim"
amp = 0

[[parts]]
type = "belt"
material = "trim"

[[parts]]
type = "sword"
material = "blade"
length = 16
basket = "trim"
