# Silver Chariot (Polnareff's Stand, Part 3): look file for tools/make_sprites.py.
# A slender robotic knight in polished silver plate with a cold blue sheen: a rounded
# helmet with a ridge, a green jewel on the forehead, yellow eyes behind a dark visor
# barred over the mouth, pointed cheek guards; huge round shoulder plates with spikes and
# a ring boss; pointed elbow guards; a rapier with a cup hilt.

name = "Silver Chariot"

# Slim and quick.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "flex"

[build]
head_r = 5.3
neck = 1.2
torso = 13
legs = 17.5
arms = 14.5
shoulders = 8.2
hips = 3.0
torso_r = 5.4
arm_r = 2.0
leg_r = 2.2
hand_r = 2.1
foot_r = 2.3

[palette]
armor = ["#5d6680", "#a7b0c8", "#d9dfec", "#ffffff"]
trim = ["#363b50", "#666d8c", "#959cb8", "#cdd2e2"]
visor = "#1f2230"
gem = "#2fbf7a"
blade = "#eef3ff"
eyes = "#f4d24a"

[body]
head = "armor"
torso = "armor"
arms = "armor"
hands = "trim"
legs = "armor"
feet = "trim"

[face]
eyes = "eyes"
eye_style = "wide"

# Helmet: a ridge along the top, a dark barred visor, the forehead jewel, cheek guards.
[[parts]]
type = "hair"
material = "armor"
style = "crest"
height = 1.6
volume = 7.4

[[parts]]
type = "mask"
material = "visor"
top = -1.5
grill = "trim"

[[parts]]
type = "headband"
material = "armor"
gem = "gem"

[[parts]]
type = "cheek_guards"
material = "armor"

[[parts]]
type = "pauldrons"
material = "armor"
rim = "trim"
ring = "trim"
size = 5.6
spikes = 3

[[parts]]
type = "emblem"
material = "trim"
shape = "diamond"
on = "elbows"

[[parts]]
type = "emblem"
material = "trim"
shape = "circle"
on = "knees"

# Plate seams: straight lines.
[[parts]]
type = "body_lines"
material = "trim"
amp = 0

[[parts]]
type = "belt"
material = "trim"

[[parts]]
type = "sword"
material = "blade"
length = 17
cup = "armor"

# Poses with Polnareff (the ids of polnareff.toml's duo poses; sources there) --

# A rapier in each hand, the blades crossed above the head.
[[poses.deux_rapieres.down]]
hand_l = [3, -24]
elbow_l = [-5, -4]
hand_r = [-3, -24]
elbow_r = [5, -4]

[[poses.deux_rapieres.right]]
hand_r = [3, -24]
elbow_r = [3, -4]
hand_l = [1, -23]

# En garde without its armour, the rapier straight out.
[[poses.sans_armure.down]]
lean = 1
hand_r = [-4, -10]
big_hand_r = true
hand_l = [-2, -3]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.sans_armure.right]]
lean = 1.5
hand_r = [13, -10]
hand_l = [-3, -6]
elbow_l = [-3, 1]
foot_r = [4, 0]
knee_r = [2, -1]
foot_l = [-4, 0]


# En garde (invented, polnareff.toml): the rapier straight at the opponent.

[[poses.en_garde.down]]
lean = 1
hand_r = [-4, -10]
big_hand_r = true
hand_l = [-2, -3]

[[poses.en_garde.right]]
lean = 1.5
hand_r = [13, -10]
hand_l = [-3, -6]
elbow_l = [-3, 1]
foot_r = [4, 0]
foot_l = [-4, 0]

# Its colours ------------------------------------------------------------------------------
# JoJo Wiki, All-Star Battle R ★ Jean Pierre Polnareff, "Costumes & Tints": Silver
# Chariot's tint A is its anime appearance, its tint B "the Silver Chariot OVA color
# scheme" (the concept art: gold on the joints and the trim).

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "ASBR, Silver Chariot, couleur A : son apparence dans l'anime"

[colors.ova]
label = "OVA"
label_en = "OVA"
source = "ASBR, Silver Chariot, couleur B : les couleurs de l'OVA"

[colors.ova.palette]
trim = ["#5c4418", "#a07a2c", "#d2aa48", "#f2dc94"]
