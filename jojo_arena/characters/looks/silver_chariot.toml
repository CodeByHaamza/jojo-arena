# Silver Chariot (Polnareff's Stand, Part 3): look file for tools/make_sprites.py.
# A slender robotic knight in polished silver plate with a cold blue sheen: a rounded
# helmet with a ridge, a green jewel on the forehead, yellow eyes behind a dark visor
# barred over the mouth, pointed cheek guards; huge round shoulder plates with spikes and
# a ring boss; pointed elbow guards; a rapier with a cup hilt.

name = "Silver Chariot"

# Slim and quick.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "flex"

[build]
head_r = 5.3
neck = 1.2
torso = 13
legs = 17.5
arms = 14.5
shoulders = 8.2
hips = 3.0
torso_r = 5.4
arm_r = 2.0
leg_r = 2.2
hand_r = 2.1
foot_r = 2.3

[palette]
armor = ["#5d6680", "#a7b0c8", "#d9dfec", "#ffffff"]
trim = ["#363b50", "#666d8c", "#959cb8", "#cdd2e2"]
visor = "#1f2230"
gem = "#2fbf7a"
blade = "#eef3ff"
eyes = "#f4d24a"

[body]
head = "armor"
torso = "armor"
arms = "armor"
hands = "trim"
legs = "armor"
feet = "trim"

[face]
eyes = "eyes"
eye_style = "wide"

# Helmet: a ridge along the top, a dark barred visor, the forehead jewel, cheek guards.
[[parts]]
type = "hair"
material = "armor"
style = "crest"
height = 1.6
volume = 7.4

[[parts]]
type = "mask"
material = "visor"
top = -1.5
grill = "trim"

[[parts]]
type = "headband"
material = "armor"
gem = "gem"

[[parts]]
type = "cheek_guards"
material = "armor"

[[parts]]
type = "pauldrons"
material = "armor"
rim = "trim"
ring = "trim"
size = 5.6
spikes = 3

[[parts]]
type = "emblem"
material = "trim"
shape = "diamond"
on = "elbows"

[[parts]]
type = "emblem"
material = "trim"
shape = "circle"
on = "knees"

# Plate seams: straight lines.
[[parts]]
type = "body_lines"
material = "trim"
amp = 0

[[parts]]
type = "belt"
material = "trim"

[[parts]]
type = "sword"
material = "blade"
length = 17
cup = "armor"
