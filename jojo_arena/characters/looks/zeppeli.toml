# Will A. Zeppeli (Part 1): look file for tools/make_sprites.py.
# Black top hat with a band of harlequin diamonds, curly brown hair, a handlebar
# mustache, white suit with dark blue lapels over a red waistcoat, green bow tie.

name = "Will A. Zeppeli"

# Slim and nimble, an average height.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
