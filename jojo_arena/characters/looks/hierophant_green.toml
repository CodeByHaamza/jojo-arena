# Hierophant Green (Kakyoin's Stand, Part 3): look file for tools/make_sprites.py.
# Green body veined like a melon, pale cream armor plates (helmet, shoulders,
# forearms, legs), glowing eyes, strands unravelling from the legs.

name = "Hierophant Green"

# Tall, thin and lanky.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "spread"

[build]
head_r = 5.2
neck = 1.4
torso = 13
legs = 17.5
arms = 15
shoulders = 7.6
hips = 3.0
torso_r = 5.0
arm_r = 1.8
leg_r = 2.1
hand_r = 2.0
foot_r = 2.2

[palette]
body = "#2ea24a"
plate = "#e2e6e8"
vein = "#8ff08c"
glow = "#f4d23a"

[body]
head = "body"
torso = "body"
arms = "body"
hands = "plate"
legs = "body"
feet = "plate"

[face]
eyes = "glow"
eye_style = "wide"

# Green face under the cream helmet.
[[parts]]
type = "mask"
material = "plate"
top = -2.5

[[parts]]
type = "veins"
material = "vein"
density = 7
legs = true

[[parts]]
type = "pauldrons"
material = "plate"
size = 3.6

[[parts]]
type = "gloves"
material = "plate"
length = 0.35

[[parts]]
type = "belt"
material = "plate"

[[parts]]
type = "loincloth"
material = "plate"
length = 0.22

[[parts]]
type = "boots"
material = "plate"
length = 0.45

[[parts]]
type = "tendrils"
material = "body"
count = 2
length = 7

# Poses with Kakyoin (the ids of kakyoin.toml's duo poses; sources there) ----

# Behind Kakyoin, upright, the arms hanging a little away from the body.
[[poses.hierophant_derriere.down]]
hand_l = [-2, -1]
elbow_l = [-1, 0]
hand_r = [2, -1]
elbow_r = [1, 0]

[[poses.hierophant_derriere.right]]
hand_r = [1, -1]
hand_l = [-1, -1]

# The two hands meeting before the chest, where the emeralds gather.
[[poses.emerald_splash.down]]
hand_l = [5, -11]
elbow_l = [-4, 0]
hand_r = [-5, -11]
elbow_r = [4, 0]

[[poses.emerald_splash.right]]
lean = 1
hand_r = [10, -11]
hand_l = [9, -10]
elbow_l = [-2, 1]


# Rero rero rero (invented, kakyoin.toml): the tentacles spread behind him.

[[poses.rero_rero.down]]
hand_l = [-7, -16]
elbow_l = [-3, -2]
hand_r = [7, -16]
elbow_r = [3, -2]

[[poses.rero_rero.right]]
hand_r = [5, -16]
hand_l = [-5, -16]

# Its colours ------------------------------------------------------------------------------
# JoJo Wiki, All-Star Battle R ★ Noriaki Kakyoin, "Costumes & Tints": Hierophant Green's
# tint A is its anime colours, its tint B "the second colour from Super Figure
# Revolution" (blue).

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "ASBR, Hierophant Green, couleur A : les couleurs de l'anime"

[colors.sfr]
label = "Super Figure Revolution"
label_en = "Super Figure Revolution"
source = "ASBR, Hierophant Green, couleur B : la deuxième couleur de la Super Figure Revolution"

[colors.sfr.palette]
body = "#3450c4"
vein = "#8cb4f4"
