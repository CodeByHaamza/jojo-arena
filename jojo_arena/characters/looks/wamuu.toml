# Wamuu (Part 2): the Pillar Man of the wind, drawn from the JoJo Wiki description.
# Tall and powerfully built, tan skin, short upright indigo hair, and the one big
# drill-like horn above his brow that reads the wind. The metal crown opens at the front
# to let it out, the anti-Ripple wires are wound inside it, and the thick square tattoo
# crosses his face through the left eye.

name = "Wamuu"

[build]
head_r = 5.8
neck = 1.6
torso = 14.8
legs = 18
arms = 16
shoulders = 10.6
hips = 4.0
torso_r = 7.4
arm_r = 3.1
leg_r = 3.0
hand_r = 2.6
foot_r = 2.6

[palette]
skin = "#d8a878"
skin_dark = "#a87c54"
hair = "#4a4a8a"
horn = "#efe4c4"
crown = "#d8b256"
tattoo = "#2a3a7a"
vest = "#3a5a9a"
cloth = "#2a3a66"
wrist = "#8a6a46"
eyes = "#4a8ad0"

[body]
head = "skin"
torso = "vest"
arms = "skin"
hands = "skin"
legs = "skin"
feet = "cloth"

[face]
eyes = "eyes"
eye_style = "tall"
brows = true
nose = true
ear = true

# Short, upright hair under the crown.
[[parts]]
type = "hair"
material = "hair"
style = "spiky"
volume = 5.2

# The tattoo: a thick band across the face, through the left eye.
[[parts]]
type = "face_mark"
material = "tattoo"
shape = "bar"

# The one horn, rising from the middle of the brow.
[[parts]]
type = "horns"
material = "horn"
single = true
size = 0.78
tip = "crown"

# The crown it comes out of.
[[parts]]
type = "headband"
material = "crown"
gem = "horn"

[[parts]]
type = "earring"
material = "crown"

[[parts]]
type = "pauldrons"
material = "crown"
size = 4.6
rim = "cloth"

[[parts]]
type = "gloves"
material = "wrist"
studs = "crown"

[[parts]]
type = "loincloth"
material = "cloth"
length = 0.6

[[parts]]
type = "belt"
material = "crown"
buckle = "horn"


# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the Jump Comics
# covers, the Eyes of Heaven renders, the All-Star Battle R pages) on 15/11/2026. One key
# per view: it breathes on its own.

# The cover of chapter 67: the arms crossed in an X, the hands at the shoulders, the legs
# wide and bent.
[poses.bras_en_x]
label = "Les bras en X"
label_en = "Arms in an X"
source = "Page de couverture B du ch. 67 (« JoJo Poses », JoJo Wiki)"

[[poses.bras_en_x.down]]
bob = 2
hand_l = [6, -15]
elbow_l = [-3, 1]
hand_r = [-6, -15]
elbow_r = [3, 1]
knee_l = [-3, -1]
knee_r = [3, -1]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.bras_en_x.right]]
bob = 2
hand_r = [5, -15]
elbow_r = [1, 2]
hand_l = [4, -14]
elbow_l = [-1, 2]
knee_r = [3, -1]
foot_r = [3, 0]
foot_l = [-3, 0]

# He bent backwards!
[poses.en_arriere]
label = "Il se plie en arrière"
label_en = "Bent backwards"
source = "ASBR : « He bent backwards! »"

[[poses.en_arriere.down]]
lean = -4
head = [0, -1]
hand_l = [-5, -2]
hand_r = [5, -2]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.en_arriere.right]]
lean = -4
head = [-2, -1]
hand_r = [-5, -4]
hand_l = [-6, -2]
knee_r = [2, -1]


# More poses, where the sources ran out: invented in the fighter's spirit at the owner's
# request (15/11/2026), from his moments in the manga; each says so in `source`.

[poses.divine_sandstorm]
label = "Divine Sandstorm"
label_en = "Divine Sandstorm"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : Divine Sandstorm, les avant-bras qui tournent en sens contraire"

[[poses.divine_sandstorm.down]]
hand_r = [-4, -13]
elbow_r = [3, 1]
hand_l = [4, -6]
elbow_l = [-3, 1]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.divine_sandstorm.right]]
lean = 1
hand_r = [11, -13]
hand_l = [9, -6]
foot_r = [3, 0]
foot_l = [-3, 0]
