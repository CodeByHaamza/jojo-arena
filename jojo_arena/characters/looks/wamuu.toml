# Wamuu (Part 2): the Pillar Man of the wind, drawn from the JoJo Wiki description.
# Tall and powerfully built, tan skin, short upright indigo hair, and the one big
# drill-like horn above his brow that reads the wind. The metal crown opens at the front
# to let it out, the anti-Ripple wires are wound inside it, and the thick square tattoo
# crosses his face through the left eye.

name = "Wamuu"

[build]
head_r = 5.8
neck = 1.6
torso = 14.8
legs = 18
arms = 16
shoulders = 10.6
hips = 4.0
torso_r = 7.4
arm_r = 3.1
leg_r = 3.0
hand_r = 2.6
foot_r = 2.6

[palette]
skin = "#d8a878"
skin_dark = "#a87c54"
hair = "#4a4a8a"
horn = "#efe4c4"
crown = "#d8b256"
tattoo = "#2a3a7a"
vest = "#3a5a9a"
cloth = "#2a3a66"
wrist = "#8a6a46"
eyes = "#4a8ad0"

[body]
head = "skin"
torso = "vest"
arms = "skin"
hands = "skin"
legs = "skin"
feet = "cloth"

[face]
eyes = "eyes"
eye_style = "tall"
brows = true
nose = true
ear = true

# Short, upright hair under the crown.
[[parts]]
type = "hair"
material = "hair"
style = "spiky"
volume = 5.2

# The tattoo: a thick band across the face, through the left eye.
[[parts]]
type = "face_mark"
material = "tattoo"
shape = "bar"

# The one horn, rising from the middle of the brow.
[[parts]]
type = "horns"
material = "horn"
single = true
size = 0.78
tip = "crown"

# The crown it comes out of.
[[parts]]
type = "headband"
material = "crown"
gem = "horn"

[[parts]]
type = "earring"
material = "crown"

[[parts]]
type = "pauldrons"
material = "crown"
size = 4.6
rim = "cloth"

[[parts]]
type = "gloves"
material = "wrist"
studs = "crown"

[[parts]]
type = "loincloth"
material = "cloth"
length = 0.6

[[parts]]
type = "belt"
material = "crown"
buckle = "horn"
