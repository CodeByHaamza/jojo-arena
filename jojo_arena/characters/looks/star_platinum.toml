# Star Platinum (Jotaro's Stand, Part 3): look file for tools/make_sprites.py.
# Purple skin, a wild black mane, gold headband, orange-red scarf, tan shoulder pads
# with a spiral, long black gloves with gold cuffs, gold belt, white loincloth, black
# boots under round white knee guards, wavy gold lines along the body.

name = "Star Platinum"

# Taller and far more muscular than Jotaro.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "flex"

[build]
head_r = 6.0
neck = 0.8
torso = 14.5
legs = 17
arms = 15.5
shoulders = 10
hips = 3.8
torso_r = 7.2
arm_r = 3.0
leg_r = 3.0
hand_r = 3.0
foot_r = 2.8

[palette]
skin = "#9b78d2"
hair = "#1f1a2a"
metal = "#c8cad8"
gold = "#eab83c"
scarf = "#e2532e"
glove = "#2a2e2c"
cloth = "#ece6f2"
pad = "#d2b07a"
eyes = "#8fe0f0"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "glove"
legs = "skin"
feet = "glove"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true

# A wild mane of curved tufts, flowing down behind the shoulders.
[[parts]]
