# Kars (Part 2): the Pillar Man of the light, drawn from the JoJo Wiki description.
# Taller and paler than the others, with abundant jet-black wavy hair usually held under
# a dark fitted headband - taking it off means something. High boots, arm guards, a
# loincloth, and the blades he brings out of his forearms.

name = "Kars"

[build]
head_r = 5.7
neck = 1.5
torso = 14.5
legs = 18
arms = 16
shoulders = 10.2
hips = 3.8
torso_r = 7.0
arm_r = 3.0
leg_r = 2.9
hand_r = 2.5
foot_r = 2.6

[palette]
skin = "#eadce8"
skin_dark = "#b8a4b8"
hair = "#1a1622"
band = "#2a2434"
guard = "#8a6ab0"
cloth = "#5a3a7a"
blade = "#dfe6f4"
eyes = "#f0e060"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "skin"
feet = "band"

[face]
eyes = "eyes"
eye_style = "tall"
brows = true
nose = true
ear = true

# Abundant black hair, long and wavy, down the back.
[[parts]]
type = "hair"
material = "hair"
style = "long"
volume = 7.8
back_length = 15
curl = true

# The dark fitted headband that holds it.
[[parts]]
type = "headband"
material = "band"

# Arm guards.
[[parts]]
type = "gloves"
material = "guard"
long = true
ringed = true

[[parts]]
type = "pauldrons"
material = "guard"
size = 4.4
rim = "band"

[[parts]]
type = "loincloth"
material = "cloth"
length = 0.62

[[parts]]
type = "belt"
material = "band"
buckle = "guard"

# High boots.
[[parts]]
type = "boots"
material = "band"
tall = true

# The Light Blades: they come out of his forearms, he does not hold them.
[[parts]]
type = "arm_blade"
material = "blade"
length = 17
width = 1.7
curve = 6.5
back = 8


# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the Jump Comics
# covers, the Eyes of Heaven renders, the All-Star Battle R pages) on 15/11/2026. One key
# per view: it breathes on its own.

# There can be only one sitting at the peak: the blade of light raised, the other hand low.
[poses.au_sommet]
label = "« Un seul au sommet ! »"
label_en = "\"Only one at the peak!\""
source = "« Kars: There can be only one sitting at the peak! » (« JoJo Poses », JoJo Wiki)"

[[poses.au_sommet.down]]
hand_r = [1, -24]
elbow_r = [4, -3]
hand_l = [2, -5]
elbow_l = [-4, 0]

[[poses.au_sommet.right]]
hand_r = [4, -24]
elbow_r = [3, -3]
hand_l = [1, -5]
elbow_l = [-3, 0]

# Eyes of Heaven: loose, a hand on the hip, the other relaxed before him.
[poses.nonchalant]
label = "Nonchalant"
label_en = "Nonchalant"
source = "Eyes of Heaven, rendu de Kars (galerie de JoJo Wiki)"

[[poses.nonchalant.down]]
sway = 1.5
hand_l = [2, -5]
elbow_l = [-4, 0]
hand_r = [-3, -4]
elbow_r = [2, 1]
foot_r = [2, 0]

[[poses.nonchalant.right]]
sway = 1
hand_r = [5, -4]
hand_l = [1, -5]
elbow_l = [-3, 0]

# Arm yourself! The guard of Eyes of Heaven: crouched, the forearms crossed before him.
[poses.en_garde]
label = "« Prends une arme ! »"
label_en = "\"Arm yourself!\""
source = "Eyes of Heaven, « Arm yourself! » : « stationary defensive posture »"

[[poses.en_garde.down]]
bob = 2
hand_l = [5, -12]
elbow_l = [-4, 1]
hand_r = [-5, -12]
elbow_r = [4, 1]
knee_l = [-3, -1]
knee_r = [3, -1]

[[poses.en_garde.right]]
bob = 2
lean = 1
hand_r = [6, -12]
hand_l = [5, -11]
knee_r = [3, -1]
foot_r = [3, 0]
foot_l = [-3, 0]
