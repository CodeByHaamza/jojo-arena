# Kars (Part 2): the Pillar Man of the light, drawn from the JoJo Wiki description.
# Taller and paler than the others, with abundant jet-black wavy hair usually held under
# a dark fitted headband - taking it off means something. High boots, arm guards, a
# loincloth, and the blades he brings out of his forearms.

