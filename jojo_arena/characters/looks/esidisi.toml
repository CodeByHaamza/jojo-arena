# Esidisi (Part 2): the Pillar Man of the flame, drawn from the JoJo Wiki description.
# About two metres, tan, light hair puffing out from under a tall headpiece, and the
# dark X across his face meeting at the bridge of the nose. A nose ring, big hoop
# earrings, and a bare torso with leather patches stitched to the shoulders and chest.

name = "Esidisi"

[build]
