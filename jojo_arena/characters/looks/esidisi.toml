# Esidisi (Part 2): the Pillar Man of the flame, drawn from the JoJo Wiki description.
# About two metres, tan, light hair puffing out from under a tall headpiece, and the
# dark X across his face meeting at the bridge of the nose. A nose ring, big hoop
# earrings, and a bare torso with leather patches stitched to the shoulders and chest.

name = "Esidisi"

[build]
head_r = 5.7
neck = 1.5
torso = 14.6
legs = 16.6
arms = 16.5
shoulders = 11.0
hips = 4.2
torso_r = 7.8
arm_r = 3.3
leg_r = 3.1
hand_r = 2.7
foot_r = 2.7

[palette]
skin = "#d8a878"
skin_dark = "#a87c54"
hair = "#e8dcb0"
headpiece = "#c8a048"
tattoo = "#e06a2c"
leather = "#7a4a30"
cloth = "#7a2a30"
eyes = "#6a90c0"
ring = "#e8d890"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "skin"
feet = "cloth"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
ear = true

# The light hair puffing out from under the headpiece.
[[parts]]
type = "hair"
material = "hair"
style = "short"
volume = 6.6

# The X across the face.
[[parts]]
type = "face_mark"
material = "tattoo"
shape = "x"

# The tall headpiece over it.
[[parts]]
type = "headband"
material = "headpiece"
gem = "ring"

[[parts]]
type = "earring"
material = "ring"

# Leather patches stitched to the shoulders and the chest.
[[parts]]
type = "pauldrons"
material = "leather"
size = 5.0
rim = "skin_dark"

[[parts]]
type = "emblem"
material = "leather"
shape = "diamond"
on = "chest"

[[parts]]
type = "loincloth"
material = "cloth"
length = 0.58

[[parts]]
type = "belt"
material = "leather"
buckle = "headpiece"


# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the Jump Comics
# covers, the Eyes of Heaven renders, the All-Star Battle R pages) on 15/11/2026. One key
# per view: it breathes on its own.

# Eyes of Heaven, after chapter 78: the clawed hands up by the face, a knee raised.
[poses.griffes]
label = "Les griffes levées"
label_en = "Claws raised"
source = "Eyes of Heaven, rendu d'Esidisi (ch. 78)"

[[poses.griffes.down]]
hand_l = [4, -17]
elbow_l = [-4, -1]
hand_r = [-1, -14]
elbow_r = [4, 1]
foot_l = [0, -4]
knee_l = [-2, -4]

[[poses.griffes.right]]
hand_r = [6, -17]
elbow_r = [2, 0]
hand_l = [5, -14]
foot_r = [2, -4]
knee_r = [4, -5]

# He weeps, quietly, the hands over the face.
[poses.larmes]
label = "Il pleure"
label_en = "He weeps"
source = "ASBR, contre : « begins to quietly weep »"

[[poses.larmes.down]]
lean = 0.5
head = [0, 1]
hand_l = [2, -19]
elbow_l = [-4, 0]
hand_r = [-2, -19]
elbow_r = [4, 0]

[[poses.larmes.right]]
lean = 1
head = [1, 1]
hand_r = [5, -18]
elbow_r = [1, 2]
hand_l = [4, -18]
