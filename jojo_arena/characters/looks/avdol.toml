# Muhammad Avdol (Part 3): look file for tools/make_sprites.py.
# Change a color or a setting, then run:  python tools/make_sprites.py avdol
#
# Sources (JoJo Wiki, "Muhammad Avdol", Appearance and Color Schemes, read through
# search results on 24/10/2026: https://jojowiki.com/Muhammad_Avdol):
# - dark-skinned, above-average height, a medium-to-heavy build, thick eyebrows, a
#   wide chin, two identical scars down his cheeks;
# - a headband or headscarf round the forehead; hair in what looks like Bantu knots,
#   with a long ponytail;
# - earrings that are a long chain of medallions, like a necklace: the biggest one
#   carries an ankh, and a big tassel hangs from it onto his chest;
# - thick metal bracelets on both wrists;
# - a long overcoat or robe over a jellabiya, and a scarf round his neck;
# - colors: dark brown hair, auburn eyes. The clothes are the anime's (fixed on
#   24/10/2026 after the owner pointed at https://jjba.fandom.com/fr/wiki/Mohammed_Abdul):
#   a long red-orange coat, red like the flames of Magician's Red (CBR, "10 Things You
#   Didn't Know About Muhammad Avdol": his jellabiya is red, matching his Stand), a
#   khaki layer under it and a white headband (Avdol costume guides: carboncostume.com,
#   DeviantArt Outfits-Hub). The yellow of the wiki's first color scheme was the wrong
#   one to pick.

name = "Muhammad Avdol"

# Tall and broad: the biggest of the Crusaders after Jotaro, built heavier.
# Signature pose (Pose key): the finger pointed straight at the opponent.
pose = "point"

[build]
head_r = 5.8
neck = 1.4
torso = 14
legs = 17
arms = 15
shoulders = 9.2
hips = 3.6
torso_r = 6.8
arm_r = 2.5
leg_r = 2.6
hand_r = 2.3
foot_r = 2.4

[palette]
skin = "#7a4e34"
hair = "#3a2620"         # dark brown
band = "#f2ece2"         # white headband
robe = "#c4462a"         # the long red-orange coat
gown = "#c8b48a"         # the khaki layer under it
scarf = "#7e2420"         # darker than the coat, so the two read apart
gold = "#e8c450"
tassel = "#b8342c"
scar = "#5a3624"
shoes = "#4a3426"
eyes = "#9a4a2c"         # auburn

[body]
head = "skin"
torso = "gown"
arms = "robe"
hands = "skin"
legs = "gown"
feet = "shoes"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
ear = true
cheek_scars = "scar"

# The knots over the crown, and the long ponytail down his back.
[[parts]]
type = "hair"
material = "hair"
style = "knots"
volume = 6.6
knot_size = 2.2
ponytail = 15

# The headscarf round his forehead.
[[parts]]
type = "headband"
material = "band"

# The long overcoat, open on the jellabiya, down to the ankles.
[[parts]]
type = "coat"
material = "robe"
length = 0.92
open = true
opening = 3
collar = false
flare = 1.5
trail = 2

[[parts]]
type = "scarf"
material = "scarf"
tail = 2

# The medallion earrings down to the chest, the ankh on the biggest one, the tassel.
[[parts]]
type = "medallions"
material = "gold"
ankh = "tassel"
tassel = "tassel"

[[parts]]
type = "bracelets"
material = "gold"
width = 1.8
count = 2

# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# reference image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the
# character galleries, the Jump Comics covers, the All-Star Battle R and Eyes of Heaven
# pages) on 15/11/2026. A pose with `stand = true` is struck with the Stand out: the Stand
# strikes the pose of the same name in its own look file, `stand_offset` [ahead, aside]
# away. One key per view: it breathes on its own.

# Tch, tch, tch... YES I AM! The index finger raised beside the head, wagging.
[poses.tsk_tsk]
label = "« Tch, tch... YES I AM! »"
label_en = "\"Tsk, tsk... YES I AM!\""
source = "Ch. 177 (« Tsk tsk ») ; ASBR, provocation A ; Last Survivor, pose « YES I AM! »"

[[poses.tsk_tsk.down]]
hand_r = [1, -17]
elbow_r = [5, 0]
hand_l = [-1, 0]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.tsk_tsk.right]]
hand_r = [3, -17]
elbow_r = [3, 1]
hand_l = [-1, 0]
foot_l = [-3, 0]
foot_r = [3, 0]

# A flame on the tip of his raised finger, before the shoulder.
[poses.flamme_doigt]
label = "La flamme au bout du doigt"
label_en = "A flame on his finger"
source = "Ch. 178 (« Avdol with a flame on his finger »)"

[[poses.flamme_doigt.down]]
hand_l = [2, -14]
elbow_l = [-4, 1]
hand_r = [-1, -3]
elbow_r = [2, 0]

[[poses.flamme_doigt.right]]
hand_r = [6, -14]
elbow_r = [1, 2]
hand_l = [-1, -3]

# Give me four wishes instead: he wags his finger before his face, then turns away.
[poses.quatre_voeux]
label = "« Donne-moi plutôt quatre vœux ! »"
label_en = "\"Give me four wishes instead!\""
source = "ASBR, fin de la HHA : il agite le doigt, puis tourne le dos"

[[poses.quatre_voeux.down]]
lean = -0.5
head = [-1, 0]
hand_r = [-3, -15]
elbow_r = [3, 1]
hand_l = [1, -4]
elbow_l = [-3, 0]

[[poses.quatre_voeux.right]]
lean = -0.5
hand_r = [5, -15]
elbow_r = [1, 2]
hand_l = [-2, -4]
elbow_l = [-2, 0]

# Red Bind! Both arms thrown up, crossed at the wrists; Magician's Red spreads its own.
[poses.red_bind]
label = "« Red Bind ! »"
label_en = "\"Red Bind!\""
source = "Ch. 116 et ch. 177 (« Avdol yelling Red Bind ») ; ASBR, pose de victoire B"
stand = true
stand_offset = [-8, 8]

[[poses.red_bind.down]]
head = [0, -1]
hand_l = [3, -24]
elbow_l = [-5, -4]
hand_r = [-3, -24]
elbow_r = [5, -4]

[[poses.red_bind.right]]
head = [0, -1]
hand_r = [3, -24]
elbow_r = [3, -4]
hand_l = [1, -23]

# Magician's Red with its arms crossed, as Eyes of Heaven renders it; Avdol wags his finger.
[poses.bras_croises]
label = "Magician's Red, bras croisés"
label_en = "Magician's Red, arms crossed"
source = "Eyes of Heaven, rendu d'Avdol et Magician's Red (ch. 125)"
stand = true
stand_offset = [-8, -8]

[[poses.bras_croises.down]]
hand_r = [1, -17]
elbow_r = [5, 0]
hand_l = [-1, 0]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.bras_croises.right]]
hand_r = [3, -17]
elbow_r = [3, 1]
hand_l = [-1, 0]


# More poses, where the sources ran out: invented in the fighter's spirit at the owner's
# request (15/11/2026), from his moments in the manga; each says so in `source`.

[poses.crossfire]
label = "« Crossfire Hurricane ! »"
label_en = "\"Crossfire Hurricane!\""
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : Crossfire Hurricane, l'ankh de feu que Magician's Red lance"
stand = true
stand_offset = [-7, -8]

[[poses.crossfire.down]]
hand_r = [-4, -11]
elbow_r = [2, 1]
big_hand_r = true
hand_l = [2, -5]
elbow_l = [-4, 0]

[[poses.crossfire.right]]
lean = 0.5
hand_r = [11, -11]
hand_l = [1, -5]
elbow_l = [-3, 0]

# The outfit and its colours ---------------------------------------------------------------
# JoJo Wiki, All-Star Battle R ★ Muhammad Avdol, "Costumes & Tints" (read 16/11/2026): the
# normal costume is "Avdol's main Stardust Crusaders attire"; its tints are the anime's
# colours (A), Cover A of Chapter 136 in Weekly Shonen Jump Issue #38 (B), one whose
# origin the page does not give (C: "This section requires expansion") and the Adventure
# Battle Card J-039 (D). The tones were read off the game's render of each tint.
# Magician's Red has two tints: the second is a card too (J-083), it goes with J-039.

[costume]
label = "Tenue de Stardust Crusaders"
label_en = "Stardust Crusaders attire"
source = "Sa tenue principale de Stardust Crusaders (ASBR, costume normal)"

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "ASBR, couleur A : les couleurs de l'anime"

# A white coat over green, the hair green too.
[colors.chapitre136]
label = "Chapitre 136"
label_en = "Chapter 136"
source = "ASBR, couleur B : la couverture A du chapitre 136 (Weekly Shonen Jump n° 38)"

[colors.chapitre136.palette]
robe = "#e6e4de"
gown = "#6f9c5c"
scarf = "#aeaaa2"
hair = "#2f6c42"

# A teal coat over lavender, the hair dark blue.
[colors.asbr]
label = "All-Star Battle R"
label_en = "All-Star Battle R"
source = "ASBR, couleur C (JoJo Wiki n'en note pas l'origine)"

[colors.asbr.palette]
robe = "#3fb0ba"
gown = "#8a8eda"
scarf = "#2a7a88"
hair = "#22427c"

# A yellow coat over orange, the hair teal.
[colors.j039]
label = "Carte J-039"
label_en = "Card J-039"
source = "ASBR, couleur D : la carte Adventure Battle J-039"
stand = "j083"

[colors.j039.palette]
robe = "#e8ba22"
gown = "#e09c20"
scarf = "#b07c1a"
hair = "#2a8c82"
