# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the Jump Comics
# covers, the Eyes of Heaven renders, the All-Star Battle R pages) on 15/11/2026. One key
# per view: it breathes on its own.

# He does Jonathan's pose: the open hand spread before the face.
[poses.pose_jonathan]
label = "La pose de Jonathan"
label_en = "Jonathan's pose"
source = "« Caesar doing Jonathan's pose » (« JoJo Poses », JoJo Wiki)"

[[poses.pose_jonathan.down]]
head = [1, 0]
hand_r = [-2, -18]
elbow_r = [5, -1]
hand_l = [3, -4]
elbow_l = [-3, 0]

[[poses.pose_jonathan.right]]
hand_r = [5, -18]
elbow_r = [2, 1]
hand_l = [2, -4]
elbow_l = [-3, 0]

# Eyes of Heaven: crouched among his bubbles, one hand thrown forward, a knee up.
[poses.bulles]
label = "Parmi ses bulles"
label_en = "Among his bubbles"
source = "Eyes of Heaven, rendu de Caesar (galerie de JoJo Wiki)"

[[poses.bulles.down]]
bob = 2
hand_r = [-4, -11]
elbow_r = [2, 1]
hand_l = [-2, -14]
elbow_l = [-3, -1]
foot_r = [0, -3]
knee_r = [2, -4]

[[poses.bulles.right]]
bob = 2
lean = 1
hand_r = [10, -11]
hand_l = [5, -14]
foot_r = [2, -3]
knee_r = [4, -4]

# The cover of volume 7: the arm straight out, fingers spread.
[poses.tome_7]
label = "Le bras tendu du tome 7"
label_en = "The volume 7 reach"
source = "Couverture du tome 7"

[[poses.tome_7.down]]
hand_l = [-12, -11]
hand_r = [-2, -10]
elbow_r = [3, 1]

[[poses.tome_7.right]]
hand_r = [13, -12]
hand_l = [4, -9]
elbow_l = [-1, 2]
