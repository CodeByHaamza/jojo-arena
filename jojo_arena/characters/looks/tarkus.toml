# Tarkus (Part 1): look file for tools/make_sprites.py.
# A towering zombie knight in heavy dark armor, a horned helmet with crimson horns,
# red eyes, a chain hanging from the neck.

name = "Tarkus"

# A giant: the biggest body of the cast.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "spread"

