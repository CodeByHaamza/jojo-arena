# The World (DIO's Stand, Part 3): look file for tools/make_sprites.py.
# Gold with olive-green shadows, hugely muscled. A tall faceted helmet comes down to a
# point over the face; the face under it is dark slate. Two big air tanks stand up behind
# the shoulders, linked by a ribbed hose; ribbed treads over the shoulders; hearts on
# the knees, elbows, belt and under the chin.

name = "The World"

# Muscular, built like Star Platinum.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "spread"

[build]
head_r = 5.8
neck = 0.8
torso = 14.5
legs = 17
arms = 15.5
shoulders = 9.6
hips = 3.8
torso_r = 7.0
arm_r = 2.9
leg_r = 2.9
hand_r = 2.9
foot_r = 2.7

[palette]
# Gold shaded toward olive green, as in the anime.
gold = ["#5f6a22", "#b0a636", "#e6cd4b", "#fff3a6"]
deep = ["#4c5a1c", "#8f8a2a", "#cdb43c", "#f7e27c"]   # helmet, hearts, boots
rib = ["#55692a", "#93a845", "#c8d872", "#eff6bc"]    # ribbed hose and treads
slate = ["#1e2536", "#33405a", "#4c5d7c", "#7385a8"]  # the face and the joints
eyes = "#f0b030"

[body]
head = "slate"
torso = "gold"
arms = "gold"
hands = "gold"
legs = "gold"
feet = "deep"

[face]
eyes = "eyes"
eye_style = "wide"

[[parts]]
type = "helmet"
material = "deep"
style = "pyramid"
tube = "rib"

[[parts]]
type = "tanks"
material = "gold"
straps = "slate"
above = 9

[[parts]]
type = "pauldrons"
material = "rib"
size = 4.4
rim = "deep"

[[parts]]
type = "boots"
material = "deep"
length = 0.45
ribbed = true

[[parts]]
type = "belt"
material = "slate"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "knees"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "elbows"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "belt"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "chin"
