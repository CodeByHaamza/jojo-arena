# The World (DIO's Stand, Part 3): look file for tools/make_sprites.py.
# Golden, hugely muscled body; a V-shaped helmet leaning forward; a hose linking the
# ears behind the head; two air tanks on the back with straps; pale ribbed tubes on
# the shoulders, forearms and shins; hearts on the knees, elbows, belt and under the chin.

