# The World (DIO's Stand, Part 3): look file for tools/make_sprites.py.
# Gold with olive-green shadows, hugely muscled. A tall faceted helmet comes down to a
# point over the face; the face under it is dark slate. Two big air tanks stand up behind
# the shoulders, linked by a ribbed hose; ribbed treads over the shoulders; hearts on
# the knees, elbows, belt and under the chin.

name = "The World"

# Muscular, built like Star Platinum.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "spread"

[build]
head_r = 5.8
neck = 0.8
torso = 14.5
legs = 17
arms = 15.5
shoulders = 9.6
hips = 3.8
torso_r = 7.0
arm_r = 2.9
leg_r = 2.9
hand_r = 2.9
foot_r = 2.7

[palette]
# Gold shaded toward olive green, as in the anime.
gold = ["#5f6a22", "#b0a636", "#e6cd4b", "#fff3a6"]
deep = ["#4c5a1c", "#8f8a2a", "#cdb43c", "#f7e27c"]   # helmet, hearts, boots
rib = ["#55692a", "#93a845", "#c8d872", "#eff6bc"]    # ribbed hose and treads
slate = ["#1e2536", "#33405a", "#4c5d7c", "#7385a8"]  # the face and the joints
eyes = "#f0b030"

[body]
head = "slate"
torso = "gold"
arms = "gold"
hands = "gold"
legs = "gold"
feet = "deep"

[face]
eyes = "eyes"
eye_style = "wide"

[[parts]]
type = "helmet"
material = "deep"
style = "pyramid"
tube = "rib"

[[parts]]
type = "tanks"
material = "gold"
straps = "slate"
above = 9

[[parts]]
type = "pauldrons"
material = "rib"
size = 4.4
rim = "deep"

[[parts]]
type = "boots"
material = "deep"
length = 0.45
ribbed = true

[[parts]]
type = "belt"
material = "slate"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "knees"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "elbows"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "belt"

[[parts]]
type = "emblem"
material = "deep"
shape = "heart"
on = "chin"

# Poses with DIO (the ids of dio_p3.toml's duo poses; sources there) --------

# Out in front, the arms flung wide as time stops.
[[poses.za_warudo.down]]
lean = -1
head = [0, -1]
hand_l = [-9, -15]
elbow_l = [-3, -3]
hand_r = [9, -15]
elbow_r = [3, -3]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.za_warudo.right]]
lean = -1
hand_r = [8, -16]
hand_l = [-6, -15]

# Coiled: one arm up and bent, the other fist low and forward, the knees bent.
[[poses.the_world_eoh.down]]
bob = 2
lean = 1
hand_r = [-2, -19]
elbow_r = [5, -2]
hand_l = [3, 2]
big_hand_r = false
knee_l = [-3, -1]
knee_r = [3, -1]
foot_l = [-2, 0]
foot_r = [2, 0]

[[poses.the_world_eoh.right]]
bob = 2
lean = 2
hand_r = [4, -19]
elbow_r = [3, -2]
hand_l = [8, 1]
knee_r = [3, -2]
foot_r = [4, 0]
foot_l = [-4, 0]


# Road Roller da (invented, dio_p3.toml): the fists raised behind DIO.

[[poses.road_roller.down]]
hand_l = [-5, -20]
elbow_l = [-3, -3]
hand_r = [5, -20]
elbow_r = [3, -3]

[[poses.road_roller.right]]
hand_r = [4, -20]
hand_l = [-3, -20]

# Its colours ------------------------------------------------------------------------------
# JoJo Wiki, All-Star Battle R ★ DIO, "Costumes & Tints": The World's tint A is "The
# World's anime colours", its tint B the Super Action Statue (a pale, bone-white body).

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "ASBR, The World, couleur A : les couleurs de l'anime"

[colors.sas]
label = "Super Action Statue"
label_en = "Super Action Statue"
source = "ASBR, The World, couleur B : la Super Action Statue"

[colors.sas.palette]
gold = ["#6c6458", "#b8ac98", "#e0d6c2", "#f8f2e6"]
deep = ["#5a5248", "#9c9080", "#c8bca8", "#ece4d6"]
rib = ["#5e5c54", "#a09c8e", "#cfcabc", "#f0ece0"]
