# Santana (Part 2): the Pillar Man who never mastered a Mode, drawn from the JoJo Wiki
# description. Imposing and beautifully muscled, Araki drew him from Roman statues: a
# smooth glossy olive skin, wavy light hair down to the shoulders, two small horns,
# bushy brows, a mark under one eye, and nothing on him but a loincloth.

name = "Santana"

[build]
head_r = 5.5
neck = 1.3
torso = 14.4
legs = 17
arms = 15.4
shoulders = 10.2
hips = 3.8
torso_r = 7.2
arm_r = 3.0
leg_r = 2.9
hand_r = 2.5
foot_r = 2.5

[palette]
skin = "#c8a870"
skin_dark = "#96794c"
hair = "#e0c88a"
horn = "#e8e0c8"
mark = "#3a4a74"
cloth = "#b03a3a"
eyes = "#8a7a50"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "skin"
feet = "skin"

[face]
eyes = "eyes"
eye_style = "dot"
brows = true
nose = true
ear = true

# Wavy light hair down to the shoulders.
[[parts]]
type = "hair"
material = "hair"
style = "long"
volume = 6.4
back_length = 9
curl = true

# Two small horns.
[[parts]]
type = "horns"
