# Santana (Part 2): the Pillar Man who never mastered a Mode, drawn from the JoJo Wiki
# description. Imposing and beautifully muscled, Araki drew him from Roman statues: a
# smooth glossy olive skin, wavy light hair down to the shoulders, two small horns,
# bushy brows, a mark under one eye, and nothing on him but a loincloth.

name = "Santana"

[build]
head_r = 5.5
neck = 1.3
torso = 14.4
legs = 17
arms = 15.4
shoulders = 10.2
hips = 3.8
torso_r = 7.2
arm_r = 3.0
leg_r = 2.9
hand_r = 2.5
foot_r = 2.5

[palette]
skin = "#c8a870"
skin_dark = "#96794c"
hair = "#e0c88a"
horn = "#e8e0c8"
mark = "#3a4a74"
cloth = "#b03a3a"
eyes = "#8a7a50"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "skin"
feet = "skin"

[face]
eyes = "eyes"
eye_style = "dot"
brows = true
nose = true
ear = true

# Wavy light hair down to the shoulders.
[[parts]]
type = "hair"
material = "hair"
style = "long"
volume = 6.4
back_length = 9
curl = true

# Two small horns.
[[parts]]
type = "horns"
material = "horn"
size = 0.42

# The crenelated mark under his left eye.
[[parts]]
type = "face_mark"
material = "mark"
shape = "eyelid"
side = -1

[[parts]]
type = "loincloth"
material = "cloth"
length = 0.55


# JoJo poses ---------------------------------------------------------------------------
# No source shows a pose of this fighter (no JoJo Wiki gallery, absent from All-Star
# Battle R and Eyes of Heaven, searched 15/11/2026). The owner asked for poses invented in
# the fighter's bizarre spirit, from his moments in the manga; each says so in `source`.
# One key per view: it breathes on its own.

[poses.contorsion]
label = "Le corps qui se plie"
label_en = "The bending body"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : son corps qui se tord et s'ouvre où il veut"

[[poses.contorsion.down]]
lean = 4
sway = -3
head = [-2, 1]
hand_l = [-6, 2]
hand_r = [3, -18]
elbow_r = [6, -2]

[[poses.contorsion.right]]
lean = 3
sway = -2
head = [1, 2]
hand_r = [2, -18]
elbow_r = [4, -2]
hand_l = [-4, 3]

[poses.a_l_affut]
label = "À l'affût"
label_en = "On the prowl"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : le prédateur qui se glisse au ras du sol"

[[poses.a_l_affut.down]]
bob = 6
hand_l = [-2, 10]
hand_r = [2, 10]
knee_l = [-4, -2]
knee_r = [4, -2]
foot_l = [-3, 0]
foot_r = [3, 0]

[[poses.a_l_affut.right]]
bob = 6
lean = 3
hand_r = [8, 9]
hand_l = [6, 9]
knee_r = [4, -3]
foot_r = [4, 0]
foot_l = [-4, 0]

[poses.curieux]
label = "Curieux"
label_en = "Curious"
source = "Inventée dans l'esprit du perso, à la demande du propriétaire (15/11/2026) : le Pilier qui découvre le monde des hommes et l'imite"

[[poses.curieux.down]]
head = [2, 1]
hand_r = [-1, -18]
elbow_r = [4, 0]
hand_l = [0, 0]

[[poses.curieux.right]]
head = [1, 1]
hand_r = [4, -18]
elbow_r = [2, 1]
hand_l = [-1, 0]
