# Jonathan Joestar (Part 1): look file for tools/make_sprites.py.
# Very tall and muscular, indigo hair swept up, a torn blue top cropped over the abs,
# brown leather shoulder pads, red belt with a gold buckle, grey trousers, boots.

name = "Jonathan Joestar"

# The tallest of the cast: 195 cm of gentleman.
# Signature pose (Pose key): see tools/spritegen/skeleton.py.
pose = "raise"

[build]
head_r = 6.0
neck = 1.0
torso = 15
legs = 18
arms = 16
shoulders = 10
hips = 3.7
torso_r = 7.0
arm_r = 3.0
leg_r = 2.9
hand_r = 2.7
foot_r = 2.6

[palette]
skin = "#f0c49c"
hair = "#3c3c9e"          # indigo
top = "#3d63c8"
pad = "#8a5530"
belt = "#e0862e"
gold = "#f0c23c"
trousers = "#8c909e"
boots = "#3a2c28"
eyes = "#7ac0e8"

[body]
head = "skin"
torso = "skin"
arms = "skin"
hands = "skin"
legs = "trousers"
feet = "boots"

[face]
eyes = "eyes"
eye_style = "wide"
brows = true
nose = true
ear = true

# Thick, short hair standing up in tufts.
[[parts]]
type = "hair"
material = "hair"
style = "mane"
volume = 7.4
flare = 0.5
fill = 0.55

# The torn top, cropped high: the abs show.
[[parts]]
type = "top"
material = "top"
neckline = 2
length = 0.62

[[parts]]
type = "pauldrons"
material = "pad"
size = 3.8

[[parts]]
type = "belt"
material = "belt"
buckle = "gold"
below = "trousers"

[[parts]]
type = "boots"
material = "boots"
length = 0.3

# The outfit and its colours ---------------------------------------------------------------
# JoJo Wiki, All-Star Battle R ★ Jonathan Joestar, "Costumes & Tints" (read 16/11/2026):
# the normal costume is "Jonathan's main Phantom Blood attire", and its four tints are
# the anime's colours (A), the cover of volume 4 (B), the cover of volume 3 (C) and the
# Adventure Battle Card J-534 (D). The tones were read off the game's render of each tint
# and brought to this sprite's own brightness. The leather (shoulder pads, boots) follows
# the gloves and the boots of the render, the belt its belt.

[costume]
label = "Tenue de Phantom Blood"
label_en = "Phantom Blood attire"
source = "Sa tenue principale de Phantom Blood (ASBR, costume normal)"

[colors.anime]
label = "Anime"
label_en = "Anime"
source = "ASBR, couleur A : les couleurs de l'anime"

# All in greens: a dark green top, green trousers, lime leather.
[colors.tome4]
label = "Tome 4"
label_en = "Volume 4"
source = "ASBR, couleur B : la couverture du tome 4"

[colors.tome4.palette]
top = "#2f7030"
trousers = "#5a9c40"
pad = "#93b030"
boots = "#6f9020"
belt = "#869436"

# Crimson and pink, olive leather, the hair gone dark plum.
[colors.tome3]
label = "Tome 3"
label_en = "Volume 3"
source = "ASBR, couleur C : la couverture du tome 3"

[colors.tome3.palette]
top = "#b02c4c"
trousers = "#c8546e"
pad = "#a0963e"
boots = "#787230"
belt = "#b08c3c"
hair = "#5c2c48"

# Violet and indigo, orange leather.
[colors.j534]
label = "Carte J-534"
label_en = "Card J-534"
source = "ASBR, couleur D : la carte Adventure Battle J-534"

[colors.j534.palette]
top = "#5c4eba"
trousers = "#4a44a6"
pad = "#c8742e"
boots = "#8a4a22"
belt = "#a26c3c"

# Key-pose animations ------------------------------------------------------------------
# [anims.<name>] replaces the generated animation of that name, or adds a new one that a
# move picks in the kit (anim = "<name>"). One [[anims.<name>.<view>]] table per key pose,
# for the views down, up and right (a view left out copies another).

# Hamon breathing: chest out, fists low and back, a slow deep breath.
[anims.breathe]
fps = 3
loop = true
tween = 1

[[anims.breathe.down]]
head = [0, -1]
hand_l = [-2, 1]
hand_r = [2, 1]
foot_l = [-1, 0]
foot_r = [1, 0]

[[anims.breathe.down]]
bob = -1
head = [0, -2]
hand_l = [-3, 0]
hand_r = [3, 0]
foot_l = [-1, 0]
foot_r = [1, 0]

[[anims.breathe.right]]
lean = -1
head = [-1, -1]
hand_l = [-3, 0]
hand_r = [-3, 1]

[[anims.breathe.right]]
lean = -1.5
bob = -1
head = [-1, -2]
hand_l = [-4, -1]
hand_r = [-4, 0]

# Overdrive: the fist drawn back, then driven through with all the body.
[anims.heavy_overdrive]
fps = 12
phases = [2, 1, 2]
tween = 1

[[anims.heavy_overdrive.right]]
lean = -2
bob = 1
hand_r = [-7, -5]
hand_l = [3, -9]
foot_l = [-3, 0]

[[anims.heavy_overdrive.right]]
lean = -3
bob = 1
head = [-1, 0]
hand_r = [-9, -6]
hand_l = [5, -10]
foot_l = [-4, 0]

[[anims.heavy_overdrive.right]]
lean = 4
hand_r = [15, -8]
hand_l = [-4, -4]
foot_r = [6, 0]
foot_l = [-5, 0]

[[anims.heavy_overdrive.right]]
lean = 3.5
hand_r = [14, -7]
hand_l = [-4, -4]
foot_r = [6, 0]
foot_l = [-5, 0]

[[anims.heavy_overdrive.right]]
lean = 1
hand_r = [5, -4]
hand_l = [0, -3]
foot_r = [2, 0]

[[anims.heavy_overdrive.down]]
bob = 1
hand_r = [3, -7]
hand_l = [-2, -6]

[[anims.heavy_overdrive.down]]
bob = 1
lean = -1
hand_r = [4, -9]
hand_l = [-3, -7]

[[anims.heavy_overdrive.down]]
bob = -1
hand_r = [-6, -4]
hand_l = [2, -3]
big_hand_r = true
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.heavy_overdrive.down]]
hand_r = [-6, -3]
hand_l = [2, -3]
big_hand_r = true
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.heavy_overdrive.down]]
hand_r = [-2, -3]
hand_l = [1, -2]

[[anims.heavy_overdrive.up]]
bob = 1
hand_r = [3, -8]
hand_l = [-2, -6]

[[anims.heavy_overdrive.up]]
bob = 1
lean = -1
hand_r = [4, -10]
hand_l = [-3, -7]

[[anims.heavy_overdrive.up]]
bob = -1
hand_r = [-6, -16]
hand_l = [2, -4]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.heavy_overdrive.up]]
hand_r = [-6, -15]
hand_l = [2, -4]
foot_l = [-2, 0]
foot_r = [2, 0]

[[anims.heavy_overdrive.up]]
hand_r = [-2, -4]
hand_l = [1, -2]

# JoJo poses ---------------------------------------------------------------------------
# Picked on the select screen; the Pose key plays the one picked. Each was drawn from the
# image named in `source`, looked at on JoJo Wiki (pages "JoJo Poses", the Jump Comics
# covers, the Eyes of Heaven renders, the All-Star Battle R pages) on 15/11/2026. One key
# per view: it breathes on its own.

# The open hand spread before the face, the other low across the body.
[poses.main_visage]
label = "La main devant le visage"
label_en = "Hand before the face"
source = "Couverture du tome 4 (« JoJo Poses », JoJo Wiki) ; ASBR, provocation B"

[[poses.main_visage.down]]
head = [1, 0]
hand_r = [-2, -18]
elbow_r = [5, -1]
hand_l = [3, -4]
elbow_l = [-3, 0]

[[poses.main_visage.right]]
hand_r = [5, -18]
elbow_r = [2, 1]
hand_l = [2, -4]
elbow_l = [-3, 0]

# Eyes of Heaven: both fists up before the face, a knee lifted, the Ripple breathed in.
[poses.garde_eoh]
label = "La garde du Hamon"
label_en = "Ripple guard"
source = "Eyes of Heaven, rendu de Jonathan (galerie de JoJo Wiki)"

[[poses.garde_eoh.down]]
hand_l = [4, -17]
elbow_l = [-4, 0]
hand_r = [-3, -15]
elbow_r = [4, 0]
foot_l = [0, -3]
knee_l = [-1, -3]

[[poses.garde_eoh.right]]
lean = 1
hand_r = [7, -16]
elbow_r = [1, 2]
hand_l = [5, -14]
elbow_l = [-1, 2]
foot_r = [2, -3]
knee_r = [3, -4]

# The cover of volume 2: a fist raised beside the head, the other arm forward.
[poses.poing_leve]
label = "Le poing levé"
label_en = "Raised fist"
source = "Couverture du tome 2"

[[poses.poing_leve.down]]
lean = 1
hand_r = [2, -20]
elbow_r = [6, -2]
hand_l = [-3, -6]
elbow_l = [-2, 1]

[[poses.poing_leve.right]]
lean = 1
hand_r = [3, -20]
elbow_r = [4, -2]
hand_l = [6, -6]
