[colors.asb.palette]
cowl = ["#101014", "#1e1e26", "#30303c", "#54546a"]
horn = "#b8bcc8"
heart = "#4a3aa0"
eyes = "#f4d040"

# A white body tinted violet, a black cowl with purple highlights, light yellow eyes, dark
