# With a direction: Bubble Lenses. Sources (JoJo Wiki, All-Star Battle R and Eyes of
# Heaven pages): Bubble Cutters that stay where they are put, refract sunlight, and fire
# it as lasers at whoever comes close before popping; a Lens pops harmlessly if Caesar is
# staggered or takes damage; six of them at most. Beacons, in other words - which is what
# they are here: they hold a piece of the floor, and the light they send is real sunlight,
# so it burns a vampire or a Pillar Man double.
[stances.base.moves.heavy_alt]
shout = "BUBBLE LENS !"
label = "BUBBLE LENSES"
info = "Avec une direction : des bulles-loupes restent au sol et tirent des lasers de lumière sur qui approche (double sur les morts-vivants). Un coup encaissé les fait toutes éclater"
info_en = "With a direction: lens bubbles stay on the floor and fire light at whoever comes close (double on the undead). One blow taken and they all pop"
hamon_cost = 20
startup_f = 14
active_f = 2
recovery_f = 22
anim = "special"

