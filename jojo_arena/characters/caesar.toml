# Caesar Anthonio Zeppeli (Part 2). GDD: "Hamon · Zoner": keeps the opponent away with
# soap bubbles charged with Hamon. Bubble Launcher (homing bubbles), Bubble Cutter
# (spinning bubbles in an arc), Bubble Lens (a bubble that focuses light into a ray).
# Great Heat Attack: Bubble Barrier, a dome of bubbles that closes in and bursts.
# Frames (_f) are at 60 per second; speeds and knockback in px per second.
#
# Style key held: Hamon breathing. Feel: proud, elegant, deadly at mid range, fragile up
# close: a few quick kicks to win back his distance.

