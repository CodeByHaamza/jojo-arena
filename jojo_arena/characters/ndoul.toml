# N'Doul (Part 3) - Geb. One of the Egypt Nine Glory Gods, blind, loyal to DIO to the end.
#
# N'Doul is in Eyes of Heaven, not in All-Star Battle R: his moves are EoH's.
#
# Sources, read on 17/11/2026:
# - JoJo Wiki, "N'Doul" (https://jojowiki.com/N%27Doul): blind; he tracks people by
#   sound - footsteps, falling grains of sand, the vibrations his cane picks up through the
#   ground. Avdol lured Geb into the open; Jotaro beat him by throwing Iggy and The Fool at
#   him to break his focus. Named after Youssou N'Dour.
# - JoJo Wiki, "Geb" (https://jojowiki.com/Geb): a small, shapeless mass of water, usually a
#   tentacle ending in a clawed hand. Controlled precisely from as far as four kilometres;
#   hidden under the sand for surprise attacks; its claw cuts flesh and metal; the water
#   blocks projectiles. Weak to heat. Stats C B A B D D.
# - JoJo Wiki, Eyes of Heaven ★ N'Doul (https://jojowiki.com/Eyes_of_Heaven/N%27Doul):
#   blind (he cannot lock on, he walks slowly with his cane); his Style Action switches
#   between N'Doul standing and N'Doul sitting while the player steers Geb; a blow on his
#   body brings Geb back. Cane: an inward swing, an outward swing that knocks down, a
#   stab that knocks back. Geb: a stab, horizontal and diagonal whips, a claw, a hand that
#   punches and sends flying, a hand that uppercuts, a punch into the ground. Skills: "Not
#   another step closer..." (Geb rises from the ground in a water spout at the target's
#   feet, launching), "No need to hold back!" (Geb whips round an area, 8 hits and a final
#   knockback; EX: more damage, one more hit, more range), "I need to pull back!" (Geb
#   comes back from any distance and surrounds him with water that strikes whoever is
#   near and shields him from projectiles). Dual Heat Attack "Shoot him!" (Geb grabs the
#   opponent, slams them down, strikes from below, impales them with a spike).
#
# What changes here, and why:
# - Blind: he aims where he last *heard* the opponent (kit field `hears`): walking,
#   dashing, striking or being struck makes a sound; standing still or guarding does not.
#   That is how he fights in the manga, and why standing still beats him.
# - The Stand key: a tap brings Geb out at his side (its moves, from him); held, Geb goes
#   off under remote control across the whole arena while he sits, defenseless.
# - EoH has no HHA nor GHA: the HHA is the EX version of "No need to hold back!", the GHA
#   is his Dual Heat Attack, "Shoot him!".
# Feel: a sniper with a cane. Keep moving and he finds you; stop, and he loses you.

name = "N'Doul"
max_hp = 900
walk_speed = 82  # blind: a slow walk, feeling the way with his cane
strength = 1.1
hears = true
style = { type = "stance_toggle", off = "base", on = "geb", remote = "geb", remote_range = 380, remote_speed = 190 }

