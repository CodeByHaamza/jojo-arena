# Esidisi (Part 2) - Pillar Man of the flame. GDD: "Homme du Pilier - Zoneur brûlant":
# he fights at range by pumping his own blood out at five hundred degrees, and the
# hotter it gets the more it costs him. Frames (_f) are at 60 per second.
#
# Nature "pillar_man": the Ripple burns him double, and so does the sun.
# Style key: Flame Mode. In it his veins open and every blow carries boiling blood -
# several of those moves take a little of his own life, because that is what they are.
# Feel: the one who weeps while he kills you, and does not stop.

name = "Esidisi"
max_hp = 1200
walk_speed = 100
nature = "pillar_man"
style = { type = "stance_toggle", off = "base", on = "flame" }

[stances.base]
