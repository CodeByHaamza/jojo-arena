# Muhammad Avdol (Part 3) - Magician's Red. GDD: "Stand · Zoner feu": mid range, zone
# control. Crossfire Hurricane, ropes of fire that bind; Great Heat Attack: Crossfire
# Hurricane Special.
#
# Sources (read on 24/10/2026, through search results; jojowiki.com could not be
# opened directly from where this was written):
# - JoJo Wiki, "Magician's Red" (https://jojowiki.com/Magician's_Red): a close-range
#   Stand that freely makes and shapes fire, hot enough to melt metal in the air; it can
#   set off its flames from afar; a single kick from it broke Judgement's armor.
# - JoJo Wiki, ASBR Avdol (https://jojowiki.com/All-Star_Battle_R/Muhammad_Avdol),
#   Mizuumi and StrategyWiki ASBR move lists:
#   * "Crossfire Hurricane": Magician's Red casts a fire ankh that flies forward.
#   * "Crossfire Hurricane Variation": a delayed ankh trap; the button held sets how far
#     away it erupts (30 for the ankh, 65 for the eruption in ASBR).
#   * "Red Bind!": ropes of flame come out of his hand, then Magician's Red makes the
#     opponent explode.
#   * Stand skills: "I'll burn you to cinders!" (Magician's Red bursts flame from its
#     body and knocks the opponent into the air: an anti-air), "Flaming Detector" (a
#     slow flame that homes in on the opponent; Avdol can act while it flies), "HELL 2
#     U!" (a Stand rush of up to three hits in R), "Now's my chance!" (a counter).
#   * Heart Heat Attack "Give me four wishes instead!": Magician's Red kicks forward.
#   * Great Heat Attack (Crossfire Hurricane Special): a ring of ankh-shaped flames,
#     then a barrage.
# Choices for a top-down arena:
# - The Variation's distance is the aimed point (mouse or right stick) instead of
#   three buttons: the same choice, made where it reads best from above.
# - Red Bind becomes a rope thrown in a line: the binding is the move, so it is
#   `shape = "line"` and unblockable, not a fist.
# - The ASBR normals with a heavy button call Magician's Red: so do his third light
#   blow and his heavy blow here, with the Stand called back.
# - Everything Magician's Red touches catches fire (`ignite_s`): it keeps burning
#   after the blow, which is what makes him a zoner and not a brawler.
# Not in yet: the Flaming Detector also shows where an invisible opponent is (Vanilla
# Ice); it will, once invisibility exists.
#
# Feel: a calm, proud fortune teller who never runs after anyone. Keep your distance
# and you burn; come close and the bird is already there.

