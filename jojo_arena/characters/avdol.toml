# Muhammad Avdol (Part 3) - Magician's Red. GDD: "Stand · Zoner feu": mid range, zone
# control. Crossfire Hurricane, ropes of fire that bind; Great Heat Attack: Crossfire
# Hurricane Special.
#
# Sources. First written on 24/10/2026 from search summaries; re-read on 15/11/2026 on
# the page itself, and the kit brought in line with it at the owner's request ("fais
# comme dans ASBR"):
# - JoJo Wiki, "Magician's Red" (https://jojowiki.com/Magician's_Red): a close-range
#   Stand that freely makes and shapes fire, hot enough to melt metal in the air; it can
#   set off its flames from afar; a single kick from it broke Judgement's armor.
# - JoJo Wiki, ASBR Avdol (https://jojowiki.com/All-Star_Battle_R/Muhammad_Avdol):
#   * HP 1000. Normals, Stand off: a slapping hand, a two-hit upward punch that
#     launches, a swipe from Magician's Red. Stand on: the Stand slaps forward, kicks
#     forward, then breathes fire in four hits.
#   * Throw "Red Bind!": Magician's Red binds the opponent with rope-like flame, lets
#     go, and breathes fire into their face.
#   * "Crossfire Hurricane": a fire ankh that flies forward; it disappears if Avdol
#     takes damage.
#   * "Crossfire Hurricane Variation": a delayed ankh trap; the button held sets how far
#     away it erupts (30 for the ankh, 65 for the eruption).
#   * "Must I do this the hard way?": the ropes of Red Bind thrown at range, three hits;
#     the heavy version binds the opponent and leaves them open. It can be blocked.
#   * Stand skills: "I'll burn you to cinders!" (Magician's Red bursts flame outward and
#     launches: a reversal and an anti-air), "Flaming Detector" (a slow homing flame;
#     Avdol can act while it flies; it disappears if he is hit), "HELL 2 U!" (a Stand
#     rush whose last hit walls), "Now's my chance!" (Magician's Red charges, then
#     punches downward after a short delay and launches; it absorbs one strike, and a
#     strike against it releases the punch early).
#   * Heart Heat Attack "Give me four wishes instead!": Magician's Red flies forward in
#     a kick.
#   * Great Heat Attack (Crossfire Hurricane Special): a ring of ankh-shaped flames,
#     then a barrage.
# Choices for a top-down arena:
# - The Variation's distance is the aimed point (mouse or right stick) instead of
#   three buttons, and it waits for a step instead of a timer: the same trap, made
#   where it reads best from above.
# - ASBR has three strengths of each skill: we keep the heavy one, the one that shows
#   what the move is for (the ropes that bind, the punch that launches).
# - The throw is his neutral heavy blow (as DIO's grab is): the swipe of Magician's Red
#   that used to be there is already his third light blow, as in ASBR.
# - Everything Magician's Red touches catches fire (`status = "burn"`, the same fire
#   as Esidisi's): it keeps burning after the blow, which is what makes him a zoner
#   and not a brawler.
# Not in yet: the Flaming Detector also shows where an invisible opponent is (Vanilla
# Ice); it will, once invisibility exists.
#
# Feel: a calm, proud fortune teller who never runs after anyone. Keep your distance
# and you burn; come close and the bird is already there.

