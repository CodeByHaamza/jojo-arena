# Jean Pierre Polnareff (Part 3) - Silver Chariot. GDD: "Stand · Glass cannon": ultra
# fast thrusts, long combos. Armor Off: monstrous speed and afterimages but no defense.
# Can shoot the rapier's blade (projectile, but disarmed for 2 s).

name = "Jean Pierre Polnareff"
max_hp = 880
walk_speed = 104
style = { type = "stance_toggle", off = "base", on = "stand", stand_body = true }

# Silver Chariot drops its armor: much faster and hits a bit harder, but takes far more.
[buffs.armor_off]
duration_s = 8
speed_mult = 1.5
damage_dealt_mult = 1.15
damage_taken_mult = 1.35
afterimages = true

# Polnareff alone ------------------------------------------------------------------------

[stances.base]
label = "SANS STAND"

[stances.base.moves.light]
label = "DIRECT"
info = "Rapide, s'enchaîne"
