active_f = 3
recovery_f = 10
damage = 30
reach = 14
radius = 10
hitstun_f = 19
knockback = 90
hitstop_f = 4
cancel_on_hit = ["light", "heavy"]

[stances.base.moves.heavy]
label = "COUP DE PIED"
