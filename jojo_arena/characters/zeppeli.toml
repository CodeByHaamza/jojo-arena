# Will A. Zeppeli (Part 1). GDD: "Hamon · Mobilité": fast, leaps high, very good at mid
# range. Hamon through liquids: spat wine that cuts (Hamon Cutter, or Ripple Cutter). Zoom Punch. Ultimate:
# Tornado Overdrive. Frames (_f) are at 60 per second; speeds and knockback in px per s.
#
# Style key held: Hamon breathing (the gauge fills, he stands still). Moves with a
# hamon_cost spend it when there is enough, and strike harder; without, they stay plain.
# Feel: a gentleman who never stays where you hit; light blows, then a cutter from afar.

name = "Will A. Zeppeli"
max_hp = 900
walk_speed = 118
style = { type = "hamon" }

[stances.base]
label = "HAMON"

