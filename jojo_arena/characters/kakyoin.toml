# Emerald Splash!
[stances.stand.moves.special]
shout = "EMERALD SPLASH !"
label = "EMERALD SPLASH"
info = "Salve de 6 émeraudes"
startup_f = 14
active_f = 1
recovery_f = 20

[stances.stand.moves.special.projectile]
look = "gem"
speed = 300
radius = 3
damage = 14
lifetime_s = 1.1
hitstun_f = 12
knockback = 50
hitstop_f = 2
count = 6
spread_deg = 36
homing_deg_s = 30

# Lay a web of threads: when the opponent touches it, it fires emeralds on its own.
[stances.stand.moves.special_alt]
label = "FILS"
info = "Pose un piège (3 max) qui tire tout seul"
