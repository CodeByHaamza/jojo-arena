# Noriaki Kakyoin (Part 3) - Hierophant Green. GDD: "Stand · Trapper": mid range,
# preparation. Emerald Splash, invisible threads laid in the arena (touched = automatic
# volley), grapple on the walls to escape. Great Heat Attack: 20 Metre Radius Emerald
# Splash.
# Feel: never where you want him. He kicks you away, zips off on a tentacle, and the
# arena itself fires at you.

name = "Noriaki Kakyoin"
# Hierophant unravels into tendrils: they are what carries a crate, not its hands.
prop_hold = "tendrils"
max_hp = 980
walk_speed = 108
strength = 0.8  # Hierophant Green: slender, it throws softly
# Hold the Stand key: Hierophant Green leaves him and is steered from afar (GDD "Mode
# contrôle"), up to remote_range px away, at remote_speed px/s.
style = { type = "stance_toggle", off = "base", on = "stand", stand_body = true, remote = "remote", remote_range = 150, remote_speed = 150 }

