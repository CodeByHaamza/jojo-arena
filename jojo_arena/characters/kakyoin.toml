knockback = 60
hitstop_f = 2
count = 4
spread_deg = 30

# Super moves ----------------------------------------------------------------------------

# Heart Heat Attack (1 bar): Hierophant Green bursts out around Kakyoin.
[moves.hha]
shout = "HIEROPHANT !"
label = "HIEROPHANT DÉCHAÎNÉ"
info = "Explosion tout autour"
stand_flash = true
startup_f = 20
active_f = 6
recovery_f = 26
invincible_f = 20
damage = 150
reach = 0
radius = 40
hitstun_f = 36
knockback = 420
hitstop_f = 12
wall_bounce = true
clashable = false
anim = "special"

# Great Heat Attack (2 bars): 20 Metre Radius Emerald Splash. Hierophant Green runs all
# over the arena stretching its threads; for 10 s, touching one fires emeralds at the
# toucher, while Kakyoin keeps fighting.
[moves.gha]
label = "EMERALD SPLASH 20 MÈTRES"
info = "Les fils couvrent toute l'arène 10 s : les toucher déclenche un Emerald Splash"
stand_flash = true
startup_f = 4
active_f = 1
recovery_f = 10
invincible_f = 14
clashable = false
anim = "special"
cinematic = "hierophant_web"
cinematic_at = "start"
cinematic_s = 2.6

[moves.gha.web]
columns = 5
rows = 3
margin = 34
lifetime_s = 10
rearm_s = 0.6
