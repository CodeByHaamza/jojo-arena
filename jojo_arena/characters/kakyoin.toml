# Noriaki Kakyoin (Part 3) - Hierophant Green. GDD: "Stand · Trapper": mid range,
# preparation. Emerald Splash, invisible threads laid in the arena (touched = automatic
# volley), grapple on the walls to escape. Great Heat Attack: 20 Metre Radius Emerald
# Splash.
# Feel: never where you want him. He kicks you away, zips off on a tentacle, and the
# arena itself fires at you.
#
# Sources, read on 15/11/2026 (the owner: "buff Kakyoin, or change his moveset"):
# JoJo Wiki, ASBR Kakyoin (https://jojowiki.com/All-Star_Battle_R/Noriaki_Kakyoin).
# - Stand off, his heavy normal is "a short-range shotgun burst of emeralds": it is now
#   the third blow of his chain, which stopped at two.
# - Stand off, his Emerald Splash is the same volley as with the Stand out, only slower:
#   it had three emeralds here, half a move.
# - Stand on, his heavy normal is "long-range tentacle stabs, hitting up to three times,
#   the last hit launches": the third blow of that chain.
# - "Didn't you notice?" (a throw): "tendrils travel a long distance along the ground;
#   on contact they wrap the opponent, and Hierophant Green fires a point-blank Emerald
#   Splash that sends them flying". It replaces the plain tentacle that pulled in: a
#   trapper needs something a guard does not stop, and this is his.
# - "You're already in my grasp!": the tendrils that spike up under the opponent were
#   already here; they now carry their name.
# Not in: "How's this!" (Hierophant flies forward, then tentacles burst from the ground)
# and his throw "No match for my Stand!": no button left for them. His 900 HP of ASBR are
# not taken either: he is the one who needed help.
# The kicks, the sweep and the grapple are the GDD's, kept as they were.

name = "Noriaki Kakyoin"
# Hierophant unravels into tendrils: they are what carries a crate, not its hands.
prop_hold = "tendrils"
max_hp = 980
walk_speed = 108
strength = 0.8  # Hierophant Green: slender, it throws softly
# Hold the Stand key: Hierophant Green leaves him and is steered from afar (GDD "Mode
# contrôle"), up to remote_range px away, at remote_speed px/s.
style = { type = "stance_toggle", off = "base", on = "stand", stand_body = true, remote = "remote", remote_range = 150, remote_speed = 150 }

