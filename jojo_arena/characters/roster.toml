# Playable roster.
#   kit          = gameplay file in this folder (moves, stats)
#   sprite       = sprite sheet under assets/sprites/ (PNG + TOML). If it is missing, the
#                  game draws a simple shape in `color` instead.
#   stand_sprite = sheet of the Stand, shown beside the fighter while it is out.
#   stand_name, role, blurb = what the character select screen shows.
#   palette      = colors that replace the sheet's key colors (see the sheet's [recolor]).
#                  Only the mannequin uses it; character sheets have their final colors.
#   selectable   = false keeps a fighter out of the character select screen.
#   part         = the JoJo part the character comes from (parts.toml): its tab in the
#                  character select screen.
# Character sheets are generated from characters/looks/<id>.toml by tools/make_sprites.py.

# Part 1: Phantom Blood ------------------------------------------------------------------

[[fighters]]
id = "jonathan"
part = 1
name = "JONATHAN JOESTAR"
kit = "jonathan"
sprite = "jonathan/jonathan"
role = "TANK - HAMON"
blurb = "Coups lourds, grosse vie et Hamon à courte portée : il encaisse, puis il écrase."
blurb_en = "Heavy blows, a big life and short-range Hamon: he takes it, then he crushes."
color = "#3d63c8"
aura = "#ffd040"

