# The answer of the pose counter: "Your next line is..." - and it was.
[stances.base.moves.foreseen]
shout = "BINGO !"
label = "TA PROCHAINE RÉPLIQUE SERA..."
label_en = "YOUR NEXT LINE IS..."
info = "Pose : il prédit que l'adversaire refera son dernier coup. S'il a raison, contre gratuit"
info_en = "Pose: he predicts the opponent repeats their last attack. If right, a free counter"
hamon = true
startup_f = 2
