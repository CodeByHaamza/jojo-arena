# With a direction: a grenade rolled along the ground, pin pulled.
[stances.base.moves.special_alt]
label = "GRENADE"
info = "Avec une direction : une grenade dégoupillée roule et explose une seconde après"
info_en = "With a direction: a grenade rolls along and blows up a second later"
startup_f = 12
active_f = 1
recovery_f = 18
cooldown_s = 1.5
anim = "special"

[stances.base.moves.special_alt.projectile]
look = "grenade"
