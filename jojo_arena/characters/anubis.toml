# Anubis (Part 3) - the sword that possesses whoever draws it. A fighter of our own: it is
# in neither All-Star Battle R nor Eyes of Heaven (Capcom's JoJo's Venture, 1998, had it).
# Asked for by the owner on 17/11/2026, as a fighter only this game has.
#
# Sources, read on 17/11/2026:
# - JoJo Wiki, "Anubis" (https://jojowiki.com/Anubis): a curved, double-edged Shamshir
#   blade with a jewelled cross-guard. It controls whoever draws it, whatever their will.
#   It remembers the attacks used against it and counters them: the same tactic fails
#   twice; it grows faster and stronger during a fight. Its blade passes through stone,
#   walls and bodies without harming them, and cuts a target hidden behind a pillar
#   without touching the pillar. It does not improve its wielder's technique (Chaka swings
#   it like an amateur). A broken blade keeps working. Stats B B E A E C. Its users: Chaka,
#   Khan, Polnareff; a boy who threw it, past his targets; a cow.
#   "I know all your moves now. Even with a different wielder... Once I've fought someone
#   once, I n-n-n-n-NEVER lose twice!" (Khan, chapter 196).
# - JoJo Wiki, "Chaka" (https://jojowiki.com/Chaka): the farmhand who drew it first, near
#   the Nile; Polnareff beat him at Kom Ombo. "Khan" (https://jojowiki.com/Khan): the barber
#   of Edfu who drew it next; Jotaro broke the blade in two.
#
# How it fights here, and why:
# - It learns (kit table [learn]): a blow it takes is remembered; the next time, if it is
#   free to move, it parries that blow, and each new blow remembered makes it stronger and
#   faster. A combo still lands: in hitstun it is not free. That is its power, and its
#   weakness: show it something new every time.
# - The blade passes through: its thrust goes through a guard (unblockable), its thrown
#   blade through props (`phasing`), its long cut reaches behind what stands in the way.
# - Its wielder fights like an amateur: plain slashes, nothing fancy.
# - The Heart Heat Attack is Khan's "I NEVER lose twice!": a counter. The Great Heat
#   Attack: the blade straight through the pillar and into whoever hides behind it.
# - The Stand key does nothing: Anubis has no other form to call; it is the sword.
# Feel: the longer the fight lasts, the worse it gets for you.

