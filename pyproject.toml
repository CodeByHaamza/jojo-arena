[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jojo-arena"
version = "0.1.0"
description = "Unofficial, free and non-commercial 1v1 top-down pixel-art arena fighter fan game."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CodeByHaamza" }]
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
jojo-arena = "jojo_arena.app:main"

[tool.setuptools.packages.find]
include = ["jojo_arena*"]

[tool.setuptools.package-data]
jojo_arena = ["assets/**/*"]
"*" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root too: a few tests and tools import `tools.<module>`, and a
# pip install -e only puts `jojo_arena` on the path.
pythonpath = [".", "tools"]

[tool.coverage.run]
source = ["jojo_arena", "tools"]
omit = ["jojo_arena/ui/test_pattern.py"]

[tool.coverage.report]
# The simulation and the data are the parts a test can really pin down; drawing code is
# covered by the screens the tests open, not line by line.
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "# pragma: no cover",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
