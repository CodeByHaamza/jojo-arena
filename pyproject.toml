[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jojo-arena"
version = "0.1.0"
description = "Unofficial, free and non-commercial 1v1 top-down pixel-art arena fighter fan game."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CodeByHaamza" }]
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
jojo-arena = "jojo_arena.app:main"

[tool.setuptools.packages.find]
include = ["jojo_arena*"]

[tool.setuptools.package-data]
jojo_arena = ["assets/**/*"]
"*" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
