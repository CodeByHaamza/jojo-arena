name: Release

# A merge into main is a release. The version is the one in jojo_arena/__init__.py
# (`make release-pr VERSION=x.y.z` wrote it on develop, and the CI checked it was new):
# the tests run on Linux (home server) and Windows, the .exe is built and tried, then
# the tag vX.Y.Z and the Release are created, with the changelog section as notes.
# A version already tagged publishes nothing: it says so and succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read by default: the linux job runs on the home server and must hold no token that
# can push, tag or publish. Only the windows job, on GitHub, gets to write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  linux:
    # Run by hand from develop (the default branch), it would tag develop's head.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, maison]
    timeout-minutes: 30
    env:
      # Coverage through sys.monitoring (Python 3.12): the classic tracer is three times slower.
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Test
        run: pytest -q -n auto --cov --cov-report=term-missing

      - name: Coverage summary
        if: always()
        run: |
          echo "### Couverture" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  windows:
    if: github.ref == 'refs/heads/main'
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write # the tag and the Release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: is this version published already?

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Which version
        id: version
        shell: bash
        run: |
          version=$(python tools/release_pr.py --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::notice::v$version is already published: nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: pytest -q -n auto

      - name: Build the .exe
        if: steps.version.outputs.publish == 'true'
        run: python tools/build_exe.py

      - name: Smoke test the .exe
        if: steps.version.outputs.publish == 'true'
        run: |
          $run = Start-Process -FilePath dist\JoJoArena.exe -ArgumentList '--demo', '--frames', '600' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "JoJoArena.exe exited with code $($run.ExitCode)" }

      # The notes are the CHANGELOG section of this version, under the usual header.
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: python tools/release_notes.py "v${{ steps.version.outputs.version }}" release-notes.md

      - name: Publish the Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" dist/JoJoArena.exe `
            --target "${{ github.sha }}" `
            --title "JoJo Arena v$env:VERSION" `
            --notes-file release-notes.md
