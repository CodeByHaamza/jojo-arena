name: Release

# Pushing a tag such as v0.1.0 builds the Windows .exe and publishes it in a Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the version matches the tag
        shell: bash
        run: |
          version=$(python -c "import jojo_arena; print(jojo_arena.__version__)")
          tag="${{ github.ref_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "jojo_arena.__version__ is $version but the tag is $tag" >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest -q -n auto

      - name: Build the .exe
        run: python tools/build_exe.py

      - name: Smoke test the .exe
        run: |
          $run = Start-Process -FilePath dist\JoJoArena.exe -ArgumentList '--demo', '--frames', '600' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "JoJoArena.exe exited with code $($run.ExitCode)" }

      # The notes are the CHANGELOG section of this version, under the usual header.
      - name: Release notes
        run: python tools/release_notes.py "${{ github.ref_name }}" release-notes.md

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/JoJoArena.exe `
            --title "JoJo Arena ${{ github.ref_name }}" `
            --notes-file release-notes.md `
            --verify-tag
