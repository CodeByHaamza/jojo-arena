name: CI

# Lint and tests on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      # Every screen of the game, to look at without running it.
      - name: Screenshot tour
        run: python tools/screenshot_tour.py screenshots/tour

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/tour
          retention-days: 14

  # A test build of the .exe for every push to main, downloadable from the run's page.
  test-exe:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the .exe
        run: python tools/build_exe.py

      - name: Smoke test the .exe
        run: |
          $run = Start-Process -FilePath dist\JoJoArena.exe -ArgumentList '--demo', '--frames', '600' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "JoJoArena.exe exited with code $($run.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: JoJoArena-test-exe
          path: dist/JoJoArena.exe
          retention-days: 7
