name: CI

# Lint and tests on every pull request, once per push. Pull requests go to develop; a
# merge into main is a release (release.yml).
#
# Where it runs: a branch of this repository is tested on the home server's runner
# (label `maison`); a pull request from a fork runs on GitHub's Ubuntu, after the owner
# approves it. The runner itself also refuses any job that does not come from this
# repository (its job-started hook, in the `maison` repository): a fork that rewrites
# `runs-on` below still never runs on the server.
on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# A new push on the same pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  check:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted", "maison"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, for the version check into main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      # Spread over the runner's cores (three on the home server, set by the runner).
      - name: Test
        run: pytest -q -n auto

      # Into main, the version must be new and the changelog must have its section.
      - name: A new version
        if: github.base_ref == 'main'
        run: python tools/release_pr.py --check

      # Every screen of the game, to look at without running it.
      - name: Screenshot tour
        run: python tools/screenshot_tour.py screenshots/tour

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/tour
          retention-days: 7
