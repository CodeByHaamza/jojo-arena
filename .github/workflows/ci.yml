name: CI

# Lint and tests on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push on the same branch replaces the run in progress (but never on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  # Lint first, on its own: it answers in under a minute and catches most mistakes.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  # The whole suite on Windows (where the game ships) and Linux (where contributors are).
  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Spread over every core of the runner: the suite is long (900+ tests).
      - name: Test
        run: pytest -q -n auto --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo "### Couverture (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

      # Every screen of the game, to look at without running it.
      - name: Screenshot tour
        if: matrix.os == 'windows-latest'
        run: python tools/screenshot_tour.py screenshots/tour

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: screenshots
          path: screenshots/tour
          retention-days: 14

  # A test build of the .exe for every push to main and every pull request,
  # downloadable from the run's page: try a change without tagging a release.
  test-exe:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the .exe
        run: python tools/build_exe.py

      - name: Smoke test the .exe
        run: |
          $run = Start-Process -FilePath dist\JoJoArena.exe -ArgumentList '--demo', '--frames', '600' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "JoJoArena.exe exited with code $($run.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: JoJoArena-test-exe
          path: dist/JoJoArena.exe
          retention-days: 7
